<title>睁眼之前</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600;900&display=swap" media="print" onload="this.media='all'">
<style>
/* 片头样片第一版（11-12）。词照 底稿/门面/片头_词_第四版.md，五十一行：序、四处（一处一纪）、收。
   这一版做全的是序、第一处（月银纪，六幅新画）和收；第二、三、四处先拿四纪主画各一幅顶着，词是全的，镜头在一幅画上挪。
   版式：整屏一出戏。底下一层画（WebGL：镜头、纸层错开、缓缓流动、火光、灯闪、烧开），上面一层字和火星（2D 画布），最上面是几枚钮。
   宽屏画铺满，字压在下沿；竖屏画占中间一块、四边虚进黑里，字在画下面的黑底上。
   时间是一条能前后拖的线：点一下屏幕到下一句，顶上四张牌是四处的入口，「跳过」直接到末尾。 */
:root{
  color-scheme:dark;
  --ink:#04050a;        /* 底色：她的黑暗 */
  --pale:#f1eef5;       /* 亮字 */
  --stone:#c9ccd8;      /* 正文字 */
  --dim:#8c90a4;        /* 小字 */
  --ember:255,176,104;  /* 那粒火 */
  --teal:127,227,216;   /* 神殿的青火（睁眼那一下） */
  --serif:"Noto Serif SC","Songti SC","STSong","SimSun",serif;
}
html,body{height:100%;-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{margin:0;background:var(--ink);color:var(--stone);font-family:var(--serif);overflow:hidden;position:relative}
[hidden]{display:none!important}
#view{position:absolute;inset:0;overflow:hidden;overflow:clip;background:var(--ink);touch-action:manipulation;-webkit-user-select:none;user-select:none;cursor:pointer}
#view canvas{position:absolute;left:0;top:0;width:100%;height:100%;display:block}
#ui{position:absolute;inset:0;pointer-events:none;box-sizing:border-box;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:calc(10px + env(safe-area-inset-top,0px)) calc(12px + env(safe-area-inset-bottom,0px));
  display:flex;flex-direction:column;justify-content:space-between}
#top{display:flex;align-items:center;justify-content:space-between;gap:12px;transition:opacity .6s}
#top.off{opacity:0}
#deck{display:flex;align-items:center;gap:8px;pointer-events:auto}
#deck button{appearance:none;border:0;background:none;color:var(--dim);font:inherit;font-size:12px;letter-spacing:.2em;padding:8px 4px;cursor:pointer;opacity:.7}
#deck button:hover,#deck button:focus-visible{opacity:1;color:var(--pale)}
#deck .slot{width:22px;height:33px;padding:0;border-radius:3px;border:1px solid rgba(201,204,216,.28);background-size:cover;background-position:center;opacity:.55;position:relative;transition:opacity .5s,border-color .5s,box-shadow .5s}
#deck .slot::after{content:"";position:absolute;inset:-6px}
#deck .slot.got{opacity:1;border-color:rgba(241,238,245,.6);box-shadow:0 0 10px rgba(var(--ember),.35)}
#deck .slot.now{border-color:rgba(var(--ember),.9)}
#deck.away .slot{opacity:0}
#skip{appearance:none;pointer-events:auto;border:1px solid rgba(201,204,216,.3);background:rgba(4,5,10,.35);color:var(--stone);font:inherit;font-size:13px;letter-spacing:.3em;padding:7px 8px 7px 12px;border-radius:2px;cursor:pointer}
#skip:hover,#skip:focus-visible{color:var(--pale);border-color:rgba(241,238,245,.7)}
button:focus-visible{outline:1px solid rgba(var(--ember),.9);outline-offset:3px}
#end{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;text-align:center;pointer-events:auto;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));background:rgba(4,5,10,.0)}
#end p{margin:0;max-width:26em;color:var(--stone);font-size:15px;line-height:2;letter-spacing:.08em}
#end .quote{color:var(--pale);font-size:clamp(20px,3.4vh,30px);letter-spacing:.24em;font-weight:600}
#end button{appearance:none;border:1px solid rgba(201,204,216,.4);background:none;color:var(--pale);font:inherit;font-size:15px;letter-spacing:.3em;padding:10px 14px 10px 20px;border-radius:2px;cursor:pointer}
#end button:hover{border-color:rgba(var(--ember),.9)}
#load{align-self:center;color:var(--dim);font-size:12px;letter-spacing:.3em;opacity:0;transition:opacity .4s}
#load.on{opacity:.8}
</style>

<div id="view">
  <canvas id="gl" aria-hidden="true"></canvas>
  <canvas id="fx" aria-hidden="true"></canvas>
  <div id="ui">
    <div id="top">
      <nav id="deck" aria-label="四处">
        <button type="button" data-go="pre" id="go-pre">序</button>
        <button type="button" class="slot" data-go="0" id="go-0" aria-label="第一处，月银纪"></button>
        <button type="button" class="slot" data-go="1" id="go-1" aria-label="第二处，纷争纪"></button>
        <button type="button" class="slot" data-go="2" id="go-2" aria-label="第三处，山铜纪"></button>
        <button type="button" class="slot" data-go="3" id="go-3" aria-label="第四处，迷宫纪"></button>
        <button type="button" data-go="coda" id="go-coda">收</button>
      </nav>
      <button type="button" id="skip">跳过</button>
    </div>
    <div id="load">画还在路上</div>
  </div>
  <div id="end" hidden>
    <p class="quote">生者自有去处，亡魂也有归程。</p>
    <p>片头到这里。往下接死之神殿和牌桌。</p>
    <button type="button" id="again">再看一遍</button>
  </div>
</div>

      g.save(); g.font = fontOf(hp, 400); g.textAlign = 'center'; g.fillStyle = `rgba(140,144,164,${a * .9})`; g.fillText('点一下屏幕，到下一句', W / 2, H - hp * 3.4 - 12); g.restore(); }
    syncDom(b);
  }
  /* 睁眼：青白的光从当中漫上来 */
  function drawWake(t) {
    const k = sstep(0, 1.6, t), r = Math.hypot(W, H) * (.08 + k * .9), gr = g.createRadialGradient(W / 2, H * .5, 0, W / 2, H * .5, r);
    gr.addColorStop(0, `rgba(236,255,250,${k})`); gr.addColorStop(.5, `rgba(127,227,216,${.75 * k})`); gr.addColorStop(1, 'rgba(60,150,150,0)');

    deck.classList.toggle('away', T >= CODA0 + .2);
  }
  function finish() { if (ended) return; ended = true; endEl.hidden = false; top.classList.add('off'); }

  /* ---------- 手 ---------- */
  function seek(t) { T = clamp(t, 0, TOTAL - .02); ended = false; endEl.hidden = true; top.classList.remove('off'); streaks.length = 0; drops.length = 0; }
  function next() {
    if (ended) return; hintSeen = true;
    const b = beatAt(T), lt = T - b.t0;
    if (b.kind === 'answer' && lt < WAIT) { T = b.t0 + WAIT; return; }      /* 应了：这一句当下就亮 */
    if (b.kind === 'answer' && lt < WAIT + 1.2) return;
    const nb = BEATS[b.i + 1]; if (!nb) return;
    if (b.kind === 'card' && lt < b.dur * .6) return;                                                 /* 牌正在出来，别跳过去 */
    T = nb.t0;
  }
  function prevBeat() { const b = beatAt(T); seek(BEATS[Math.max(0, b.i - (T - b.t0 < 1 ? 1 : 0))].t0); }
  view.addEventListener('pointerdown', e => { if (e.target.closest('button')) return; next(); });
  addEventListener('keydown', e => {
    if (e.key === ' ' || e.key === 'Enter' || e.key === 'ArrowRight') { if (document.activeElement && document.activeElement.tagName === 'BUTTON' && e.key !== 'ArrowRight') return; e.preventDefault(); next(); }
    else if (e.key === 'ArrowLeft') { e.preventDefault(); prevBeat(); }
  });
  deck.addEventListener('click', e => { const bt = e.target.closest('button'); if (!bt) return; const k = bt.dataset.go; seek(START[k === 'pre' || k === 'coda' ? k : +k]); });
  $('#skip').addEventListener('click', () => { seek(ENDB.t0 - 3.2); });
  $('#again').addEventListener('click', () => { seek(0); });
  document.addEventListener('visibilitychange', () => { last = -1; });

  /* 字体到了重排一遍 */
  if (document.fonts && document.fonts.load) {
    const all = BEATS.map(b => b.text || '').join('') + ERAS.map(e => e.title + e.name + e.years + e.nth).join('') + '点一下屏幕，到下一句应这一句';
    Promise.all([400, 600, 900].map(w => document.fonts.load(`${w} 24px "Noto Serif SC"`, all))).then(() => layoutCache.clear()).catch(() => {});
  }
  window.__pv = { tick, seek, next, get T() { return T; }, get total() { return TOTAL; }, beats: BEATS, start: START, get scene() { return sceneNow; }, get gl() { return glOk; }, get frames() { return fcount; }, play: v => { playing = v; }, imgs };
  raf(frame);
})();
