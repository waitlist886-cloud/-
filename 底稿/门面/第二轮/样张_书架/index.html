<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>书架样张</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600;900&display=swap">
<style>
/* 书架样张（11-23）：若娜瓦殿里的一面书架，能指、能抽出《公会委托存档》翻开。动效只动 transform 和 opacity。 */
:root{
 --ink:#232a36;--ink2:#56606f;--rule:rgba(84,104,140,.42);--rule2:rgba(84,104,140,.22);
 --stone:#d9dde2;--fire:#7fe6dc;--fire2:#3fb8b0;
 --late:#6b5644;   /* 后来的书记，旧墨 */
 --qing:#2b8c88;   /* 清点的人，青墨 */
 --wax:#7c2a26;    /* 红边的封箱蜡 */
 --blue:#3d5f9a;
 --serif:'Noto Serif SC','Songti SC','STSong','SimSun',serif;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#06080d;color:#e6e9ee;font-family:var(--serif);-webkit-font-smoothing:antialiased}
button{font-family:inherit}
[hidden]{display:none!important}

/* ===== 殿里的书架 ===== */
#hall{position:fixed;inset:0;overflow:hidden}
#hall .bg{position:absolute;inset:0;background:url(img/shelf_main.webp) center 40%/cover no-repeat,radial-gradient(ellipse 60% 70% at 50% 35%,#24324c,#0b1020 70%,#05070c)}
#hall .bg::after{content:'';position:absolute;inset:0;background:linear-gradient(180deg,rgba(5,7,12,.15) 0,rgba(5,7,12,0) 30%,rgba(5,7,12,.25) 52%,rgba(5,7,12,.82) 78%,rgba(5,7,12,.95) 100%)}
.flame{position:absolute;width:26px;height:40px;margin:-20px 0 0 -13px;border-radius:50% 50% 45% 45%/60% 60% 40% 40%;background:radial-gradient(ellipse at 50% 70%,rgba(220,255,250,.95),rgba(127,230,220,.65) 40%,rgba(63,184,176,0) 72%);opacity:.0;pointer-events:none;animation:flick 3.2s ease-in-out infinite}
@keyframes flick{0%,100%{opacity:.55;transform:scale(1,1)}40%{opacity:.8;transform:scale(.92,1.08)}70%{opacity:.6;transform:scale(1.04,.96)}}
.cap{position:absolute;left:0;right:0;top:4.2vh;text-align:center;pointer-events:none}
.cap h1{margin:0;font-weight:600;font-size:15px;letter-spacing:.9em;text-indent:.9em;color:rgba(214,240,238,.82)}
.cap p{margin:12px 0 0;font-size:13px;letter-spacing:.32em;color:rgba(214,226,236,.55)}

.shelf{position:absolute;left:50%;bottom:17vh;transform:translateX(-50%);display:flex;align-items:flex-end;gap:34px;padding:0 28px}
.grp{display:flex;align-items:flex-end;gap:5px;position:relative}
.grp>.lab{position:absolute;left:0;right:0;bottom:-46px;text-align:center;font-size:11.5px;letter-spacing:.5em;color:rgba(200,214,226,.46);white-space:nowrap}
.ledge{position:absolute;left:50%;bottom:calc(17vh - 22px);transform:translateX(-50%);width:min(1340px,96vw);height:22px;border-radius:3px;
 background:linear-gradient(180deg,#c9ced6 0,#9da5b2 18%,#6c7585 60%,#414856 100%);box-shadow:0 18px 40px rgba(0,0,0,.7),0 -1px 0 rgba(255,255,255,.4) inset}
.ledge::before{content:'';position:absolute;left:0;right:0;top:100%;height:34px;background:linear-gradient(180deg,rgba(0,0,0,.55),rgba(0,0,0,0))}

.sp{all:unset;position:relative;display:block;height:var(--h,320px);cursor:pointer;transform-origin:50% 100%;transition:transform .35s cubic-bezier(.2,.7,.2,1),opacity .35s}
.sp img{display:block;height:100%;width:auto;filter:drop-shadow(0 6px 10px rgba(0,0,0,.55))}
.sp .fb{display:block;height:100%;width:var(--w,52px);border-radius:3px 3px 2px 2px;background:var(--fbc,#334)}
.sp::after{content:'';position:absolute;inset:-6px -8px 0;border-radius:6px;background:radial-gradient(ellipse 70% 60% at 50% 45%,rgba(127,230,220,.42),rgba(127,230,220,0) 70%);opacity:0;transition:opacity .35s;pointer-events:none;mix-blend-mode:screen}
.sp .t{position:absolute;left:50%;top:var(--ty,14%);transform:translateX(-50%);writing-mode:vertical-rl;font-size:12.5px;line-height:1;letter-spacing:.3em;font-weight:600;color:var(--tc,#e9dcae);white-space:nowrap;pointer-events:none;padding:9px 5px 6px;background:var(--lb,rgba(14,18,30,.78));border:1px solid rgba(232,207,138,.38);box-shadow:0 2px 6px rgba(0,0,0,.4)}
.sp .m{display:none}
.sp:hover,.sp:focus-visible,.sp.lit{transform:translateY(-12px)}
.sp:hover::after,.sp:focus-visible::after,.sp.lit::after{opacity:1}
.sp:focus-visible{outline:none}
.sp.flip img{transform:scaleX(-1)}
.sp.hot::before{content:'';position:absolute;inset:8% 10%;border-radius:4px;background:radial-gradient(ellipse at 50% 50%,rgba(255,150,80,.5),rgba(255,120,60,0) 70%);mix-blend-mode:screen;animation:ember 2.6s ease-in-out infinite;pointer-events:none}
@keyframes ember{0%,100%{opacity:.25}50%{opacity:.7}}
.sp.hot:hover,.sp.hot.lit{transform:translateY(-3px)}
.sp.hot.shake{animation:shake .42s}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-4px)}45%{transform:translateX(4px)}70%{transform:translateX(-2px)}}
.sp.far{opacity:.62}.sp.farther{opacity:.4}
.sp.grow .pg{position:absolute;left:12%;right:12%;top:8%;bottom:4%;background:repeating-linear-gradient(180deg,rgba(255,255,255,.0) 0 7px,rgba(255,255,255,.55) 7px 8px);transform-origin:50% 100%;animation:grow 7s ease-in-out infinite;pointer-events:none;mix-blend-mode:screen}
@keyframes grow{0%{transform:scaleY(.2);opacity:.15}60%{transform:scaleY(1);opacity:.55}100%{transform:scaleY(1);opacity:0}}
.slot{width:70px;height:var(--h,300px);border-left:1px dashed rgba(200,214,226,.22);border-right:1px dashed rgba(200,214,226,.22);opacity:.7}

.card{all:unset;position:relative;cursor:pointer;width:118px;height:168px;transform:rotate(4deg);transform-origin:50% 100%;transition:transform .35s}
.card .pp{position:absolute;inset:0;background:url(img/paper.webp) center/cover,#e8e5dc;border-radius:2px;box-shadow:0 10px 24px rgba(0,0,0,.6)}
.card .mini{position:absolute;inset:14px 10px;display:grid;grid-template-rows:20px repeat(6,1fr);border:1px solid var(--rule)}
.card .mini i{border-bottom:1px solid var(--rule2)}
.card .mini b{font-size:10px;letter-spacing:.3em;color:var(--ink);text-align:center;line-height:20px;border-bottom:1px solid var(--rule);font-weight:600}
.card:hover,.card:focus-visible{transform:rotate(1deg) translateY(-10px)}
.card:focus-visible{outline:none}

.tip{position:absolute;left:50%;bottom:4.2vh;transform:translate(-50%,6px);text-align:center;opacity:0;transition:opacity .3s,transform .3s;pointer-events:none;width:min(720px,92vw)}
.tip.on{opacity:1;transform:translate(-50%,0)}
.tip .n{font-size:22px;letter-spacing:.3em;font-weight:600;color:#eef3f5}
.tip .a{margin-top:8px;font-size:13px;letter-spacing:.16em;color:rgba(214,226,236,.72)}
.tip .e{margin-top:4px;font-size:12px;letter-spacing:.3em;color:rgba(127,230,220,.85)}
.tip.hot .n{color:#f2c9a8}.tip.hot .e{color:rgba(242,176,130,.85)}

.toast{position:fixed;left:50%;top:14vh;transform:translate(-50%,-8px);padding:12px 22px;background:rgba(10,14,22,.88);border:1px solid rgba(127,230,220,.35);color:#dff3f1;font-size:14px;letter-spacing:.2em;opacity:0;transition:opacity .3s,transform .3s;pointer-events:none;z-index:50;white-space:nowrap}
.toast.on{opacity:1;transform:translate(-50%,0)}

/* ===== 抽出、转到封面、翻开 ===== */
#stage{position:fixed;inset:0;z-index:20;perspective:2400px;pointer-events:none}
#stage .dim{position:absolute;inset:0;background:rgba(4,6,10,.82);opacity:0}
.b3{position:absolute;left:50%;top:50%;width:var(--W);height:var(--H);margin:calc(var(--H) / -2) 0 0 calc(var(--W) / -2);transform-style:preserve-3d}
.b3 .f{position:absolute;inset:0;backface-visibility:hidden}
.b3 .front{transform:translateZ(calc(var(--T) / 2));transform-style:preserve-3d}
.b3 .pages{position:absolute;inset:9% 6% 9% 5%;background:repeating-linear-gradient(90deg,#e7e3d8 0 2px,#cfcabd 2px 3px);transform:translateZ(-3px);border-radius:0 3px 3px 0}
.b3 .lid{position:absolute;inset:0;transform-origin:0 50%;transform-style:preserve-3d}
.b3 .lid .out,.b3 .lid .in{position:absolute;inset:0;backface-visibility:hidden;border-radius:2px 6px 6px 2px}
.b3 .lid .out{background:url(img/guild_cover.webp) center/100% 100% no-repeat;filter:drop-shadow(0 26px 40px rgba(0,0,0,.7))}
.b3 .lid .in{transform:rotateY(180deg);background:linear-gradient(90deg,#16224a,#22345f);box-shadow:inset 0 0 0 10px rgba(212,177,92,.18)}
.b3 .lid .in img{position:absolute;left:50%;top:50%;width:46%;transform:translate(-50%,-50%) rotate(-2deg);opacity:.9}
.b3 .spine{width:var(--T);left:0;transform:translateX(calc(var(--T) / -2)) rotateY(-90deg);background:url(img/guild_spine.webp) center/100% 100% no-repeat,linear-gradient(90deg,#1a2850,#2b3f74,#1a2850);border-radius:3px}
.b3 .back{transform:rotateY(180deg) translateZ(calc(var(--T) / 2));background:linear-gradient(160deg,#22345f,#0d1530)}
.covt{position:absolute;left:54%;top:36.5%;transform:translate(-50%,-50%);text-align:center;width:50%}
.covt b{display:block;font-size:calc(var(--W) * .058);white-space:nowrap;letter-spacing:.14em;text-indent:.14em;color:#e8cf8a;font-weight:900}
.covt i{display:block;font-style:normal;margin-top:8px;font-size:calc(var(--W) * .024);white-space:nowrap;letter-spacing:.34em;text-indent:.34em;color:rgba(232,207,138,.75)}
.spt{position:absolute;left:50%;top:30%;transform:translateX(-50%);writing-mode:vertical-rl;font-size:13px;letter-spacing:.3em;color:#e8cf8a;font-weight:600;text-shadow:0 1px 2px #000}

/* ===== 翻开以后：穿绳的一摞委托单 ===== */
#reader{position:fixed;inset:0;z-index:30;background:radial-gradient(ellipse 80% 70% at 50% 45%,rgba(18,26,44,.9),rgba(4,6,10,.97)),#05070c;opacity:0;transition:opacity .45s;display:flex;flex-direction:column}
#reader.on{opacity:1}
.rd-top{display:flex;align-items:center;gap:18px;padding:14px 26px;font-size:13px;letter-spacing:.2em;color:rgba(214,226,236,.75)}
.rd-top .where{flex:1;text-align:center;letter-spacing:.34em}
.rd-top button,.rd-nav button{all:unset;cursor:pointer;padding:8px 14px;border:1px solid rgba(212,177,92,.35);color:#e8dbb4;letter-spacing:.2em;font-size:13px;transition:opacity .2s}
.rd-top button:hover,.rd-nav button:hover,.rd-top button:focus-visible,.rd-nav button:focus-visible{border-color:rgba(127,230,220,.7);color:#eaf7f5}
.rd-top .sw[aria-pressed="true"]{border-color:rgba(127,230,220,.7);color:#bff1ec}
.rd-body{flex:1;min-height:0;display:flex;justify-content:center;align-items:stretch;padding:4px 26px 0}
.bundle{position:relative;display:grid;grid-template-columns:58px minmax(0,1fr) 260px;gap:0;max-width:1120px;width:100%;min-height:0}
.rope{width:58px;position:relative;border-radius:6px 0 0 6px;background:linear-gradient(90deg,#101a36,#1d2f5c 60%,#2b3f74);box-shadow:inset -6px 0 10px rgba(0,0,0,.4)}
.rope::before{content:'';position:absolute;right:-6px;top:4%;bottom:4%;width:20px;background:radial-gradient(circle at 50% 50%,#b9a27a 0 5px,#8a7550 6px,rgba(0,0,0,0) 8px) 0 0/20px 64px repeat-y}
.rope::after{content:'';position:absolute;right:2px;top:4%;bottom:4%;width:4px;background:repeating-linear-gradient(180deg,#d6c296 0 10px,#9f8a60 10px 14px);opacity:.9}
.stack{position:relative;min-height:0;display:flex}
.stack::before,.stack::after{content:'';position:absolute;top:10px;bottom:-6px;right:-4px;left:4px;background:#bdb9ae;border-radius:2px;z-index:0;transform:rotate(.4deg)}
.stack::after{background:#cfcbc0;top:5px;bottom:-3px;right:-2px;left:2px;transform:rotate(-.3deg)}
.sheet{position:relative;z-index:1;flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;color:var(--ink);
 background:url(img/paper.webp) center/cover local,#e7e3d8;box-shadow:0 20px 50px rgba(0,0,0,.55);padding:34px 44px 40px;scrollbar-width:thin;scrollbar-color:rgba(84,104,140,.4) transparent}
.sheet.in{animation:sheetIn .5s cubic-bezier(.2,.7,.2,1)}
.sheet.out{animation:sheetOut .32s ease-in forwards}
@keyframes sheetIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes sheetOut{to{opacity:0;transform:translateX(-26px) rotate(-1.2deg)}}
.margin{position:relative;padding:30px 0 20px 22px;overflow-y:auto;min-height:0}
.rd-nav{display:flex;justify-content:center;align-items:center;gap:22px;padding:14px 0 18px;font-size:13px;letter-spacing:.24em;color:rgba(214,226,236,.7)}

/* 委托单的格子 */
.hd{display:grid;grid-template-columns:86px 1.25fr 1.1fr 1.5fr 0.8fr;border:1.5px solid var(--rule);font-size:12px}
.hd>div{border-left:1px solid var(--rule);padding:6px 8px 7px;min-height:52px;position:relative}
.hd>div:first-child{border-left:0}
.hd small{display:block;font-size:10px;letter-spacing:.3em;color:var(--ink2);margin-bottom:3px}
.hd .v{font-size:13px;line-height:1.5;letter-spacing:.04em}
.seal{width:64px;height:64px;margin:-2px auto 0;display:block}
.ttl{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin:22px 0 12px;border-bottom:1px solid var(--rule)}
.ttl h2{margin:0 0 10px;font-size:26px;letter-spacing:.16em;font-weight:900}
.ttl .no{font-size:12px;letter-spacing:.24em;color:var(--ink2);margin-bottom:12px;white-space:nowrap}
.row{display:grid;grid-template-columns:86px 1fr 96px;border:1px solid var(--rule);border-top:0}
.row:first-of-type{border-top:1px solid var(--rule)}
.row>div{padding:9px 12px;border-left:1px solid var(--rule2);position:relative}
.row>div:first-child{border-left:0;font-size:11px;letter-spacing:.32em;color:var(--ink2);writing-mode:horizontal-tb}
.row .lb{font-size:11px;letter-spacing:.3em;color:var(--ink2)}
.front{margin:14px 0;border:1.5px solid var(--rule);padding:18px 22px 20px;position:relative;min-height:150px}
.front .lb{position:absolute;left:10px;top:-9px;background:#e9e5da;padding:0 8px;font-size:11px;letter-spacing:.34em;color:var(--ink2)}
.front p{margin:0 0 9px;font-size:16.5px;line-height:1.95;letter-spacing:.06em;color:#2b2722}
.front.hand p{transform:rotate(-.25deg)}
.back{margin:0 0 14px;border:1px dashed var(--rule);padding:12px 14px;display:grid;grid-template-columns:86px 1fr;gap:12px;align-items:center}
.back .lb{font-size:11px;letter-spacing:.32em;color:var(--ink2)}
.back .ss{display:flex;flex-wrap:wrap;gap:5px;align-items:center}
.back .ss i{width:20px;height:20px;border-radius:50%;display:block}
.back .ss i.st{background:radial-gradient(circle at 40% 35%,#c7cacd,#8f9499);box-shadow:inset 0 0 0 2px rgba(255,255,255,.35)}
.back .ss i.cu{background:radial-gradient(circle at 40% 35%,#b08d6a,#6d5440);box-shadow:inset 0 0 0 2px rgba(255,230,200,.25)}
.back .ss i.g{width:12px;height:12px;margin-left:-9px;margin-top:12px;background:#7a8088;box-shadow:0 0 0 2px #e9e5da}
.back .ss i.na{width:auto;height:auto;border-radius:0;font-style:normal;font-size:13px;padding:2px 6px;border-bottom:1px solid var(--rule)}
.back .ss i.na.thumb{border-bottom:0;width:22px;height:22px;border-radius:50%;background:radial-gradient(ellipse at 50% 55%,transparent 0 3px,rgba(70,58,48,.5) 3px 4px,transparent 4px 6px,rgba(70,58,48,.5) 6px 7px,transparent 7px 9px,rgba(70,58,48,.45) 9px 10px,transparent 10px)}
.back .cnt{font-size:13px;letter-spacing:.08em;color:var(--ink2);margin-left:6px}
.close{border:2px solid var(--rule);padding:14px 18px 14px 108px;position:relative;min-height:78px}
.close .lb{position:absolute;left:12px;top:10px;font-size:11px;letter-spacing:.32em;color:var(--ink2)}
.close .stamp{position:absolute;left:18px;top:30px;padding:4px 8px;border:2px double var(--blue);color:var(--blue);font-weight:900;letter-spacing:.3em;font-size:14px;transform:rotate(-7deg);opacity:.85}
.close .stamp.no{border-color:#6e6a62;color:#6e6a62}
.close p{margin:0;font-size:15px;line-height:1.9;letter-spacing:.05em}
.close p+p{margin-top:4px;color:#4a4f5a;font-size:14px}
.aside{margin:16px 0 0;padding:12px 16px 4px;border-top:1px solid var(--rule2);font-size:14px;line-height:1.95;color:#3f4652;letter-spacing:.04em}
.aside .lb{font-size:11px;letter-spacing:.32em;color:var(--ink2);margin-right:10px}
.sheet.red{box-shadow:0 20px 50px rgba(0,0,0,.55),inset 0 0 0 9px rgba(124,42,38,.82),inset 0 0 0 12px rgba(124,42,38,.25)}
.sheet.blue{box-shadow:0 20px 50px rgba(0,0,0,.55),inset 0 0 0 7px rgba(61,95,154,.75)}
.sheet.rough{filter:saturate(.75) brightness(.95)}
.edgetag{position:absolute;right:16px;top:12px;font-size:11px;letter-spacing:.3em;padding:3px 8px}
.edgetag.red{color:#f3dcd8;background:var(--wax)}.edgetag.blue{color:#e6edf8;background:var(--blue)}

sup.fn{font-size:11px;font-weight:600;margin:0 1px;cursor:pointer;vertical-align:super;line-height:0}
sup.fn.late,.mn.late .k{color:var(--late)}sup.fn.qing,.mn.qing .k{color:var(--qing)}
.mn{margin:0 0 18px;font-size:13.5px;line-height:1.9;letter-spacing:.04em;color:rgba(222,226,232,.85);border-left:2px solid rgba(255,255,255,.12);padding:2px 0 2px 12px;transition:opacity .3s}
.mn.qing{border-color:rgba(43,140,136,.75);color:#bfe8e4}
.mn.late{border-color:rgba(160,130,100,.6);color:#e3d4c2}
.mn .k{font-weight:900;margin-right:6px}
.mn .by{display:block;margin-top:4px;font-size:11px;letter-spacing:.24em;opacity:.65}
.mn.lit{opacity:1;border-left-width:4px}
.mn .seal-off{display:inline-block;padding:2px 10px;background:rgba(124,42,38,.6);color:#f0dcd4;font-size:12px;letter-spacing:.3em}

/* 扉页、前言、目录 */
.flyleaf{position:relative;z-index:1;display:grid;grid-template-columns:1fr 1fr;gap:0;flex:1;min-height:0}
.inner{position:relative;background:linear-gradient(90deg,#101a36,#1d2f5c);box-shadow:inset 0 0 0 12px rgba(212,177,92,.16),0 20px 50px rgba(0,0,0,.55)}
.inner .plate{position:absolute;left:50%;top:46%;width:min(62%,280px);transform:translate(-50%,-50%) rotate(-2.5deg)}
.inner .plate img{width:100%;display:block;filter:drop-shadow(0 4px 8px rgba(0,0,0,.5))}
.inner .plate .fb{width:100%;aspect-ratio:1;border-radius:50% 50% 8px 8px;background:radial-gradient(circle at 50% 46%,rgba(127,230,220,.9) 0 6px,rgba(127,230,220,0) 22px),#e5e2d8;box-shadow:inset 0 0 0 6px #c3c6cc}
.inner .ok{position:absolute;left:50%;top:85.5%;transform:translate(-50%,-50%);font-size:13px;letter-spacing:.6em;text-indent:.6em;color:var(--qing);font-weight:600;white-space:nowrap}
.title{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:6px}
.title h1{margin:0;font-size:34px;letter-spacing:.22em;text-indent:.22em;font-weight:900;white-space:nowrap}
.title .s{font-size:13px;letter-spacing:.3em;color:var(--ink2)}
.title .ep{margin-top:44px;font-size:19px;letter-spacing:.2em}
.title .ep2{font-size:12px;letter-spacing:.3em;color:var(--ink2)}
.title .by{margin-top:44px;font-size:13px;line-height:2.1;letter-spacing:.22em}
.title .gs{margin-top:28px;width:78px;height:78px}
.prose{max-width:600px;margin:0 auto}
.prose h2{font-size:22px;letter-spacing:.5em;text-indent:.5em;text-align:center;margin:8px 0 26px;font-weight:900}
.prose p{font-size:16px;line-height:2.05;letter-spacing:.05em;text-indent:2em;margin:0 0 14px}
.prose .sign{text-indent:0;text-align:right;margin-top:26px;font-size:14px;line-height:2;color:#3f4652}
.toc{width:100%;border-collapse:collapse;margin-top:6px}
.toc th{font-size:11px;letter-spacing:.34em;color:var(--ink2);font-weight:400;text-align:left;padding:6px 10px;border-bottom:1.5px solid var(--rule)}
.toc td{padding:11px 10px;border-bottom:1px solid var(--rule2);font-size:15px;letter-spacing:.06em;vertical-align:top}
.toc td:first-child{white-space:nowrap;font-weight:600;letter-spacing:.2em;width:78px}
.toc td:nth-child(2){font-weight:600;width:42%}
.toc td:nth-child(3){font-size:13px;color:var(--ink2)}
.toc tr.go{cursor:pointer}
.toc tr.go:hover td,.toc tr.go:focus-visible td{background:rgba(84,104,140,.1)}
.toc tr.here td:nth-child(2){color:#1d3a73}

@media (max-width:760px){
 #hall{overflow-y:auto;-webkit-overflow-scrolling:touch}

 #hall .bg::after{background:linear-gradient(180deg,rgba(5,7,12,.2),rgba(5,7,12,.86) 45%,rgba(5,7,12,.94))}

 .sp:hover,.sp:focus-visible,.sp.lit{transform:translateX(6px)}

}

}

 <div class="b3" id="b3">

 </div>

 </div></div>

</div>

<div id="lend" hidden><div class="lc">
 <button class="x" id="lendx">放回去</button>
 <h3>借阅卡</h3><div class="sub">这一架的书，不出这一殿</div>
 <table><thead><tr><th style="width:34%">借书的人</th><th>借去的</th><th style="width:20%">还了没有</th></tr></thead><tbody>
  <tr><td class="sm">莉娅·维恩</td><td>火歌与名字</td><td><span class="ret">已还</span></td></tr>
  <tr><td class="sm">托尔克</td><td>长垒战报汇编</td><td><span class="ret">已还</span></td></tr>
  <tr><td class="sm">埃尔德·冬</td><td>佣兵碑拓本</td><td><span class="ret">已还</span></td></tr>

  <tr><td class="sm">米尔塔</td><td>万物的清点</td><td><span class="ret">已还</span></td></tr>

<script>
'use strict';
const RM = matchMedia('(prefers-reduced-motion: reduce)');
const MOB = matchMedia('(max-width:760px)');
const $ = s => document.querySelector(s);

/* ---------- 书架上的书 ---------- */
const BOOKS = [
 {g:'old', k:'h1', img:'spine_5', h:300, hot:1},
 {g:'old', k:'h2', img:'spine_6', h:322, hot:1},
 {g:'old', k:'h3', img:'spine_5', h:286, hot:1, flip:1},
 {g:'now', k:'general', img:'spine_0', h:338, ty:'22%', n:'万物的清点', a:'不署名', e:'诸纪', tc:'#1f6f6b', lb:'rgba(236,240,240,.92)'},
 {g:'now', k:'moon', img:'spine_1', h:318, n:'火歌与名字', a:'灰桥守火人口传，后人抄下　萨尔维斯编年院续写', e:'月银纪', tc:'#eef2f8'},
 {g:'now', k:'strife', img:'spine_2', h:330, n:'长垒战报汇编', a:'墙上的书记官，几十代人接着记', e:'纷争纪', tc:'#e7c79a'},
 {g:'now', k:'bronze', img:'spine_3', h:312, n:'佣兵碑拓本', a:'佣兵行会的拓工', e:'山铜纪', tc:'#f1eee6'},
 {g:'now', k:'guild', img:'guild_spine', h:344, ty:'27%', n:'公会委托存档', a:'冒险者公会库房存　头一本账，卡塔琳娜·林德纳记', e:'迷宫纪元年至一千年', tc:'#e8cf8a'},
 {g:'now', k:'hand', img:'spine_4', h:210, ty:'34%', n:'旅人手册', a:'阿卡迪亚公会编', e:'迷宫纪一千零一年', tc:'#e8cf8a'},
 {g:'new', k:'b1', img:'spine_7', h:330, blank:1},
 {g:'new', k:'b2', img:'spine_8', h:318, blank:1, grow:1, cls:'far'},
 {g:'new', k:'b3', img:'spine_7', h:306, blank:1, flip:1, cls:'far'},
 {g:'new', k:'b4', img:'spine_8', h:296, blank:1, cls:'farther'},
];
const LABS = {old:'更早的年月', now:'翻得开的', new:'还没写成的'};
const tip = $('#tip'), toast = $('#toast');
let toastT;
function say(t){ toast.textContent = t; toast.classList.add('on'); clearTimeout(toastT); toastT = setTimeout(() => toast.classList.remove('on'), 2200); }

function buildShelf(){
 const shelf = $('#shelf');
 const sc = Math.min(1, innerHeight / 900);
 for (const g of ['old','now','new']){
  const d = document.createElement('div'); d.className = 'grp'; d.innerHTML = '<span class="lab">' + LABS[g] + '</span>';
  for (const b of BOOKS.filter(x => x.g === g)){
   const el = document.createElement('button');
   el.className = 'sp' + (b.hot ? ' hot' : '') + (b.flip ? ' flip' : '') + (b.grow ? ' grow' : '') + (b.cls ? ' ' + b.cls : '');
   el.style.setProperty('--h', Math.round(b.h * sc) + 'px');
   if (b.tc) el.style.setProperty('--tc', b.tc);
   if (b.ty) el.style.setProperty('--ty', b.ty);
   if (b.lb) el.style.setProperty('--lb', b.lb);
   el.dataset.k = b.k;
   el.setAttribute('aria-label', b.n || (b.hot ? '烫手的一本' : '还没写成的一本'));
   const im = new Image(); im.src = 'img/' + b.img + '.webp'; im.alt = '';
   im.onerror = () => { const f = document.createElement('span'); f.className = 'fb'; f.style.setProperty('--fbc', b.hot ? '#5a2a1c' : b.blank ? '#cfcabd' : '#2b3f74'); im.replaceWith(f); };
   el.appendChild(im);
   if (b.n){ const t = document.createElement('span'); t.className = 't'; t.textContent = b.n; el.appendChild(t);
    const m = document.createElement('span'); m.className = 'm'; m.textContent = b.e; el.appendChild(m); }
   if (b.grow){ const p = document.createElement('span'); p.className = 'pg'; el.appendChild(p); }
   el.addEventListener('mouseenter', () => showTip(b));
   el.addEventListener('focus', () => showTip(b));
   el.addEventListener('mouseleave', () => tip.classList.remove('on'));
   el.addEventListener('blur', () => tip.classList.remove('on'));
   el.addEventListener('click', () => pick(b, el));
   d.appendChild(el);
  }
  if (g === 'new'){
   const s = document.createElement('div'); s.className = 'slot'; s.style.setProperty('--h', Math.round(300 * sc) + 'px'); s.title = '一格空位'; d.appendChild(s);
   const c = document.createElement('button'); c.className = 'card'; c.setAttribute('aria-label', '借阅卡');
   c.innerHTML = '<span class="pp"></span><span class="mini"><b>借阅卡</b><i></i><i></i><i></i><i></i><i></i><i></i></span>';
   c.addEventListener('mouseenter', () => showTip({card:1})); c.addEventListener('mouseleave', () => tip.classList.remove('on'));
   c.addEventListener('click', openLend); d.appendChild(c);
  }
  shelf.appendChild(d);
 }
}
function showTip(b){
 const [n, a, e] = tip.children; tip.className = 'tip on' + (b.hot ? ' hot' : '');
 if (b.card){ n.textContent = '借阅卡'; a.textContent = '借书的人一行一行往下写，最末一行空着'; e.textContent = '书架尽头'; return; }
 if (b.hot){ n.textContent = '烫手的一本'; a.textContent = '书脊上烫着名字，烫得认不出'; e.textContent = '这一本，你还碰不得'; return; }
 if (b.blank){ n.textContent = b.grow ? '自己在长的一本' : '空着书脊的一本'; a.textContent = b.grow ? '没有人在写它，书页一夜比一夜厚' : '名字还没有烫上去'; e.textContent = '还没写成'; return; }
 n.textContent = b.n; a.textContent = b.a; e.textContent = b.e;
}
function pick(b, el){
 if (b.hot){ el.classList.remove('shake'); void el.offsetWidth; el.classList.add('shake'); say('书脊是烫的。这一本，你还碰不得。'); return; }
 if (b.blank){ say(b.grow ? '这一本还在自己长新页，还没写成。' : '这一本还没写成。'); return; }
 if (b.k !== 'guild'){ say('样张里只做了《公会委托存档》这一本。'); return; }
 openBook(el);
}

/* 殿里的青火：照主画上柱间的位置点几盏，只动 opacity 和 transform */
function flames(){
 const pts = [[18,24],[32,30],[41,34],[59,34],[68,30],[82,24]];
 for (const [x, y] of pts){ const f = document.createElement('span'); f.className = 'flame'; f.style.left = x + '%'; f.style.top = y + '%'; f.style.animationDelay = (Math.random() * 3).toFixed(2) + 's'; $('#hall').insertBefore(f, $('.cap')); }
}

/* ---------- 《公会委托存档》的页 ---------- */
const SEAL_STONE = '<svg class="seal" viewBox="0 0 64 64"><circle cx="32" cy="32" r="28" fill="none" stroke="#8d9298" stroke-width="3" opacity=".8"/><circle cx="32" cy="32" r="22" fill="none" stroke="#8d9298" stroke-width="1" opacity=".7"/><g stroke="#80868c" stroke-width="2" fill="none" opacity=".85"><path d="M32 16 V44 M20 24 H44 M20 24 L15 35 H25 Z M44 24 L39 35 H49 Z M26 46 H38"/></g></svg>';
const SEAL_CU = SEAL_STONE.replaceAll('#8d9298', '#8a6c52').replaceAll('#80868c', '#7a5e46');
const SEAL_EMPTY = '<svg class="seal" viewBox="0 0 64 64"><rect x="8" y="8" width="48" height="48" fill="none" stroke="rgba(84,104,140,.35)" stroke-dasharray="3 4"/></svg>';
const PRESS = '<svg viewBox="0 0 40 46" width="34" height="40" style="display:block"><g fill="none" stroke="rgba(78,62,50,.62)" stroke-width="1.3"><ellipse cx="20" cy="24" rx="15" ry="19"/><ellipse cx="20" cy="25" rx="11" ry="14.5"/><ellipse cx="20" cy="26" rx="7.5" ry="10"/><ellipse cx="20" cy="27" rx="4" ry="5.5"/></g></svg>';

function fn(id){ const f = NOTES[id]; return '<sup class="fn ' + f.ink + '" data-fn="' + id + '">' + f.mark + '</sup>'; }
const NOTES = {
 n1:{mark:'注一', ink:'qing', t:'头三条，往后一个字没有改过。', by:'青墨，不署名'},
 n2:{mark:'注二', ink:'late', t:'斯基普的那一颗钉子空着，印跟着人一起没有回来。', by:'后来的书记添的'},
 n3:{mark:'注三', ink:'qing', t:'未归板上的名字，这里另有一份，一个不少。', by:'青墨，不署名'},
 n4:{mark:'注四', ink:'late', spoil:1, t:'八百五十二年头一回斩首，九位传奇按了印，会长的在最上头，回来两位，里头没有他。食堂给他留的那一份饭，照规矩留了三个潮期。往后读名的是蕾雅·帕斯洛。九百七十年读名，从早上读到了天黑。', by:'后来的书记添的'},
};

function slip(o){
 const seal = o.seal === 'stone' ? SEAL_STONE : o.seal === 'cu' ? SEAL_CU : SEAL_EMPTY;
 const backs = (() => {
  if (o.back.names) return o.back.names.map(n => n === '手印' ? '<i class="na thumb" title="不会写字的那一个按的手印"></i>' : '<i class="na">' + n + '</i>').join('');
  let s = ''; const n = Math.min(o.back.n, o.back.cap || o.back.n);
  for (let i = 0; i < n; i++){ s += '<i class="' + o.back.kind + '"></i>'; if (o.back.guar && o.back.guar.includes(i)) s += '<i class="g" title="书记的担保印"></i>'; }
  return s + (o.back.cnt ? '<span class="cnt">' + o.back.cnt + '</span>' : '');
 })();
 return '<span class="edgetag ' + (o.edge || '') + '"' + (o.edge ? '' : ' hidden') + '>' + (o.edge === 'red' ? '红边' : '蓝边') + '</span>' +
  '<div class="hd"><div class="sealc"><small>公会印</small>' + seal + '</div>' +
  '<div><small>编号</small><div class="v">' + o.no + '</div></div>' +
  '<div><small>年月</small><div class="v">' + o.date + '</div></div>' +
  '<div><small>地点</small><div class="v">' + o.place + '</div></div>' +
  '<div><small>边色　等级</small><div class="v">' + (o.grade || '无') + '</div></div></div>' +
  '<div class="ttl"><h2>' + o.title + '</h2><span class="no">' + o.tag + '</span></div>' +
  '<div class="row"><div>委托人</div><div>' + o.who + '</div><div><span class="lb">押</span>' + PRESS + '</div></div>' +
  '<div class="front hand"><span class="lb">正面</span>' + o.front.map(p => '<p>' + p + '</p>').join('') + '</div>' +
  '<div class="back"><span class="lb">背面</span><div class="ss">' + backs + '</div></div>' +
  '<div class="close"><span class="lb">结案栏</span><span class="stamp' + (o.done ? '' : ' no') + '">' + (o.done ? '结案' : '未结') + '</span>' + o.close.map(p => '<p>' + p + '</p>').join('') + '</div>' +
  (o.aside ? '<div class="aside"><span class="lb">书记旁注</span>' + o.aside + '</div>' : '');

let cur = 0, spoil = false, busy = false;
const stack = $('#stack'), margin = $('#margin');
function render(dir){
 const p = PAGES[cur];
 $('#where').textContent = '公会委托存档　' + p.where;
 $('#pgno').textContent = (cur + 1) + ' ／ ' + PAGES.length;
 $('#prev').style.opacity = cur ? 1 : .35; $('#next').style.opacity = cur < PAGES.length - 1 ? 1 : .35;
 let el;
 if (p.k === 'fly'){
  el = document.createElement('div'); el.className = 'flyleaf';
  el.innerHTML = '<div class="inner"><div class="plate"><img src="img/bookplate.webp" alt="藏书票" onerror="this.outerHTML=\'<div class=fb></div>\'"><div class="ok">已清点</div></div></div><div class="sheet title-sheet">' + p.html() + '</div>';
  el.querySelector('.sheet').style.display = 'flex';
 } else {
  el = document.createElement('article'); el.className = 'sheet' + (p.edge ? ' ' + p.edge : '') + (p.rough ? ' rough' : ''); el.innerHTML = p.html();
 }
 const old = stack.firstElementChild;
 const put = () => { stack.innerHTML = ''; stack.appendChild(el); if (dir && !RM.matches) (el.classList.contains('sheet') ? el : el.querySelector('.sheet')).classList.add('in'); bind(el); };
 if (old && dir && !RM.matches){ const o = old.classList.contains('sheet') ? old : old; o.classList.add('out'); setTimeout(put, 280); } else put();
 margin.innerHTML = (p.notes || []).map(id => { const f = NOTES[id];
  const body = f.spoil && !spoil ? '<span class="seal-off">封着　揭开后半截再看</span>' : f.t;
  return '<div class="mn ' + f.ink + '" data-fn="' + id + '"><span class="k">' + f.mark + '</span>' + body + '<span class="by">' + f.by + '</span></div>'; }).join('') ||
  (p.k === 'toc' ? '<div class="mn"><span class="k">页边</span>点第四箱进正文。别的几箱，样张里还没写。</div>' : '');
 if (MOB.matches) $('.rd-body').scrollTop = 0;
}
function bind(el){
 el.querySelectorAll('tr.go').forEach(tr => { const go = () => { const i = +tr.dataset.i; if (i === 3) turn(3 - cur); else say('样张里只写了第四箱这一箱。'); };
  tr.addEventListener('click', go); tr.addEventListener('keydown', e => { if (e.key === 'Enter') go(); }); });
 el.querySelectorAll('sup.fn').forEach(s => s.addEventListener('click', () => { const m = margin.querySelector('[data-fn="' + s.dataset.fn + '"]'); if (m){ m.scrollIntoView({block:'nearest', behavior: RM.matches ? 'auto' : 'smooth'}); m.classList.add('lit'); setTimeout(() => m.classList.remove('lit'), 1400); } }));
}
function turn(d){ const n = cur + d; if (n < 0 || n >= PAGES.length) return; cur = n; render(d); }
$('#prev').onclick = () => turn(-1); $('#next').onclick = () => turn(1);
$('#spoil').onclick = () => { spoil = !spoil; $('#spoil').setAttribute('aria-pressed', spoil); $('#spoil').textContent = spoil ? '封上后半截' : '揭开后半截'; render(0); };
addEventListener('keydown', e => {
 if ($('#reader').hidden) { if (e.key === 'Escape' && !$('#lend').hidden) closeLend(); return; }
 if (e.key === 'ArrowRight') turn(1); else if (e.key === 'ArrowLeft') turn(-1); else if (e.key === 'Escape') shutBook();
});

 const H = MOB.matches ? Math.min(innerHeight * .62, 560) : Math.min(innerHeight * .74, 680);
 const W = Math.round(H * .7), T = Math.round(W * .17);
 return {W, H: Math.round(H), T};
}
function fromSpine(el, d){
 const r = el.getBoundingClientRect(), cx = r.left + r.width / 2 - innerWidth / 2, cy = r.top + r.height / 2 - innerHeight / 2;
 const P = 2400, z = d.W / 2;
 if (MOB.matches){ const s = r.width / d.H * (P - z) / P; return 'translate(' + cx + 'px,' + cy + 'px) scale(' + s.toFixed(3) + ') rotateZ(-90deg) rotateY(90deg)'; }
 const s = r.height / d.H * (P - z) / P; return 'translate(' + cx + 'px,' + cy + 'px) scale(' + s.toFixed(3) + ') rotateZ(0deg) rotateY(90deg)';
}
function anim(el, frames, ms, easing){
 if (RM.matches) ms = 1;
 return el.animate(frames, {duration: ms, easing: easing || 'cubic-bezier(.2,.7,.2,1)', fill: 'forwards'}).finished;
}
async function openBook(el){
 if (busy) return; busy = true; srcEl = el; tip.classList.remove('on');
 const st = $('#stage'), b = $('#b3'), d = dims();
 b.style.setProperty('--W', d.W + 'px'); b.style.setProperty('--H', d.H + 'px'); b.style.setProperty('--T', d.T + 'px');
 st.hidden = false; const lid = b.querySelector('.lid');
 lid.getAnimations().forEach(a => a.cancel()); b.getAnimations().forEach(a => a.cancel());
 const start = fromSpine(el, d);
 const lift = MOB.matches ? start.replace(/^translate\(([-\d.]+)px,([-\d.]+)px\)/, (m, x, y) => 'translate(' + (+x + 26) + 'px,' + y + 'px)')
                          : start.replace(/^translate\(([-\d.]+)px,([-\d.]+)px\)/, (m, x, y) => 'translate(' + x + 'px,' + (+y - 46) + 'px)');
 b.style.transform = start; el.style.opacity = 0;
 anim(st.querySelector('.dim'), [{opacity:0},{opacity:1}], 600);
 await anim(b, [{transform:start},{transform:lift}], 320, 'ease-out');
 await anim(b, [{transform:lift},{transform:'translate(0px,0px) scale(1) rotateZ(0deg) rotateY(0deg)'}], 900);
 await new Promise(r => setTimeout(r, RM.matches ? 0 : 380));
 // 翻开：封面绕左边翻过去，书页亮起来
 const rd = $('#reader'); cur = 0; render(0); rd.hidden = false;
 anim(lid, [{transform:'rotateY(0deg)'},{transform:'rotateY(-165deg)'}], 900, 'cubic-bezier(.4,.1,.3,1)');
 await new Promise(r => setTimeout(r, RM.matches ? 0 : 520));
 rd.classList.add('on');
 await new Promise(r => setTimeout(r, RM.matches ? 0 : 450));
 st.hidden = true; busy = false; $('#next').focus({preventScroll:true});
}
async function shutBook(){
 if (busy || !srcEl) return; busy = true;
 const st = $('#stage'), b = $('#b3'), lid = b.querySelector('.lid'), rd = $('#reader'), d = dims();
 b.style.setProperty('--W', d.W + 'px'); b.style.setProperty('--H', d.H + 'px'); b.style.setProperty('--T', d.T + 'px');
 b.getAnimations().forEach(a => a.cancel()); lid.getAnimations().forEach(a => a.cancel());
 b.style.transform = 'translate(0px,0px) scale(1) rotateZ(0deg) rotateY(0deg)'; lid.style.transform = 'rotateY(-165deg)';
 st.hidden = false; st.querySelector('.dim').style.opacity = 1;
 rd.classList.remove('on');
 await anim(lid, [{transform:'rotateY(-165deg)'},{transform:'rotateY(0deg)'}], 760, 'cubic-bezier(.4,.1,.3,1)');
 rd.hidden = true; lid.style.transform = '';
 const end = fromSpine(srcEl, d);
 anim(st.querySelector('.dim'), [{opacity:1},{opacity:0}], 800);
 await anim(b, [{transform:'translate(0px,0px) scale(1) rotateZ(0deg) rotateY(0deg)'},{transform:end}], 880, 'cubic-bezier(.5,0,.3,1)');
 srcEl.style.opacity = ''; st.hidden = true; busy = false; srcEl.focus({preventScroll:true});
}
$('#shut').onclick = shutBook;

/* ---------- 借阅卡 ---------- */
function openLend(){ const l = $('#lend'); l.hidden = false; requestAnimationFrame(() => requestAnimationFrame(() => l.classList.add('on'))); }
function closeLend(){ const l = $('#lend'); l.classList.remove('on'); setTimeout(() => l.hidden = true, RM.matches ? 0 : 360); }
$('#lendx').onclick = closeLend; $('#lend').addEventListener('click', e => { if (e.target.id === 'lend') closeLend(); });

buildShelf();
/* 截图用：?open=页号 直接翻到那一页；?lit=键 让一本亮着；?lend=1 摊开借阅卡 */
const Q = new URLSearchParams(location.search);
if (Q.has('lit')){ const el = document.querySelector('.sp[data-k="' + Q.get('lit') + '"]'); if (el){ el.classList.add('lit'); showTip(BOOKS.find(b => b.k === Q.get('lit'))); } }
if (Q.has('open')){ srcEl = document.querySelector('.sp[data-k="guild"]'); srcEl.style.opacity = 0; cur = +Q.get('open') || 0; render(0); $('#reader').hidden = false; $('#reader').classList.add('on'); if (Q.has('spoil')) $('#spoil').click(); }
if (Q.has('lend')) openLend();
if (Q.has('cover')){ const d = dims(), b = $('#b3'), st = $('#stage'); b.style.setProperty('--W', d.W + 'px'); b.style.setProperty('--H', d.H + 'px'); b.style.setProperty('--T', d.T + 'px');
 const t = Q.get('cover'); st.hidden = false; st.querySelector('.dim').style.opacity = 1; document.querySelector('.sp[data-k="guild"]').style.opacity = 0;
 b.style.transform = t === 'turn' ? 'translate(0px,-20px) scale(.82) rotateZ(0deg) rotateY(52deg)' : 'translate(0px,0px) scale(1) rotateZ(0deg) rotateY(0deg)';
 if (t === 'open') b.querySelector('.lid').style.transform = 'rotateY(-70deg)'; }
</script>
