<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>建档样张</title>
<!-- 门面第二轮 建档样张（11-23）：魂、胎骨、命星三步加铸印，山铜纪的材质。方向稿第四节，单独一页，不接外壳。数据 data.js 是 prep_art.py 照 build.json、stars.json 出的。 -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600;900&display=swap">
<style>
:root{--ink:#07080c;--obs:#111319;--slate:#262a33;--stone:#e9e6df;--pale:#ece5d6;--dim:rgba(236,229,214,.62);--line:rgba(236,229,214,.18);--gold:#d9c08c;--amber:255,176,104;--serif:"Noto Serif SC","Songti SC","SimSun",serif;
  --rare:120,170,255;--epic:186,128,255;--legend:255,204,112;--unique:255,250,236}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--ink);color:var(--pale);font-family:var(--serif);overflow:hidden;-webkit-tap-highlight-color:transparent}
button{font-family:inherit}
#bg{position:fixed;inset:0;background:url(assets/era_2.webp) center 35%/cover no-repeat;filter:saturate(.9) brightness(.62)}
#bg::after{content:"";position:absolute;inset:0;background:radial-gradient(70% 60% at 42% 48%,rgba(7,8,12,.05),rgba(7,8,12,.6) 75%),linear-gradient(180deg,rgba(7,8,12,.55),rgba(7,8,12,0) 22%,rgba(7,8,12,0) 60%,rgba(7,8,12,.8))}
/* 桌面：一块浅石的台面，牌落在上头 */
#slab{position:fixed;left:3%;right:calc(var(--aside) + 3%);top:150px;bottom:92px;border-radius:24px;background:linear-gradient(135deg,rgba(17,19,25,.62) 0 49.6%,rgba(233,230,223,.1) 50.4% 100%);box-shadow:inset 0 0 0 1px rgba(217,192,140,.14),inset 0 0 60px rgba(0,0,0,.45);pointer-events:none}
:root{--aside:400px}

/* 顶上：哪一纪、哪一步 */
#top{position:fixed;left:32px;top:22px;z-index:6;display:flex;align-items:flex-end;gap:36px}
#top .t{font-size:11px;letter-spacing:.42em;color:var(--dim)}
#top h1{margin:4px 0 0;font-size:19px;font-weight:600;letter-spacing:.24em}
#top h1 small{font-size:12px;font-weight:400;letter-spacing:.12em;color:var(--dim);margin-left:12px}
#steps{display:flex;gap:6px;margin:0;padding:0;list-style:none}
#steps li{display:flex;align-items:center;gap:6px;font-size:13px;letter-spacing:.3em;color:rgba(236,229,214,.38);padding:4px 10px 4px 6px;border-radius:20px}
#steps li i{width:7px;height:7px;border-radius:50%;border:1px solid currentColor}
#steps li.on{color:var(--pale);background:rgba(217,192,140,.1)}
#steps li.on i{background:rgb(var(--amber));border-color:rgb(var(--amber));box-shadow:0 0 10px rgba(var(--amber),.8)}
#steps li.done{color:var(--gold)}
#steps li.done i{background:var(--gold);border-color:var(--gold)}

/* 她的话 */
#say{position:fixed;left:6%;right:calc(var(--aside) + 6%);top:86px;z-index:6;min-height:52px;text-align:center;pointer-events:none}
#say p{margin:0;font-size:16px;line-height:1.75;letter-spacing:.08em;color:#f4eee2;text-shadow:0 1px 12px rgba(0,0,0,.95);opacity:0;transform:translateY(6px);transition:opacity .5s,transform .5s}
#say p.on{opacity:1;transform:none}
#say p:first-child::before{content:"她";display:inline-block;font-size:10px;letter-spacing:0;color:rgb(var(--amber));border:1px solid rgba(var(--amber),.6);border-radius:50%;width:18px;height:18px;line-height:16px;margin-right:10px;vertical-align:3px}
#say p+p{color:var(--dim);font-size:14.5px}

/* 牌桌 */
#table{position:fixed;left:3%;right:calc(var(--aside) + 3%);top:158px;bottom:250px;z-index:3}
.card{position:absolute;left:0;top:0;width:var(--cw);height:var(--ch);transform-origin:50% 50%;transition:transform .62s cubic-bezier(.2,.75,.2,1),opacity .45s;will-change:transform}
.card.snap{transition:none}
.card .lift{position:absolute;inset:0;perspective:1400px;transition:transform .28s cubic-bezier(.2,.8,.3,1)}
.card.hov:hover .lift,.card.hov:focus-visible .lift{transform:translateY(-16px)}
.card.hov{cursor:pointer}
.card .flip{position:absolute;inset:0;transform-style:preserve-3d;transition:transform .7s cubic-bezier(.3,.7,.2,1)}
.card.up .flip{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:calc(var(--cw) * .055);overflow:hidden;background:#151821 center/cover no-repeat;box-shadow:0 10px 26px rgba(0,0,0,.6),0 0 0 1px rgba(217,192,140,.22);container-type:inline-size}
.face.b{transform:rotateY(180deg)}
.card:focus-visible{outline:none}
.card:focus-visible .face{box-shadow:0 0 0 2px rgb(var(--amber)),0 10px 26px rgba(0,0,0,.6)}
.card .plate{position:absolute;left:0;right:0;bottom:5.5%;text-align:center;font-size:9cqw;font-weight:600;letter-spacing:.3em;text-indent:.3em;color:#f6efe0;text-shadow:0 1px 6px #000,0 0 14px rgba(0,0,0,.8)}
.card .plate small{display:block;font-size:5.6cqw;font-weight:400;letter-spacing:.18em;color:var(--dim);margin-top:.6cqw}
.card.picked .face{box-shadow:0 0 0 2px rgb(var(--amber)),0 0 34px rgba(var(--amber),.55),0 10px 26px rgba(0,0,0,.6)}
.card.dim{opacity:.28}

/* 种族牌的背面：支系 */
.subs{position:absolute;inset:0;padding:9cqw 8cqw;background:linear-gradient(135deg,#0f1117 0 49.5%,#2a2d34 50.5%),#111;display:flex;flex-direction:column;gap:3cqw;text-align:left}
.subs::before{content:"";position:absolute;inset:3.5cqw;border:1px solid rgba(217,192,140,.35);border-radius:3cqw;pointer-events:none}
.subs h3{margin:0;font-size:9.5cqw;letter-spacing:.22em;color:#f6efe0}
.subs p{margin:0;font-size:5.2cqw;line-height:1.55;color:var(--dim)}
.subs .list{display:grid;grid-template-columns:1fr 1fr;gap:2.6cqw;margin-top:2cqw}
.subs .sb{all:unset;cursor:pointer;padding:2.6cqw 3cqw;border:1px solid rgba(217,192,140,.3);border-radius:2cqw;background:rgba(7,8,12,.45);font-size:5.6cqw;line-height:1.35;color:var(--pale)}
.subs .sb small{display:block;font-size:4.2cqw;color:var(--dim);margin-top:.8cqw}
.subs .sb:hover,.subs .sb:focus-visible{border-color:rgb(var(--amber));background:rgba(var(--amber),.14)}
.subs .sb.off{opacity:.4;cursor:default}
.subs .sb.off:hover{border-color:rgba(217,192,140,.3);background:rgba(7,8,12,.45)}
.subs .back{all:unset;cursor:pointer;margin-top:auto;align-self:center;font-size:5cqw;letter-spacing:.3em;color:var(--dim);padding:1.5cqw 4cqw;border-bottom:1px solid var(--line)}

/* 命星牌 */
.star .txt{position:absolute;left:20%;right:20%;top:24%;bottom:27%;display:flex;flex-direction:column;align-items:center;text-align:center;gap:2.4cqw}
.star .ty{font-size:5.6cqw;letter-spacing:.12em;color:var(--dim)}
.star .nm{font-size:10cqw;font-weight:600;letter-spacing:.1em;line-height:1.25;color:#fff7e6}
.star .ds{font-size:5.3cqw;line-height:1.55;color:rgba(236,229,214,.78);overflow:hidden;display:-webkit-box;-webkit-line-clamp:5;-webkit-box-orient:vertical;text-align:left}
.star[data-t=Unique] .txt{top:21%}
.star[data-t=Unique] .nm{color:#fff;text-shadow:0 0 12px rgba(255,255,255,.7)}
.star[data-t=Legend] .nm{color:#ffe2a6}
.star[data-t=Epic] .nm{color:#e8d6ff}
.star[data-t=Rare] .nm{color:#dbe8ff}
.glow{position:absolute;left:50%;top:50%;width:calc(var(--cw) * 2.1);height:calc(var(--cw) * 2.1);margin:calc(var(--cw) * -1.05) 0 0 calc(var(--cw) * -1.05);border-radius:50%;opacity:0;transform:scale(.4);pointer-events:none;transition:opacity .5s,transform .7s cubic-bezier(.2,.8,.2,1)}
.card.lit .glow{opacity:1;transform:scale(1)}
.card[data-t=Rare] .glow{background:radial-gradient(closest-side,rgba(var(--rare),.42),rgba(var(--rare),0))}
.card[data-t=Epic] .glow{background:radial-gradient(closest-side,rgba(var(--epic),.55),rgba(var(--epic),0))}
.card[data-t=Legend] .glow{background:radial-gradient(closest-side,rgba(var(--legend),.7),rgba(var(--legend),0))}
.card[data-t=Unique] .glow{width:calc(var(--cw) * 3.4);height:calc(var(--cw) * 3.4);margin:calc(var(--cw) * -1.7) 0 0 calc(var(--cw) * -1.7);background:radial-gradient(closest-side,rgba(255,255,255,.9),rgba(255,236,190,.5) 30%,rgba(170,220,255,.18) 60%,rgba(255,255,255,0))}
.rays{position:absolute;left:50%;top:50%;width:calc(var(--cw) * 4.4);height:calc(var(--cw) * 4.4);margin:calc(var(--cw) * -2.2) 0 0 calc(var(--cw) * -2.2);pointer-events:none;opacity:0;transform:scale(.3) rotate(0);transition:opacity .6s,transform 1.2s cubic-bezier(.2,.8,.2,1);
  background:repeating-conic-gradient(from 0deg,rgba(255,250,232,.5) 0 2deg,rgba(255,250,232,0) 2deg 15deg);-webkit-mask:radial-gradient(closest-side,#000 8%,transparent 92%);mask:radial-gradient(closest-side,#000 8%,transparent 92%)}
.card.lit[data-t=Unique] .rays{opacity:1;transform:scale(1) rotate(24deg)}
.card.lit[data-t=Unique]{z-index:30!important}
.card.lit[data-t=Unique] .lift{animation:jolt .5s ease-out}
@keyframes jolt{0%{transform:scale(1)}30%{transform:scale(1.13)}100%{transform:scale(1.04)}}
#flash{position:fixed;inset:0;z-index:40;pointer-events:none;opacity:0;background:radial-gradient(60% 60% at var(--fx,50%) var(--fy,50%),rgba(255,252,240,.85),rgba(255,236,190,.25) 45%,rgba(255,255,255,0) 75%)}
#flash.go{animation:flash 1.1s ease-out}
@keyframes flash{0%{opacity:0}12%{opacity:1}100%{opacity:0}}
.deckc{position:absolute;left:0;top:0;width:var(--cw);height:var(--ch);background:url(assets/star_back.webp) center/cover,#121624;border-radius:calc(var(--cw) * .055);box-shadow:0 2px 0 #0a0b10,0 4px 0 #191c25,0 6px 0 #0a0b10,0 8px 0 #191c25,0 12px 24px rgba(0,0,0,.65),0 0 0 1px rgba(217,192,140,.25)}
#tabs{position:absolute;display:flex;gap:6px;z-index:5}
#tabs button{all:unset;cursor:pointer;font-size:12.5px;letter-spacing:.18em;padding:6px 12px;border:1px solid var(--line);border-radius:18px;color:var(--dim);background:rgba(7,8,12,.5)}
#tabs button.on{color:var(--pale);border-color:rgba(var(--amber),.7);background:rgba(var(--amber),.14)}
#tabs button b{font-weight:400;color:var(--gold);margin-left:6px}
#pity{position:absolute;z-index:5;font-size:11.5px;letter-spacing:.08em;color:var(--dim)}

/* 说明：选中一张以后的长话 */
#info{position:fixed;left:8%;right:calc(var(--aside) + 8%);bottom:96px;z-index:5;max-height:140px;overflow:auto;padding:14px 20px;border-radius:12px;background:rgba(7,8,12,.66);box-shadow:inset 0 0 0 1px var(--line);backdrop-filter:blur(3px);opacity:0;transform:translateY(8px);transition:opacity .4s,transform .4s;pointer-events:none}
#info.on{opacity:1;transform:none;pointer-events:auto}
#info h4{margin:0 0 6px;font-size:15px;letter-spacing:.16em}
#info h4 small{font-size:11.5px;font-weight:400;color:var(--gold);letter-spacing:.1em;margin-left:10px}
#info p{margin:0 0 4px;font-size:13px;line-height:1.7;color:var(--dim)}
#info p.n{color:rgba(var(--amber),.9)}

/* 底下的钮 */
#ctl{position:fixed;left:3%;right:calc(var(--aside) + 3%);bottom:26px;z-index:6;display:flex;justify-content:center;gap:14px}
#ctl button{all:unset;cursor:pointer;min-width:132px;text-align:center;padding:11px 22px;border-radius:30px;font-size:14px;letter-spacing:.3em;text-indent:.3em;border:1px solid rgba(236,229,214,.3);color:var(--pale);background:rgba(7,8,12,.5)}
#ctl button.pri{background:linear-gradient(180deg,#e8cf95,#c9a764);color:#20180c;border-color:transparent;box-shadow:0 6px 20px rgba(0,0,0,.45)}
#ctl button[disabled]{opacity:.38;cursor:default}
#ctl button:focus-visible{outline:2px solid rgb(var(--amber));outline-offset:3px}

/* 右边：碑上刻名的那一格 */
#aside{position:fixed;right:28px;top:22px;bottom:22px;width:calc(var(--aside) - 56px);z-index:7;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px}
#aside .lb{font-size:11px;letter-spacing:.4em;color:var(--dim);text-align:center}
#aside .lb b{display:block;font-size:13px;font-weight:600;color:var(--pale);letter-spacing:.3em;margin-bottom:3px}
#idc{position:relative;width:min(100%,300px);aspect-ratio:2/3;transform-origin:50% 50%;transition:transform .8s cubic-bezier(.3,.7,.2,1),opacity .5s;filter:drop-shadow(0 18px 30px rgba(0,0,0,.65))}
#idc .art{position:absolute;inset:0;border-radius:8px;background:url(assets/id_bronze.webp) center/cover,linear-gradient(135deg,#15171d 49.5%,#d9d5cc 50.5%)}
#idc .niche{position:absolute;left:var(--nl,20.5%);top:var(--nt,13.5%);width:var(--nw,59%);height:var(--nh,43%);border-radius:50% 50% 4px 4px/24% 24% 4px 4px;overflow:hidden;background:rgba(10,11,15,.35)}
#idc .niche img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 40%;transform:scale(1.55);transform-origin:50% 42%;opacity:0;transition:opacity .6s}
#idc .niche img.on{opacity:.95}
#idc .niche svg{position:absolute;inset:8% 14% 0;width:72%;height:92%;opacity:.5;transition:opacity .5s}
#idc .niche.has svg{opacity:0}
#idc .rows{position:absolute;left:13%;right:13%;top:0;bottom:0;text-align:center}
#idc .rows>*{position:absolute;left:0;right:0;margin:auto;width:max-content;max-width:100%;transform:translateY(-50%)}
#idc .rows>:nth-child(1){top:63.6%}#idc .rows>:nth-child(2){top:73.6%}#idc .rows>:nth-child(3){top:78.9%}#idc .rows>:nth-child(4){top:84.1%}
#idc .nm{font-size:21px;line-height:1.35;font-weight:900;letter-spacing:.34em;text-indent:.34em;color:#2b2a29;text-shadow:0 1px 0 rgba(255,255,255,.55),0 -1px 0 rgba(0,0,0,.35)}
#idc .ln{font-size:11px;letter-spacing:.1em;color:#2f2c29;font-weight:600;text-shadow:0 1px 0 rgba(255,255,255,.55)}
#idc .ln .e{color:rgba(62,59,55,.5);font-weight:400}
#idc .st{font-size:11px;letter-spacing:.04em;padding:1px 9px;max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;border-radius:10px;background:rgba(20,21,26,.75);color:var(--pale);box-shadow:0 0 0 1px rgba(217,192,140,.35)}
#idc .st.e{background:rgba(20,21,26,.28);color:rgba(236,229,214,.55)}
#idc .st[data-t=Unique]{box-shadow:0 0 0 1px #fff,0 0 14px rgba(255,255,255,.65)}
#idc .st[data-t=Legend]{box-shadow:0 0 0 1px rgb(var(--legend)),0 0 10px rgba(var(--legend),.5)}
#idc .st[data-t=Epic]{box-shadow:0 0 0 1px rgb(var(--epic))}
#idc .mark{position:absolute;left:5%;top:3%;width:19%;opacity:0;transform:scale(1.6);transition:opacity .4s,transform .4s}
#idc.minted .mark{opacity:1;transform:none}
#idc.minted .nm{color:#3a2c18;text-shadow:0 0 10px rgba(var(--amber),.9),0 1px 0 rgba(255,255,255,.5)}
#idc .pop{animation:pop .7s ease-out}
@keyframes pop{0%{transform:scale(1)}35%{transform:scale(1.08)}100%{transform:scale(1)}}
#aside .x{display:none}
#aside .hint{font-size:12px;letter-spacing:.14em;color:var(--dim)}
#idc.shake{animation:shake .45s ease-out}
@keyframes shake{0%{translate:0 0}15%{translate:-4px 2px}30%{translate:4px -2px}45%{translate:-3px 1px}60%{translate:2px 0}100%{translate:0 0}}
/* 手机上那一条 */
#idm{display:none}

/* 手 */
#hand{position:fixed;left:0;top:0;z-index:36;pointer-events:none;transform-origin:0 0;transition:transform .55s cubic-bezier(.35,.6,.2,1),opacity .4s;filter:drop-shadow(0 14px 22px rgba(0,0,0,.55))}
#hand img{display:block;width:100%;height:100%}
#hand.slow{transition-duration:.9s}

/* 铸印 */
#seal{position:fixed;left:0;top:0;width:170px;height:170px;z-index:37;pointer-events:none;opacity:0;transition:transform .42s cubic-bezier(.6,0,.9,.4),opacity .3s}
#ring{position:fixed;left:0;top:0;width:200px;height:200px;margin:-100px 0 0 -100px;border-radius:50%;z-index:36;pointer-events:none;opacity:0;box-shadow:0 0 0 3px rgba(var(--amber),.85),0 0 40px 10px rgba(var(--amber),.5),inset 0 0 30px rgba(var(--amber),.5)}
#ring.go{animation:ring .9s ease-out}
@keyframes ring{0%{opacity:1;transform:scale(.2)}100%{opacity:0;transform:scale(2.6)}}
#book{position:fixed;left:0;top:0;width:52px;height:310px;z-index:38;pointer-events:none;opacity:0;transform-origin:50% 50%;transition:transform .9s cubic-bezier(.45,.05,.25,1),opacity .5s;border-radius:4px 6px 6px 4px;
  background:linear-gradient(90deg,rgba(255,255,255,.14),rgba(255,255,255,0) 30%,rgba(0,0,0,.35)),linear-gradient(160deg,#101217 0 52%,#e6e2d9 52.5% 100%);box-shadow:0 0 0 1px rgba(217,192,140,.55),0 10px 30px rgba(0,0,0,.7)}
#book::before,#book::after{content:"";position:absolute;left:4px;right:4px;height:3px;border-top:1px solid var(--gold);border-bottom:1px solid var(--gold)}
#book::before{top:22px}#book::after{bottom:22px}
#book b{position:absolute;left:0;right:0;top:46px;writing-mode:vertical-rl;margin:auto;font-size:18px;font-weight:900;letter-spacing:.4em;color:var(--gold);display:flex;align-items:center;justify-content:center;width:100%;text-shadow:0 0 8px rgba(0,0,0,.8)}
#book i{position:absolute;left:0;right:0;bottom:36px;text-align:center;font-style:normal;font-size:10px;writing-mode:vertical-rl;margin:auto;width:100%;display:flex;justify-content:center;letter-spacing:.3em;color:#2b2a29}
#shelf{position:fixed;right:26px;top:16px;width:330px;height:178px;z-index:35;pointer-events:none;opacity:0;transform:translateY(-10px);transition:opacity .6s,transform .6s}
#shelf.on{opacity:1;transform:none}
#shelf .case{position:absolute;inset:0;border-radius:8px 8px 4px 4px;background:linear-gradient(180deg,#1b1714,#0e0c0b);box-shadow:inset 0 0 0 1px rgba(217,192,140,.25),0 12px 30px rgba(0,0,0,.6)}
#shelf .row{position:absolute;left:14px;right:14px;bottom:18px;height:132px;display:flex;align-items:flex-end;gap:3px;border-bottom:6px solid #2a221c}
#shelf .sp{width:var(--w,18px);height:var(--h,110px);border-radius:2px 3px 0 0;background:var(--c);box-shadow:inset 0 6px 0 -3px rgba(217,192,140,.5),inset 0 -8px 0 -5px rgba(217,192,140,.4),inset -3px 0 0 rgba(0,0,0,.25)}
#shelf .slot{width:24px;height:122px;border:1px dashed rgba(var(--amber),.6);border-bottom:0;border-radius:2px 2px 0 0;box-shadow:0 0 16px rgba(var(--amber),.25)}
#shelf .slot.full{border-color:transparent;box-shadow:0 0 22px rgba(var(--amber),.55)}
#shelf .cap{position:absolute;left:0;right:0;top:9px;text-align:center;font-size:10.5px;letter-spacing:.4em;color:var(--dim)}

/* 手机 */
@media (max-width:760px){
  :root{--aside:0px}
  #top{left:16px;right:16px;top:max(10px,env(safe-area-inset-top));gap:10px;flex-direction:column;align-items:flex-start}
  #top .t{display:none}
  #top h1{font-size:15px;margin:0}
  #top h1 small{font-size:11px;margin-left:6px}
  #steps{gap:2px}#steps li{font-size:11.5px;letter-spacing:.16em;padding:3px 8px 3px 5px}
  #aside{display:none}
  #aside.open{display:flex;position:fixed;inset:0;width:auto;right:0;top:0;bottom:0;background:rgba(7,8,12,.86);z-index:30;padding:20px}
  #aside.open #idc{width:min(78vw,300px)}
  #aside .x{display:none}
  body.minting #say{z-index:39}
  body.minting #aside .lb{visibility:hidden}
  body.minting #aside.open .x{display:none}
  #aside.open .x{display:block;all:unset;cursor:pointer;position:absolute;right:18px;top:16px;font-size:13px;letter-spacing:.3em;color:var(--pale);padding:6px 10px;border:1px solid var(--line);border-radius:16px}
  #idm{display:flex;position:fixed;left:12px;right:12px;top:80px;height:58px;z-index:7;align-items:center;gap:10px;padding:6px 12px 6px 6px;border-radius:12px;cursor:pointer;

}

    <div class="rows">

      <circle cx="50" cy="50" r="39" fill="none" stroke="#d9c08c" stroke-width="1" stroke-dasharray="2 3"/>
      <path d="M50 18v52M42 26h16M47 70l3 9 3-9" stroke="#ffb068" stroke-width="3.2" fill="none" stroke-linecap="round"/>
      <path d="M30 76l3-30 8-3 2 33zM70 76l-3-30-8-3-2 33z" fill="#e9e6df" opacity=".85"/>

  </defs>
</svg>

<script src="data.js"></script>
<script>
(() => {
'use strict';
const BD = window.BD;
const Q = new URLSearchParams(location.search);
const RM = matchMedia('(prefers-reduced-motion: reduce)').matches;
const T = (ms) => new Promise((r) => setTimeout(r, RM ? 0 : ms));
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s == null ? '' : s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const ART = new Set(BD.art || []);
const mobile = () => innerWidth <= 760;
const table = $('#table'), say = $('#say'), info = $('#info'), bNext = $('#bNext'), bBack = $('#bBack');

const SOUL = [
  { k: 'native', n: '本地之魂', tag: '生于此世', d: '你生在这一纪，有父母，有故乡。走出这座神殿，这里的事你会慢慢忘掉，睁开眼时，你已经是在那里长大的人。', i: '可以挑金血', say: ['那你便生在那一纪。', '睁开眼的时候，你已经在那里长大了。'] },
  { k: 'reborn', n: '转生之魂', tag: '胎穿 · 带着记性重来', d: '你在另一个世界死去，还记得那一生。你会在这一纪重新出生、长大，带着只有自己知道的往事。', i: '可以挑金血', say: ['你仍带着前世的记忆。', '走到这里的灵魂，原该放下旧事。既然你还记得，就带着它们重新生活。'] },
  { k: 'isekai', n: '降临之魂', tag: '身穿 · 原样落进来', d: '你连同身体和随身之物一起到了这里。故乡、亲友和过去的生活都留在另一个世界，这一纪没有人见过你，你在这里没有生日，也没有故乡。', i: '她会给你一件赐物', say: ['连身体也一同到了这里。', '你的旅程尚未结束。离开这座神殿，去看看那一纪吧。'] },
];
const RACE_ART = { human: 'race_human', elf: 'race_highelf', dwarf: 'race_dwarf', demon: 'race_demon' };
const LINES = {
  0: { in: ['生者自有去处，亡魂也有归程。', '你既已来到这里，便将来历说清。三张牌，翻一张给我看。'], idle: ['手停在牌上不动，牌也替你选不了。', '翻错了也不要紧，再翻一张就是。'], none: ['还没翻牌。先翻一张，再往下走。'] },
  1: { in: ['犁的年月，墙两边住着十二族。', '挑一张翻过来，看你生在哪一支。'], idle: ['看了这么久，是在等哪一张自己跳起来？', '十二张都摆在这里了，我可不会再多给一张。'], none: ['族挑了，支还没挑。翻过来那一面才算数。'], done: ['这副骨头，往后你得带着走很久。', '选好了就别回头嫌它。'] },
  2: { in: ['这一叠是星。我替你抽，你来留。', '生来的留一颗，学来的留一颗。'], idle: ['抽了不留，牌桌上可没有这个规矩。'], none: ['两颗都要留。生来的和学来的，缺一颗碑匠不刻。'], redraw: ['还要？星不会越抽越亮，是你越抽越贪。', '好吧，再给你五张。'] },
  3: { in: ['名字刻进碑里，就改不回去了。', '想好了，就按下去。'], done: ['刻好了。这一本，我替你放上架。', BD.leave] },
};
const TIER_SAY = {
  Unique: ['这一颗，世上同一时刻只亮在一个人身上。', '你运气倒好。别急着高兴，它要的也多。'],
  Legend: ['歌里有人带过这一颗。', '留不留，看你。'],
  Epic: ['还算像样，撑得起一路的本事。', '再往上的，就看你肯不肯再抽。'],
  Rare: ['都是寻常的星。', '寻常的也能走很远，只是走得辛苦些。'],
};
const T_RANK = { Unique: 4, Legend: 3, Epic: 2, Rare: 1, Normal: 0 };

const S = { step: 0, soul: null, race: null, sub: null, star: { P: null, A: null }, pool: 'P', draw: { P: { n: 0, lp: 0, up: 0, ids: [] }, A: { n: 0, lp: 0, up: 0, ids: [] } }, forced: false, busy: false };
let cards = [], idleT = 0, idleN = 0, lineSeq = 0;

/* ---------- 她的话 ---------- */
async function speak(lines) {
  const my = ++lineSeq; const ps = say.querySelectorAll('p');
  ps.forEach((p) => p.classList.remove('on'));
  await T(260); if (my !== lineSeq) return;
  ps[0].textContent = lines[0] || ''; ps[1].textContent = lines[1] || '';
  ps[0].classList.add('on'); await T(450); if (my !== lineSeq) return; if (lines[1]) ps[1].classList.add('on');
}
function poke() { clearTimeout(idleT); idleT = setTimeout(() => { const L = LINES[S.step].idle; if (L && !S.busy) speak([L[idleN++ % L.length]]); }, 11000); }
addEventListener('pointerdown', poke); addEventListener('keydown', poke);

/* ---------- 手 ---------- */
const hand = $('#hand'), himg = hand.querySelector('img');
let H = BD.hands.hand_push, handW = 0;
function setHand(name) {
  const h = BD.hands[name] || BD.hands.hand_push; H = h;
  himg.src = 'assets/' + (h.src || name) + '.webp';
}
// 把手摆到“指尖下那张牌”的中心落在 (x,y)、牌宽 w、牌斜 r 度的地方
function handTo(x, y, w, r = 0, off = false) {
  r = ((((r + 90) % 180) + 180) % 180) - 90;   // 牌转半圈还是同一个方框：手照指尖那张牌的朝向摆，手臂总从上边来
  const hw = w / H.cw, hh = hw * H.h / H.w;
  if (Math.abs(hw - handW) > .5) { hand.style.width = hw + 'px'; hand.style.height = hh + 'px'; handW = hw; }
  const ox = H.c[0] * hw, oy = H.c[1] * hh;
  hand.style.transformOrigin = ox + 'px ' + oy + 'px';
  const ty = off ? -hh - 60 : y - oy;
  hand.style.transform = `translate(${x - ox}px,${ty}px) rotate(${r - H.ang}deg)`;
}
function handAway(x, w) { handTo(x == null ? innerWidth * .4 : x, 0, w || 160, 0, true); }
function handRest() {
  // 不动的时候，手停在桌子上沿，露出指尖，像她在桌那头等着
  if (mobile()) { handAway(innerWidth * .8, 90); return; }   // 手机上桌子窄，手不停在桌沿，免得盖住顶上那一条
  const tr = table.getBoundingClientRect(), w = mobile() ? 90 : 150;
  const hh = (w / H.cw) * H.h / H.w;
  handTo(tr.left + tr.width * (mobile() ? .84 : .88), tr.top + (mobile() ? -24 : 6), w, -12);
}

/* ---------- 牌 ---------- */
function mk(html, cls = '') {
  const el = document.createElement('div'); el.className = 'card ' + cls; el.tabIndex = -1;
  el.innerHTML = `<div class="lift"><div class="flip"><div class="face a"></div><div class="face b"></div></div></div>`;
  table.appendChild(el); return el;
}
function place(el, p, snap = false) {
  // p: x,y 是牌中心在桌上的坐标；r 斜几度；s 放大；o 透明
  el._p = p;
  if (snap) el.classList.add('snap');
  const cw = el.offsetWidth, ch = el.offsetHeight;
  el.style.transform = `translate(${p.x - cw / 2}px,${p.y - ch / 2}px) rotate(${p.r || 0}deg) scale(${p.s || 1})`;
  el.style.opacity = p.o == null ? 1 : p.o;
  if (p.z != null) el.style.zIndex = p.z;
  if (snap) { el.offsetWidth; el.classList.remove('snap'); }
}
const TR = () => table.getBoundingClientRect();
const toView = (p) => { const r = TR(); return { x: r.left + p.x, y: r.top + p.y }; };
function size(cw) { table.style.setProperty('--cw', cw + 'px'); table.style.setProperty('--ch', cw * 1.5 + 'px'); }

// 手推一叠牌进来：牌先叠在手底下（桌子上沿外头），一起推到桌中，手撤走，牌散开到各自的位置
async function pushIn(els, targets, opt = {}) {
  setHand('hand_push');
  const r = TR(), cw = els[0].offsetWidth;
  const sx = opt.sx != null ? opt.sx : r.width / 2, sy = -cw * 1.2;
  els.forEach((el, i) => place(el, { x: sx, y: sy + i * .5, r: 180 - 2 + (i % 3), z: i, o: 1 }, true));
  const v0 = toView({ x: sx, y: sy });
  hand.classList.add('snap'); handTo(v0.x, v0.y, cw, 178, true); hand.offsetWidth; hand.classList.remove('snap');
  await T(30);
  handTo(v0.x, v0.y, cw, 178); await T(420);
  const mid = { x: opt.mx != null ? opt.mx : r.width / 2, y: opt.my != null ? opt.my : r.height * .45 };
  const v1 = toView(mid);
  els.forEach((el, i) => place(el, { x: mid.x, y: mid.y + i * .5, r: 180 - 2 + (i % 3), z: i }));
  handTo(v1.x, v1.y, cw, 178); await T(640);
  handAway(v1.x, cw);
  for (let i = 0; i < els.length; i++) { place(els[i], targets[i]); await T(opt.stagger || 70); }
  await T(500);
  handRest();
}
// 手把桌上的牌收走：拢到一处，跟着手往上走
async function sweep() {
  if (!cards.length) return;
  setHand('hand_push');
  const r = TR(), cw = cards[0].offsetWidth || 120, mid = { x: r.width / 2, y: r.height * .45 };
  const v = toView(mid);
  handTo(v.x, v.y - 30, cw, 180); await T(380);
  cards.forEach((el, i) => { el.classList.remove('up', 'lit', 'hov', 'picked', 'dim'); place(el, { x: mid.x, y: mid.y, r: 180 + (i % 5) - 2, z: i }); });
  handTo(v.x, v.y, cw, 180); await T(560);
  cards.forEach((el) => place(el, { x: mid.x, y: -r.top - cw * 2, r: 180, o: 0 }));
  handAway(v.x, cw); await T(560);
  cards.forEach((el) => el.remove()); cards = [];
  table.querySelectorAll('.deckc,#tabs,#pity').forEach((e) => e.remove());
}

/* ---------- 右边那一格 ---------- */
function idcUpdate() {
  const so = S.soul != null ? SOUL[S.soul] : null, ra = S.race ? BD.races.find((x) => x.k === S.race) : null;
  const t = (id, txt, empty) => { const e = $(id); e.textContent = txt; e.classList.toggle('e', !!empty); };
  t('#iSoul', so ? so.n : '魂未定', !so);
  t('#iRace', ra ? ra.n + (S.sub ? ' · ' + S.sub : '') : '胎骨未定', !ra);
  for (const k of ['P', 'A']) {
    const st = S.star[k] ? BD.stars.find((x) => x.id === S.star[k]) : null;
    const lab = k === 'P' ? '生来的' : '学来的';
    t('#i' + k, st ? lab + ' · ' + st.n + ' · ' + st.tier : lab + ' · 未定', !st);
    $('#i' + k).dataset.t = st ? st.tier : '';
    t('#m' + k, st ? st.n : lab + ' 未定', !st); $('#m' + k).dataset.t = st ? st.tier : '';
  }
  $('#mLine').textContent = (so ? so.n : '魂未定') + ' · ' + (ra ? ra.n + (S.sub ? '·' + S.sub : '') : '胎骨未定');
  const art = ra && RACE_ART[ra.k] && ART.has(RACE_ART[ra.k]) ? 'assets/' + RACE_ART[ra.k] + '.webp' : '';
  for (const box of [$('#idc .niche'), $('#idm .th')]) {
    const img = box.querySelector('img');
    if (art) { if (!img.src.endsWith(art)) img.src = art; img.classList.add('on'); } else img.classList.remove('on');
    box.classList.toggle('has', !!art);
  }
}
const pop = (el) => { el.classList.remove('pop'); el.offsetWidth; el.classList.add('pop'); };
$('#idm').addEventListener('click', () => $('#aside').classList.add('open'));
$('#xAside').addEventListener('click', () => $('#aside').classList.remove('open'));

/* ---------- 第一步：魂 ---------- */
async function stepSoul() {
  speak(LINES[0].in);
  const r = TR(), cw = mobile() ? Math.min(108, r.width / 3.3) : Math.min(216, r.width / 3.6, r.height / 1.62);
  size(cw);
  cards = SOUL.map((s, i) => {
    const el = mk(); el.classList.add('soul');
    el.querySelector('.a').style.backgroundImage = 'url(assets/bb_2.webp)';
    el.querySelector('.b').style.backgroundImage = ART.has('soul_' + s.k) ? `url(assets/soul_${s.k}.webp)` : 'url(assets/bb_2.webp)';
    el.querySelector('.b').innerHTML = `<div class="plate">${esc(s.n)}<small>${esc(s.tag)}</small></div>`;
    el.dataset.i = i; return el;
  });
  const gap = cw * (mobile() ? 1.07 : 1.16);
  const tg = SOUL.map((_, i) => ({ x: r.width / 2 + (i - 1) * gap, y: r.height * .5, r: (i - 1) * 2.5, z: i }));
  await pushIn(cards, tg);
  cards.forEach((el) => { el.classList.add('hov'); el.tabIndex = 0; });
  if (S.soul != null) { cards[S.soul].classList.add('up', 'picked'); showSoul(S.soul, true); }
}
function showSoul(i, quiet) {
  const s = SOUL[i];
  info.innerHTML = `<h4>${esc(s.n)}<small>${esc(s.tag)}</small></h4><p>${esc(s.d)}</p><p class="n">${esc(s.i)}</p>`;
  info.classList.add('on');
  if (!quiet) speak(s.say);
}
async function pickSoul(i) {
  if (S.busy) return;
  cards.forEach((el, j) => { if (j !== i) el.classList.remove('up', 'picked'); });
  const el = cards[i];
  S.busy = true;
  // 翻牌的那只手：捏住牌角翻过来
  setHand('hand_flip');
  const v = toView(el._p), cw = el.offsetWidth;
  hand.style.transition = 'none'; handTo(v.x, v.y - cw, cw * .9, H.ang, true); hand.offsetWidth; hand.style.transition = '';
  handTo(v.x + cw * .25, v.y - cw * .55, cw * .9, H.ang); await T(480);
  el.classList.add('up', 'picked'); await T(260); handAway(v.x, cw); await T(300);
  setHand('hand_push'); handRest(); S.busy = false;
  S.soul = i; idcUpdate(); pop($('#idc')); showSoul(i);
  bNext.disabled = false;
}

/* ---------- 第二步：胎骨 ---------- */
function fanPos(n, r, cw) {
  const out = [];
  if (mobile()) {
    const per = Math.ceil(n / 2), R = r.width * .85, A = 21;

  const sb = e.target.closest('.sb'), back = e.target.closest('.back'), el = e.target.closest('.card');
  if (!el || S.busy) return;
  if (S.step === 0) pickSoul(+el.dataset.i);
  else if (S.step === 1) { if (sb) pickSub(el, +sb.dataset.j); else if (back) unfocus(); else if (!el.classList.contains('up')) focusRace(el); }
  else if (S.step === 2) keepStar(el);
});
table.addEventListener('keydown', (e) => { if ((e.key === 'Enter' || e.key === ' ') && e.target.classList.contains('card')) { e.preventDefault(); e.target.click(); } });
let rz = 0;
addEventListener('resize', () => { clearTimeout(rz); rz = setTimeout(() => {
  if (S.busy) return;
  const r = TR();
  if (S.step === 0 && cards.length) { const cw = mobile() ? Math.min(108, r.width / 3.3) : Math.min(216, r.width / 3.6, r.height / 1.62); size(cw); const gap = cw * (mobile() ? 1.07 : 1.16); cards.forEach((el, i) => place(el, { x: r.width / 2 + (i - 1) * gap, y: r.height * .5, r: (i - 1) * 2.5, z: i }, true)); }
  if (S.step === 1 && cards.length) { const cw = mobile() ? Math.min(70, r.width / 5.4) : Math.min(132, r.width / 8.2, r.height / 2.3); size(cw); fan = fanPos(cards.length, r, cw); cards.forEach((el, i) => place(el, fan[i], true)); }
  if (S.step === 2) { starLayout(); drawDeck(); cards.forEach((el, i) => place(el, slots[i], true)); }
  handRest();
}, 150); });

// 书架上先摆几本（四纪各一本，加几本别人的）
$('#shelfRow').innerHTML = [['#3c5a8f', 22, 118], ['#5b6577', 16, 104], ['#7a2c2a', 24, 122], ['#3a3d44', 18, 110], ['linear-gradient(160deg,#111 52%,#ddd 52.5%)', 22, 116], ['#1f2c5c', 26, 124], ['#8a7a5a', 14, 96], ['#2d3140', 18, 108]]
  .map(([c, w, h]) => `<div class="sp" style="--c:${c};--w:${w}px;--h:${h}px;background:${c}"></div>`).join('') + '<div class="slot"></div>' + [['#4a3a5e', 18, 112], ['#5e4b2e', 20, 100]].map(([c, w, h]) => `<div class="sp" style="--w:${w}px;--h:${h}px;background:${c}"></div>`).join('');

// 给截图脚本用的钩子
window.__bd = { S, go, pickSoul, focusRace: (k) => focusRace(cards.find((c) => c.dataset.k === k)), pickSub: (k, j) => pickSub(cards.find((c) => c.dataset.k === k), j), draw, switchPool,
  keep: (i) => keepStar(cards[i]), keepTop: () => { let b = 0; cards.forEach((c, i) => { if (T_RANK[c.dataset.t] > T_RANK[cards[b].dataset.t]) b = i; }); keepStar(cards[b]); }, mint, busy: () => S.busy };

idcUpdate();
hand.style.transition = 'none'; handAway(innerWidth / 2, 160); hand.offsetWidth; hand.style.transition = '';
go(0);
})();
</script>
