<title>纷争纪的路</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600;900&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#05060b; --pale:#ece5d6; --dim:rgba(236,229,214,.6); --line:rgba(236,229,214,.18);
  --ember:236,150,110; --dark:#2a2018;
  --serif:'Noto Serif SC','Songti SC','STSong','SimSun',serif;
  color-scheme:dark;
}
html,body{margin:0;height:100%;background:var(--ink);overflow:hidden}
body{color:var(--pale);font-family:var(--serif);-webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%}
#view{position:fixed;inset:0;overflow:hidden;background:#0a0b11;user-select:none;-webkit-user-select:none;touch-action:none;cursor:default}
#fx{position:absolute;left:0;top:0;width:100%;height:100%;display:block;pointer-events:none}

/* 跟着路一起走的：十一段长卷，二十二张牌，牌底下的名字 */
#strip{position:absolute;left:0;top:0;height:100%;width:0;will-change:transform}
.pn{position:absolute;top:0;display:block;max-width:none;pointer-events:none;-webkit-user-drag:none}
.endbg{position:absolute;top:0}
.grid{position:absolute;top:0;pointer-events:none;background-image:linear-gradient(to right,rgba(0,255,255,.55) 1px,transparent 1px),linear-gradient(to bottom,rgba(0,255,255,.55) 1px,transparent 1px);background-size:10% 10%}
.dot{position:absolute;width:12px;height:12px;margin:-6px 0 0 -6px;border-radius:50%;background:#f0f;pointer-events:none}
#view.nocard .card,#view.nocard .lab{display:none}
.card{position:absolute;perspective:900px;transform:rotate(var(--tilt,0deg));transform-origin:50% 100%;transition:transform .4s}
.card.on{transform:rotate(var(--tilt,0deg)) translateY(-4px) scale(1.04)}
.card.hov{transform:rotate(var(--tilt,0deg)) translateY(-8px) scale(1.07)}
.card .sh{position:absolute;left:16%;right:16%;bottom:0;height:9%;border-radius:50%;background:radial-gradient(closest-side,rgba(0,0,0,.55),rgba(0,0,0,0))}
.card .flip{position:absolute;inset:0;transform-style:preserve-3d;transition:transform 1.05s cubic-bezier(.3,.75,.25,1)}
.card.up .flip{transform:rotateY(180deg)}
/* 牌是抠出来的拱窗形（石框、缎带，画溢出框外），图四周留着透明的空，暗影烘在图里 */
.card .f{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden}
.card .back{background:url(assets/card/back.webp) center/contain no-repeat}
.card .front{transform:rotateY(180deg)}
.card .front img{display:block;width:100%;height:100%;object-fit:contain;-webkit-user-drag:none}
.lab{position:absolute;text-align:center;pointer-events:none;opacity:0;transform:translateY(-4px);transition:opacity .7s .35s,transform .7s .35s}
.lab.up{opacity:.82;transform:none}
.lab.on{opacity:1}
.lab>span{display:inline-block;padding:6px 14px 8px;background:rgba(6,7,12,.7);border:1px solid rgba(236,229,214,.16)}
.lab small{display:block;font-size:11.5px;letter-spacing:.22em;color:rgb(var(--ember))}
.lab b{display:block;margin-top:4px;font-weight:600;font-size:19px;letter-spacing:.14em;line-height:1.3}
.lab i{display:block;margin-top:3px;font-style:normal;font-size:12px;letter-spacing:.1em;color:var(--dim)}
.sec{position:absolute;display:flex;align-items:center;justify-content:center;gap:clamp(18px,3.2vw,44px);box-sizing:border-box;padding:0 28px}
.sec h2{margin:0;writing-mode:vertical-rl;font-weight:900;font-size:clamp(40px,7.4vh,72px);letter-spacing:.34em;line-height:1;flex:none}
.sec .tx{max-width:21em}
.sec .line{margin:0;font-size:clamp(18px,2.5vh,24px);font-weight:600;letter-spacing:.12em;line-height:1.7}
.sec .sub{margin:14px 0 0;font-size:12.5px;letter-spacing:.2em;opacity:.7}
.sec .desc{margin:18px 0 0;font-size:14.5px;line-height:2;letter-spacing:.05em;opacity:.84}
.sec .how{margin:26px 0 0;padding-top:16px;border-top:1px solid currentColor;font-size:13px;letter-spacing:.1em;line-height:1.9;opacity:.6}
.sec.pale{text-shadow:0 1px 12px rgba(0,0,0,.9)}
.sec.end{flex-direction:column;gap:22px;text-align:center;color:var(--dark);opacity:0;transition:opacity 1.6s .3s}
.sec.end.show{opacity:1}
.sec.end blockquote{margin:0;font-size:min(clamp(17px,2.6vh,25px),5vw);font-weight:600;letter-spacing:.16em;line-height:2.15}
.sec.end p{margin:0;font-size:13.5px;letter-spacing:.14em;line-height:1.9;opacity:.8}
.sec.end .sub{font-size:12px;letter-spacing:.3em;opacity:.6}

/* 钉在屏幕上的 */
#veil{position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse at 50% 48%,rgba(4,5,10,0) 52%,rgba(4,5,10,.56) 100%),linear-gradient(180deg,rgba(4,5,10,.46) 0,rgba(4,5,10,0) 15%,rgba(4,5,10,0) 80%,rgba(4,5,10,.52) 100%)}
#dawn{position:absolute;inset:0;pointer-events:none;opacity:0;background:radial-gradient(130% 100% at 100% 32%,rgba(255,238,200,.62) 0,rgba(255,238,200,.2) 46%,rgba(255,238,200,0) 74%);mix-blend-mode:screen}
#top{position:absolute;left:max(18px,env(safe-area-inset-left));top:max(14px,env(safe-area-inset-top));display:flex;align-items:baseline;gap:14px;pointer-events:none;text-shadow:0 1px 10px rgba(0,0,0,.85);transition:color .8s}
#top b{font-weight:900;font-size:19px;letter-spacing:.3em}
#top span{font-size:12.5px;letter-spacing:.24em;color:var(--dim);transition:color .8s}
#part{position:absolute;left:0;right:0;top:41%;text-align:center;pointer-events:none;opacity:0;transform:translateY(8px);transition:opacity .9s,transform .9s;text-shadow:0 2px 18px rgba(0,0,0,.95),0 0 4px rgba(0,0,0,.6)}
#part.on{opacity:1;transform:none}
#part b{display:block;font-weight:900;font-size:clamp(30px,5.6vh,56px);letter-spacing:.4em;text-indent:.4em}
#part span{display:block;margin-top:10px;font-size:13px;letter-spacing:.3em;text-indent:.3em;color:rgba(236,229,214,.8)}
#rail{position:absolute;left:0;right:0;bottom:max(12px,env(safe-area-inset-bottom));display:flex;justify-content:center;gap:12px;pointer-events:none}
#rail .grp{position:relative;display:flex;gap:3px;padding-bottom:18px;pointer-events:auto}
#rail .grp::after{content:attr(data-n);position:absolute;left:50%;bottom:0;transform:translateX(-50%);font-size:10.5px;letter-spacing:.24em;color:var(--dim);white-space:nowrap;opacity:0;transition:opacity .4s}
#rail .grp.cur::after{opacity:1}
#rail button{all:unset;box-sizing:border-box;width:8px;height:22px;cursor:pointer;position:relative}
#rail button::before{content:'';position:absolute;left:3px;right:3px;bottom:0;height:9px;background:rgba(236,229,214,.3);transition:height .25s,background .25s}
#rail button.seen::before{background:rgba(var(--ember),.75)}
#rail button.cur::before{height:20px;background:var(--pale)}
#rail button:focus-visible{outline:1px solid var(--pale);outline-offset:1px}
#hint{position:absolute;left:0;right:0;bottom:calc(max(12px,env(safe-area-inset-bottom)) + 58px);margin:0;text-align:center;font-size:12.5px;letter-spacing:.2em;color:var(--dim);pointer-events:none;transition:opacity 1.2s;text-shadow:0 1px 8px rgba(0,0,0,.9)}
#hint.off{opacity:0}
#view.light #top{color:var(--dark);text-shadow:0 0 12px rgba(255,248,230,.85)}
#view.light #top span{color:rgba(42,32,24,.7)}
#view.light #rail button::before{background:rgba(42,32,24,.3)}
#view.light #rail button.seen::before{background:rgba(150,70,40,.7)}
#view.light #rail button.cur::before{background:var(--dark)}
#view.light #rail .grp::after{color:rgba(42,32,24,.75)}

/* 进来的那一下 */
#intro{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;background:var(--ink);transition:opacity 1.5s;cursor:pointer}
#intro.off{opacity:0;pointer-events:none}
#intro small{font-size:13px;letter-spacing:.5em;color:var(--dim);margin-right:-.5em}
#intro h1{margin:0;font-weight:900;font-size:clamp(46px,9vh,88px);letter-spacing:.42em;margin-right:-.42em}
#intro p{margin:0;font-size:15px;letter-spacing:.34em;color:var(--dim);margin-right:-.34em}
#intro *{opacity:0;animation:rise 1.4s forwards}
#intro h1{animation-delay:.25s}#intro p{animation-delay:.7s}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

/* 时代页 */
#page{position:absolute;inset:0;background:radial-gradient(120% 90% at 30% 40%,#0d0e16 0,#05060b 70%);opacity:0;transform:translateY(18px);transition:opacity .4s,transform .4s;overflow:hidden}
#page.on{opacity:1;transform:none}
#page[hidden]{display:none}
#pg-wrap{position:absolute;inset:0;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;touch-action:pan-y}
#pg-art{position:relative;height:56vh;overflow:hidden}
#pg-art img{width:100%;height:100%;object-fit:cover;object-position:50% 30%;display:block}
#pg-art::after{content:'';position:absolute;inset:0;background:linear-gradient(180deg,rgba(4,5,10,.25) 0,rgba(4,5,10,0) 30%,rgba(4,5,10,0) 55%,rgba(4,5,10,.96) 100%)}
#pg-body{position:relative;margin-top:-64px;padding-block:0 120px;padding-left:max(22px,env(safe-area-inset-left,0px));padding-right:max(22px,env(safe-area-inset-right,0px));max-width:760px;box-sizing:border-box}
#pg-close{all:unset;position:absolute;right:max(14px,env(safe-area-inset-right));top:max(12px,env(safe-area-inset-top));z-index:3;cursor:pointer;font-size:12.5px;letter-spacing:.22em;padding:9px 14px;border:1px solid var(--line);background:rgba(4,5,10,.6);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
#pg-close:focus-visible{outline:1px solid var(--pale)}
.eyebrow{margin:0;font-size:12.5px;letter-spacing:.26em;color:rgb(var(--ember))}
#pg-body h1,#pg-hd h1{margin:12px 0 0;font-weight:900;font-size:clamp(30px,5.2vh,46px);letter-spacing:.14em;line-height:1.3}
#pg-body .ti,#pg-hd .ti{margin:14px 0 0;font-size:18px;font-weight:600;letter-spacing:.12em;line-height:1.7}
#pg-body .desc,#pg-hd .desc{margin:12px 0 0;font-size:15.5px;line-height:2.05;letter-spacing:.05em;color:rgba(236,229,214,.86)}
#pg-body h2{margin:54px 0 0;padding-bottom:12px;border-bottom:1px solid var(--line);font-size:13px;font-weight:600;letter-spacing:.5em;color:var(--dim)}
/* 这一张牌：牌面，回目，谁唱，牌文。页边那一行在牌角上，很淡 */
.tarot{margin:34px 0 0;display:grid;grid-template-columns:1fr;gap:26px}
.tarot figure{all:unset;display:block;position:relative;width:min(330px,86%);justify-self:center;cursor:zoom-in}
.tarot figure img{display:block;width:100%;aspect-ratio:2/3;object-fit:contain}
.tarot figure:focus-visible{outline:1px solid rgb(var(--ember));outline-offset:5px}
.tarot .mg{display:block;margin:-3% 6% 0;text-align:center;font-size:11px;line-height:1.7;letter-spacing:.1em;color:#f1e8d4;opacity:.24;transition:opacity .7s;pointer-events:none}
.tarot figure:hover .mg,.tarot figure:focus-visible .mg{opacity:.92}
.tarot .no{margin:0;font-weight:900;font-size:30px;letter-spacing:.2em;color:rgb(var(--ember));line-height:1}
.tarot h3{margin:14px 0 0;font-size:16.5px;font-weight:600;line-height:1.9;letter-spacing:.08em;color:#f6e9d2}
.tarot .sung{margin:10px 0 0;font-size:12.5px;letter-spacing:.2em;color:var(--dim)}
.tarot .song{margin:18px 0 0;padding:2px 0 2px 20px;border-left:2px solid rgba(var(--ember),.55)}
.tarot .song p{margin:0 0 14px;font-size:15.5px;line-height:2.05;letter-spacing:.05em;color:rgba(236,229,214,.92)}
.tarot .song p:last-child{margin-bottom:0}
details.ln{margin:18px 0 0;border:1px solid var(--line);background:rgba(236,229,214,.035)}
details.ln>summary{list-style:none;cursor:pointer;padding:18px 20px;display:grid;grid-template-columns:auto 1fr;gap:4px 18px;align-items:baseline}
details.ln>summary::-webkit-details-marker{display:none}
details.ln>summary .yr{grid-row:1/3;font-size:13px;letter-spacing:.14em;color:rgb(var(--ember));white-space:nowrap;align-self:start;padding-top:5px}
details.ln>summary .tt{font-size:19px;font-weight:600;letter-spacing:.1em;line-height:1.55}
details.ln>summary .nm{font-size:12px;letter-spacing:.2em;color:var(--dim)}
details.ln[open]>summary{border-bottom:1px solid var(--line)}
.ln .in{padding:18px 20px 22px}
.ln .hook{margin:0 0 6px;font-size:16px;font-weight:600;line-height:1.9;letter-spacing:.06em;color:#f6e9d2}
.ln h4{margin:22px 0 8px;font-size:12px;font-weight:600;letter-spacing:.34em;color:var(--dim)}
.ln p.open{margin:0;font-size:15px;line-height:2;letter-spacing:.04em;color:rgba(236,229,214,.88)}
.ln ol{margin:0;padding:0;list-style:none}
.ln ol li{position:relative;padding:0 0 12px 22px;font-size:14.5px;line-height:1.85;letter-spacing:.04em;color:rgba(236,229,214,.8)}
.ln ol li::before{content:'';position:absolute;left:3px;top:.72em;width:7px;height:7px;transform:rotate(45deg);background:rgba(var(--ember),.8)}
.ln ol li::after{content:'';position:absolute;left:6px;top:1.5em;bottom:-.3em;width:1px;background:var(--line)}
.ln ol li:last-child::after{display:none}
.ln ol li b{font-weight:600;color:var(--pale);margin-right:.8em;letter-spacing:.1em}
details.end{margin:20px 0 0;border-top:1px dashed var(--line);padding-top:14px}
details.end>summary{cursor:pointer;font-size:13px;letter-spacing:.24em;color:var(--dim);list-style:none}
details.end>summary::-webkit-details-marker{display:none}
details.end>summary::after{content:'　揭开';color:rgb(var(--ember))}
details.end[open]>summary::after{content:'　合上'}
details.end p{margin:12px 0 0;font-size:14.5px;line-height:2;letter-spacing:.04em;color:rgba(236,229,214,.78)}
.go{all:unset;box-sizing:border-box;display:block;margin:24px 0 0;padding:13px 0;width:100%;text-align:center;cursor:pointer;font-size:14px;font-weight:600;letter-spacing:.5em;text-indent:.5em;color:var(--ink);background:var(--pale)}
.go:hover{background:#fff}
.go:focus-visible{outline:2px solid rgb(var(--ember));outline-offset:2px}
.cast{margin:20px -22px 0;padding:0 22px 8px;display:flex;gap:14px;overflow-x:auto;scroll-snap-type:x proximity;scroll-padding:0 22px;-webkit-overflow-scrolling:touch;touch-action:pan-x pan-y}
.cast figure{margin:0;flex:none;width:156px;scroll-snap-align:start}
.cast i.por{display:block;width:156px;height:234px;background-color:#12131a;background-repeat:no-repeat}
.cast .noimg{width:156px;height:234px;background:linear-gradient(160deg,#171922,#0b0c12);display:flex;align-items:center;justify-content:center;font-size:38px;font-weight:900;color:rgba(236,229,214,.16)}
.cast figcaption b{display:block;margin-top:10px;font-size:15.5px;font-weight:600;letter-spacing:.1em}
.cast figcaption span{display:block;margin-top:3px;font-size:11.5px;letter-spacing:.18em;color:rgb(var(--ember))}
.cast figcaption p{margin:6px 0 0;font-size:12.5px;line-height:1.75;color:rgba(236,229,214,.72)}
ul.places{margin:18px 0 0;padding:0;list-style:none;display:grid;grid-template-columns:1fr;gap:0}
ul.places li{padding:13px 0;border-bottom:1px solid var(--line);display:grid;grid-template-columns:auto 1fr;gap:2px 14px;align-items:baseline}
ul.places b{font-size:15.5px;font-weight:600;letter-spacing:.08em}
ul.places span{font-size:11.5px;letter-spacing:.18em;color:var(--dim)}
ul.places p{grid-column:1/3;margin:2px 0 0;font-size:13px;line-height:1.8;color:rgba(236,229,214,.7)}
ul.places em{grid-column:1/3;font-style:normal;font-size:12px;letter-spacing:.1em;color:rgb(var(--ember))}
#sheet{position:absolute;inset:0;display:flex;align-items:flex-end;justify-content:center;background:rgba(0,0,0,.55);z-index:8}
#sheet[hidden]{display:none}
#sheet .box{width:min(560px,100%);box-sizing:border-box;padding:26px 26px calc(26px + env(safe-area-inset-bottom));background:#0d0e15;border-top:1px solid var(--line)}
#sheet h3{margin:10px 0 0;font-size:20px;font-weight:600;letter-spacing:.1em;line-height:1.6}
#sheet p{margin:10px 0 0;font-size:14px;line-height:1.9;color:rgba(236,229,214,.78)}
#sheet .note{color:var(--dim);font-size:12.5px;letter-spacing:.06em}
#sheet button{all:unset;display:block;box-sizing:border-box;width:100%;margin-top:20px;padding:12px 0;text-align:center;cursor:pointer;border:1px solid var(--line);font-size:13.5px;letter-spacing:.4em;text-indent:.4em}
#sheet button:focus-visible{outline:1px solid var(--pale)}

/* 三类人，再加神与魔神 */
.def{margin:12px 0 0;font-size:13px;line-height:1.95;letter-spacing:.06em;color:var(--dim)}
.cast.lg figure{width:112px}
.cast.lg i.por,.cast.lg .noimg{width:112px;height:168px}
.cast.lg .noimg{font-size:28px}
.cast.lg figcaption b{font-size:14.5px}
.cast.lg figcaption i{display:block;margin-top:3px;font-style:normal;font-size:11px;letter-spacing:.2em;color:var(--dim)}
.cast.lg figure.gone i.por,.cast.lg figure.gone .noimg{filter:saturate(.35) brightness(.78)}
.cast.lg figure.gone figcaption i{color:#e08c74}
/* 传奇之陨：殁在这一段的传奇，一位一幅 */
.falls{margin:20px 0 0;display:grid;grid-template-columns:1fr;gap:18px}
.falls figure{margin:0}
.falls .cgb .cap b{color:#f0a48c}
.falls figcaption{all:unset;box-sizing:border-box;display:flex;align-items:baseline;justify-content:space-between;gap:12px;width:100%;margin:9px 0 0;cursor:pointer;font-size:12.5px;line-height:1.8;letter-spacing:.06em;color:rgba(236,229,214,.72)}
.falls figcaption em{flex:none;font-style:normal;font-size:11.5px;letter-spacing:.2em;color:var(--dim)}
.falls figcaption:hover em{color:rgb(var(--ember))}
.falls figcaption:focus-visible{outline:1px solid rgb(var(--ember));outline-offset:3px}
ul.meet{margin:18px 0 0;padding:0;list-style:none;display:grid;grid-template-columns:1fr;gap:0 34px}
ul.meet li{display:grid;grid-template-columns:54px 1fr;gap:2px 14px;align-content:start;padding:13px 0;border-bottom:1px solid var(--line)}
ul.meet li.np{grid-template-columns:1fr}
ul.meet i.por{grid-row:1/4;display:block;width:54px;height:81px;background-color:#12131a;background-repeat:no-repeat}
ul.meet b{font-size:15.5px;font-weight:600;letter-spacing:.08em}
ul.meet span{font-size:11.5px;letter-spacing:.18em;color:rgb(var(--ember))}
ul.meet p{margin:2px 0 0;font-size:12.5px;line-height:1.75;color:rgba(236,229,214,.72);display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
ul.meet.gods i.por{width:72px;height:108px}
ul.meet.gods li{grid-template-columns:72px 1fr}
ul.meet.gods li.np{grid-template-columns:1fr}
ul.meet.gods span.mo{color:#e08c74}

/* 开头是一整幅这个时代的原画，正文从画底下升上来 */
#pg-hd{display:none}
#page.cg #pg-wrap{display:block;overflow-y:auto}
#page.cg #pg-art{position:sticky;top:0;height:min(66vh,128vw);display:block;background:#04050a;cursor:zoom-in}
#page.cg #pg-art img{width:100%;height:100%;max-width:none;object-fit:cover;object-position:50% 50%;box-shadow:none;opacity:0;transition:opacity .9s;transform:scale(calc(1.02 + .06*var(--p,0)));filter:brightness(calc(1 - .62*var(--p,0)))}
#page.cg #pg-art img.in{opacity:1}
#page.cg #pg-art::after{display:block;pointer-events:none;background:radial-gradient(70% 62% at 8% 92%,rgba(4,5,10,.78) 0,rgba(4,5,10,.42) 45%,rgba(4,5,10,0) 78%),linear-gradient(180deg,rgba(4,5,10,.34) 0,rgba(4,5,10,0) 24%,rgba(4,5,10,0) 44%,rgba(5,6,11,.97) 100%)}
#page.cg #pg-hd{display:block;position:absolute;z-index:1;left:max(22px,env(safe-area-inset-left,0px));right:22px;bottom:22px;text-shadow:0 2px 16px rgba(0,0,0,.9),0 0 3px rgba(0,0,0,.6);pointer-events:none}
#page.cg #pg-body{position:relative;z-index:2;margin:0;max-width:none;height:auto;overflow:visible;background:#05060b;padding-top:2px}
@keyframes cgpan{0%{object-position:50% 50%}32%{object-position:10% 50%}82%{object-position:90% 50%}100%{object-position:50% 50%}}
@keyframes cgin{from{transform:scale(1.1)}to{transform:scale(1.02)}}
#pg-art .cue{display:none}
.ln ol.road{display:grid;grid-template-columns:1fr;gap:16px}
.ln ol.road li{padding:0}
.ln ol.road li::before,.ln ol.road li::after{display:none}
.ln ol.road li.txt{padding:2px 0 2px 22px}

<script>
/* 世界之书抽成了 共用/ 里的一份，四本书和牌桌共用（11-15 拼装那一轮）。单独打开这一本的时候，用的是这一本目录里的 common/（共用/sync.py 拷进来的）；
   装在牌桌那个外壳里的时候，外壳在页面最前头先给了 window.A（图和数据在图床的哪个地址）和 window.SHELL（跟外壳说话）。
   common/ 不在这一本自己那一段里，所以入口钮的图写成 data-a，在这里过一遍 A() 再给地址（照月银纪）。 */
window.A = window.A || ((p) => p);
for (const im of document.querySelectorAll('img[data-a]')) im.src = A(im.dataset.a);
document.write('<link rel="stylesheet" href="' + A('common/codex.css') + '"><script src="' + A('common/codex.js') + '"><\/script>');

<script>
'use strict';
/* 数据是几份跟页面放在一起的文件：二十一张牌的字（build_data.py 从七页源稿和二十二张里抽的），哪一幅原画配在哪一幕，人像拼图，牌立在长卷的哪里 */
Promise.all([
  fetch('data/strife.json').then((r) => r.json()),
  fetch('data/cg.json').then((r) => r.json()).catch(() => ({})),
  fetch('data/have.json').then((r) => r.json()).catch(() => ({})),
  fetch('data/pa.json').then((r) => r.json()).catch(() => ({})),
  fetch('data/road.json').then((r) => r.json()),
  fetch('data/roadc.json').then((r) => r.json()).catch(() => ({})),
  fetch('data/card.json').then((r) => r.json()).catch(() => ({})),
  // 11-15 介绍页收尾：短卡片（底稿/门面/卡片/纷争纪/，共用/prep_cards.py 出）。哪一张牌没有卡片，或者这一份没载下来，那一张就照旧用原来那一套。跟上一行的 card.json（牌图石框的尺寸）不是一回事
  fetch('data/cards.json').then((r) => r.json()).catch(() => ({})),
]).then(([D, CG, HV, PA, RD, RC, CD, CARDS]) => main(D, CG, HV, PA, RD, RC, CD, CARDS)).catch((e) => {
  console.error(e);
  const p = document.createElement('p');
  p.textContent = '这一页的数据没有载下来，刷新一下再试。';
  p.style.cssText = 'position:fixed;inset:0;z-index:9;display:flex;align-items:center;justify-content:center;margin:0;background:#05060b;color:#ece5d6;font-size:14px;letter-spacing:.2em';
  document.body.appendChild(p);
});

function main(D, CG, HV, PA, RD, RC, CD, CARDS) {
if (!CARDS || typeof CARDS !== 'object') CARDS = {};
if (!window.Codex) {          // 共用的那一份没载下来的时候，书照样能翻，只是没有世界之书和小地图
  console.error('common/codex.js 没有载下来，世界之书用不了');
  window.Codex = { init: () => Promise.resolve(null), open() {}, close() {}, isOpen: () => false, mini: () => '', miniClick: () => false, syncSpoil() {}, state: { open: false, vol: '', page: '', vols: [], maps: [] } };
  document.getElementById('wbBtn').hidden = true;
}
const ERAS = D.eras, N = ERAS.length, NC = N + 1, NP = 11;      // 二十一个时代，二十二张牌（末一张没有年岁），十一段长卷
const HAVE = new Set((HV && HV.ps) || []), HGOD = new Set((HV && HV.god) || []);
const SLOTS = RD.slots;
const FOOT = (CD && CD.foot) || 0.958;       // 石框的尖脚在牌图高的哪儿（prep_assets.py 把每张牌照石框归一过），牌照它落在空地上
const Q = new URLSearchParams(location.search);
const SIM = Q.has('sim'), SKIP = Q.has('skip') || SIM, GRID = Q.has('grid');
// 本地验的时候：?legacy 叫全书当作没有卡片（照旧用原来那一套），?legacy=s02,s05 只叫这几张没有。卡片二十一张都齐了以后，原来那一套靠这个走查
if (Q.has('legacy')) { const off = Q.get('legacy').split(',').filter(Boolean); if (off.length) for (const id of off) delete CARDS[id]; else CARDS = {}; }
const SHOW_MARGIN = true;          // 页边那一行放不放在牌角上
const ROADV = '_v2';               // 长卷的文件名后缀（11-13 接缝重画成一条连着的路以后换的，prep_assets.py 的 ROADV 跟着改）
if (Q.has('nocard')) document.getElementById('view').classList.add('nocard');
const $ = (s) => document.querySelector(s);
const view = $('#view'), fxc = $('#fx'), strip = $('#strip'), veil = $('#veil'), dawn = $('#dawn'), partEl = $('#part');
const ctx = fxc.getContext('2d');          // 只画粒子，没有图进画布（装在外壳里从图床载图也不用 crossOrigin）
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const smooth = (a, b, v) => { const t = clamp((v - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const pad = (n) => String(n).padStart(2, '0');
// 种族只显示括号前面那一截；写着“藏”的不显示，免得名单上一眼露底（11-15，照月银纪）。
// 这一本另有两样也不显示：雨城那两位写的是“族不点（雨城不问）”，短卡片上本来就不报族；茵妮那一格数据里写的是她原来是谁
const raceShow = (r) => /藏|不点|原是/.test(r || '') ? '' : String(r || '').replace(/（.*/, '');
const HOVER = window.matchMedia && matchMedia('(hover:hover) and (pointer:fine)').matches;
const yearsText = (e) => '纷争纪 ' + e.years + (/年$/.test(e.years) ? '' : ' 年');
const lineYear = (l, e) => (l.year === '元' ? '元年' : l.year ? l.year + ' 年' : e.years + (/年$/.test(e.years) ? '' : ' 年'));

/* ---------- 尺寸 ---------- */
let W = 0, H = 0, DPR = 1, wide = true, SH = 0, PWd = 0, OV = 0, STEP = 0, PRO = 0, ENDW = 0, TOTAL = 1, MAXCAM = 0, CW = 0, CH = 0;
const px = new Float64Array(NP), cx = new Float64Array(NC), ctop = new Float64Array(NC), cbot = new Float64Array(NC);
let cam = 0, camT = 0, dcam = 0, clock = 0, last = 0, started = false, pageOpen = -1, frames = 0;
const seen = new Uint8Array(NC);
let panels = [], cards = [], cimgs = [], labs = [], endsec = null;
const camFor = (i) => clamp(cx[i] - W / 2, 0, MAXCAM);

function layout() {
  const w = view.clientWidth, h = view.clientHeight;
  if (!w || !h) return false;
  const keepI = TOTAL > 1 ? focusIndex() : -1, keepOff = keepI >= 0 ? (cam + W / 2 - cx[keepI]) / PWd : 0;
  W = w; H = h; wide = W / H >= 1.15;
  DPR = Math.min(window.devicePixelRatio || 1, 1.5);
  SH = H; PWd = Math.round(SH * 1.5); OV = Math.round(PWd * 0.075); STEP = PWd - OV;
  PRO = wide ? Math.round(clamp(W * 0.34, 420, 700)) : Math.round(W * 0.94);
  ENDW = wide ? Math.round(clamp(W * 0.6, 520, 1200)) : Math.round(W * 1.05);
  for (let k = 0; k < NP; k++) px[k] = PRO + k * STEP;
  CH = Math.round(SH * (H < 500 ? 0.35 : 0.31)); CW = Math.round(CH * 2 / 3);          // 这是整张图的大小；石框本身高约八成二、宽不到一半，四周是留给溢出框的东西的空
  for (let i = 0; i < NC; i++) {
    const k = Math.min(NP - 1, i >> 1), s = SLOTS[i];
    cx[i] = px[k] + s[0] * PWd;
    ctop[i] = Math.max(s[1] * SH - CH * FOOT, SH * 0.022);   // 石框的尖脚落在那块空地当中；太靠上的往下让一点，别顶到屏幕边
    cbot[i] = ctop[i] + CH * (FOOT + 0.008);
  }
  TOTAL = px[NP - 1] + PWd + ENDW; MAXCAM = Math.max(0, TOTAL - W);
  fxc.width = Math.round(W * DPR); fxc.height = Math.round(H * DPR);
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  buildStrip();
  if (keepI >= 0) cam = camT = clamp(cx[keepI] + keepOff * PWd - W / 2, 0, MAXCAM);
  sync.f = -1; sync.d = -1; sync.l = null;
  return true;
}

/* ---------- 跟着路走的东西 ---------- */
function buildStrip() {
  strip.style.width = TOTAL + 'px';
  const endc = (RC.r11 && RC.r11.r) || [246, 234, 208];
  const fadeR = Math.round(PWd * 0.05);
  let h = `<div class="endbg" style="left:${px[NP - 1] + PWd - fadeR - 2}px;width:${ENDW + fadeR + 2}px;height:${SH}px;background:linear-gradient(90deg,rgb(${endc.join(',')}) 0,#f6eeda 55%,#fbf6ea 100%)"></div>`;
  for (let k = 0; k < NP; k++) {
    const l = k === 0 ? Math.round(PWd * 0.11) : OV;
    const m = k === NP - 1 ? `linear-gradient(to right,transparent 0,#000 ${l}px,#000 ${PWd - fadeR}px,transparent 100%)` : `linear-gradient(to right,transparent 0,#000 ${l}px)`;
    h += `<img class="pn" alt="" draggable="false" data-src="assets/road/r${pad(k + 1)}${ROADV}.webp" style="left:${px[k]}px;width:${PWd}px;height:${SH}px;-webkit-mask-image:${m};mask-image:${m}">`;
    if (GRID) h += `<div class="grid" style="left:${px[k]}px;width:${PWd}px;height:${SH}px"></div>`;
  }
  h += `<div class="sec pale" style="left:0;width:${PRO}px;top:0;height:${SH}px"><h2>天黑以后</h2><div class="tx"><p class="line">火畔仍有一只摇篮。</p><p class="sub">纷争纪　${esc(D.total)}</p><p class="desc">灯尽数坠落的那一夜，路从灰里起头。往前走，路边倒下的一程多过一程：熄了的炮，跪着的巨像，插进土里的剑。二十二张牌立在路弯上，一张牌，一个年代。</p><p class="how">沿路向右而行。走近的牌自己翻开，点开它，走进那个年代。</p></div></div>`;
  for (let i = 0; i < NC; i++) {
    const e = ERAS[i], tilt = (((i * 37) % 7) - 3) * 0.55;
    const lw = Math.max(CW + 110, 230);
    h += `<div class="card${seen[i] ? ' up' : ''}" data-i="${i}" style="left:${Math.round(cx[i] - CW / 2)}px;top:${Math.round(ctop[i])}px;width:${CW}px;height:${CH}px;--tilt:${tilt}deg"><span class="sh"></span><span class="flip"><span class="f back"></span><span class="f front"><img alt="" draggable="false" data-src="assets/card/c${pad(i + 1)}.webp"></span></span></div>`;
    h += `<div class="lab${seen[i] ? ' up' : ''}" data-i="${i}" style="left:${Math.round(cx[i] - lw / 2)}px;width:${lw}px;top:${Math.round(cbot[i] + (H < 500 ? 6 : 12))}px"><span>` + (e
      ? `<small>${esc(e.no)}　${esc(e.years)}${/年$/.test(e.years) ? '' : ' 年'}</small><b>${esc(e.title)}</b><i>${esc(e.pian)}</i>`
      : `<small>XXII</small><b>第二十二张</b><i>没有年岁，没有回目</i>`) + `</span></div>`;
    if (GRID) h += `<i class="dot" style="left:${cx[i]}px;top:${SLOTS[i][1] * SH}px"></i>`;
  }
  h += `<div class="sec end" id="endsec" style="left:${px[NP - 1] + PWd}px;width:${ENDW}px;top:0;height:${SH}px"><blockquote>天亮以前，人只有火。<br>天亮以后，诸神于坛前落座。<br>天黑以前，人将灯火擎上高天。<br>天黑以后，火畔仍有一只摇篮。</blockquote><p>纷争纪一万一千零三十四年，归寂月。<br>雨城的门洞里，火边多了一只篮子。</p><p class="sub">下一本 · 山铜纪</p></div>`;
  strip.innerHTML = h;
  panels = Array.from(strip.querySelectorAll('.pn'));
  cards = Array.from(strip.querySelectorAll('.card'));
  cimgs = cards.map((c) => c.querySelector('img'));
  labs = Array.from(strip.querySelectorAll('.lab'));
  endsec = $('#endsec');

}
function ensure() {          // 走到跟前才载图；离得远的卸掉，手机上内存紧
  const a = cam - PWd, b = cam + W + PWd, fa = cam - PWd * 3.2, fb = cam + W + PWd * 3.2;
  for (let k = 0; k < NP; k++) {
    const im = panels[k], has = im.hasAttribute('src');
    if (!has && px[k] + PWd > a && px[k] < b) im.src = im.dataset.src;
    else if (has && (px[k] + PWd < fa || px[k] > fb)) im.removeAttribute('src');
  }
  for (let i = 0; i < NC; i++) {
    const im = cimgs[i], has = im.hasAttribute('src');
    if (!has && cx[i] > a && cx[i] < b) im.src = im.dataset.src;
    else if (has && (cx[i] < fa || cx[i] > fb)) im.removeAttribute('src');
  }
}

/* 底下那一排刻度：七页一组，一张牌一格 */
const rail = $('#rail');
(function buildRail() {
  let h = '';
  D.parts.forEach((p, k) => {
    h += `<div class="grp" data-n="${esc(p.name)}">`;
    for (let i = p.a - 1; i < p.b; i++) h += `<button data-i="${i}" title="${esc(ERAS[i].label + ' ' + ERAS[i].title)}" aria-label="${esc(ERAS[i].label + ' ' + ERAS[i].title)}"></button>`;
    if (k === D.parts.length - 1) h += `<button data-i="${N}" title="第二十二张" aria-label="第二十二张"></button>`;
    h += '</div>';
  });
  rail.innerHTML = h;
})();
const ticks = Array.from(rail.querySelectorAll('button')), grps = Array.from(rail.querySelectorAll('.grp'));
rail.addEventListener('click', (e) => { const b = e.target.closest('button'); if (b) { go(+b.dataset.i); touched(); } });
for (const ev of ['pointerdown', 'pointerup', 'pointermove']) rail.addEventListener(ev, (e) => e.stopPropagation());

/* ---------- 一帧 ---------- */
function focusIndex() {
  const c = cam + W / 2;
  let best = 0, bd = 1e12;
  for (let i = 0; i < NC; i++) { const d = Math.abs(cx[i] - c); if (d < bd) { bd = d; best = i; } }
  return best;
}
function reveal(i) {
  if (seen[i]) return;
  seen[i] = 1; ticks[i].classList.add('seen');
  if (cards[i]) { cards[i].classList.add('up'); labs[i].classList.add('up'); }      // 还没排版的时候（外壳一上来就叫打开某一页）先记着，buildStrip 照 seen 翻
}
function step(dt) {
  clock += dt;
  camT = clamp(camT, 0, MAXCAM);
  const before = cam;
  cam += (camT - cam) * (1 - Math.exp(-dt / (drag.on ? 30 : 130)));
  if (Math.abs(camT - cam) < 0.05) cam = camT;
  dcam = cam - before;
  if (started) {          // 走近的牌自己翻开
    const l = cam + W * (wide ? 0.14 : 0.04), r = cam + W * (wide ? 0.86 : 0.96);
    for (let i = 0; i < NC; i++) if (!seen[i] && cx[i] > l && cx[i] < r) reveal(i);
  }
}
let partTimer = 0;
function banner(k) {
  const p = D.parts[k];
  partEl.querySelector('b').textContent = p.name; partEl.querySelector('span').textContent = p.sub;
  partEl.classList.add('on'); clearTimeout(partTimer);
  partTimer = setTimeout(() => partEl.classList.remove('on'), 2600);
}
function sync() {
  strip.style.transform = `translate3d(${-cam}px,0,0)`;
  const f = focusIndex();
  if (f !== sync.f) {
    if (sync.f >= 0 && cards[sync.f]) { cards[sync.f].classList.remove('on'); labs[sync.f].classList.remove('on'); ticks[sync.f].classList.remove('cur'); }
    cards[f].classList.add('on'); labs[f].classList.add('on'); ticks[f].classList.add('cur'); sync.f = f;
  }
  const part = f < N ? ERAS[f].part : D.parts.length - 1;
  if (part !== sync.p) {
    $('#where').textContent = D.parts[part].name;
    grps.forEach((g, k) => g.classList.toggle('cur', k === part));
    if (started && sync.p >= 0 && !SIM && !view.classList.contains('light') && cam + W / 2 < px[NP - 1] + PWd * 0.45) banner(part);
    sync.p = part;
  }
  const c = cam + W / 2, dk = smooth(px[NP - 1] + PWd * 0.5, px[NP - 1] + PWd * 1.02, c);        // 走到路的尽头，天亮起来
  if (Math.abs(dk - sync.d) > 0.004 || (dk === 0) !== (sync.d === 0) || (dk === 1) !== (sync.d === 1)) {
    dawn.style.opacity = dk.toFixed(3); veil.style.opacity = (1 - dk).toFixed(3); sync.d = dk;
    const li = dk > 0.62;
    if (li !== sync.l) { view.classList.toggle('light', li); sync.l = li; }
    if (endsec) endsec.classList.toggle('show', dk > 0.45);
  }
  ensure();
}
sync.f = -1; sync.p = -1; sync.d = -1; sync.l = null;

/* ---------- 路上飘的东西：先是悬着不落的灰，再是火星，止戈那一处什么都停了，末一段是雨，尽头是晨光里的尘 ---------- */
const parts = [];
function zone() {
  const pf = (cam + W / 2 - PRO) / STEP;
  return {
    ash: 1 - smooth(0.8, 1.7, pf),
    ember: smooth(1.0, 2.4, pf) * (1 - smooth(9.15, 9.5, pf)) * (0.3 + 0.7 * smooth(1.5, 8.5, pf)),
    rain: smooth(9.98, 10.12, pf) * (1 - smooth(10.4, 10.62, pf)),
    mote: smooth(10.5, 10.95, pf),
  };
}
function spawn(t) {
  const p = { t, x: Math.random() * W, y: Math.random() * H, life: 0, s: Math.random() };
  if (t === 'ash') { p.vx = -6 + Math.random() * 12; p.vy = 1 + Math.random() * 5; p.r = 0.8 + Math.random() * 1.8; p.max = 5000 + Math.random() * 6000; p.z = 0.4 + Math.random() * 0.6; }
  else if (t === 'ember') { p.y = H * (0.3 + Math.random() * 0.75); p.vx = 8 + Math.random() * 28; p.vy = -(14 + Math.random() * 46); p.r = 0.7 + Math.random() * 1.5; p.max = 2600 + Math.random() * 3200; p.z = 0.5 + Math.random() * 0.7; }
  else if (t === 'rain') { p.x = Math.random() * (W + 240); p.y = -30 - Math.random() * H * 0.4; p.vx = -150; p.vy = 880 + Math.random() * 380; p.r = 12 + Math.random() * 14; p.max = 1700; p.z = 1; }
  else { p.vx = 3 + Math.random() * 8; p.vy = -(4 + Math.random() * 12); p.r = 1 + Math.random() * 2; p.max = 5000 + Math.random() * 5000; p.z = 0.5 + Math.random() * 0.5; }
  return p;
}
function drawFX(dt) {
  ctx.clearRect(0, 0, W, H);
  if (!started) return;
  const z = zone(), n0 = wide ? 110 : 64;
  const want = { ash: z.ash * n0 * 0.8, ember: z.ember * n0, rain: z.rain * n0 * 1.3, mote: z.mote * n0 * 0.5 };
  const cnt = { ash: 0, ember: 0, rain: 0, mote: 0 };
  for (const p of parts) cnt[p.t]++;
  for (const t in want) { let n = Math.min(5, Math.ceil(want[t] - cnt[t])); while (n-- > 0) parts.push(spawn(t)); }
  const s = dt / 1000;
  for (let i = parts.length - 1; i >= 0; i--) {
    const p = parts[i];
    p.life += dt; p.x += p.vx * s - dcam * p.z; p.y += p.vy * s;
    const k = p.life / p.max;
    if (k >= 1 || p.y > H + 40 || p.y < -80 || z[p.t] < 0.01) { parts.splice(i, 1); continue; }
    if (p.t !== 'rain') {
      p.x += Math.sin(clock * 0.0013 + p.s * 40) * 7 * s;
      if (p.x < -20) p.x += W + 40; else if (p.x > W + 20) p.x -= W + 40;

  const i = ERAS.findIndex((x) => x.id === id); if (i < 0) return;

const atBtn = $('#atBtn');

  const w = $('#wbBtn'), r = w ? w.getBoundingClientRect() : null, v = view.getBoundingClientRect();

}

  }).then((a) => { if (a.missing) atBtn.hidden = true; });
  atBtn.addEventListener('click', () => { if (typeof touched === 'function') touched(); Atlas.open(); });
  window.addEventListener('resize', atPos); atPos(); setTimeout(atPos, 600);
} else atBtn.hidden = true;
