<title>迷宫纪的井</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600;900&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#05060c; --pale:#e9e8f2; --dim:rgba(226,226,240,.6); --line:rgba(226,226,240,.18);
  --ember:236,178,98; --cool:150,158,214;
  --serif:'Noto Serif SC','Songti SC','STSong','SimSun',serif;
  color-scheme:dark;
}
html,body{margin:0;height:100%;background:var(--ink);overflow:hidden}
body{color:var(--pale);font-family:var(--serif);-webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%}
#view{position:fixed;inset:0;overflow:hidden;background:#090b18;user-select:none;-webkit-user-select:none;touch-action:none}
#gl,#fx{position:absolute;left:0;top:0;width:100%;height:100%;display:block}
#fx{pointer-events:none}
#tags{position:absolute;inset:0;overflow:hidden;pointer-events:none;z-index:0}
/* 挂在绳结上的委托单 */
.tg{position:absolute;left:0;top:0;width:44px;height:58px;transform-origin:50% 0;pointer-events:auto;cursor:pointer;display:none;will-change:transform,opacity}
.tg i{position:absolute;left:50%;top:0;width:1px;height:12px;background:rgba(214,190,150,.8)}
.tg b{position:absolute;left:0;right:0;top:11px;bottom:0;background:linear-gradient(170deg,#ebe4d0,#d2c6a8);border-top:5px solid var(--edge,#b9ad8f);box-shadow:0 6px 14px rgba(0,0,0,.55);transform:rotate(var(--rot,0deg));transform-origin:50% 0}
.tg b::before{content:'';position:absolute;left:18%;right:18%;top:24%;height:2px;background:rgba(60,48,30,.38);box-shadow:0 6px 0 rgba(60,48,30,.28),0 12px 0 rgba(60,48,30,.24),0 18px 0 rgba(60,48,30,.2)}
.tg.e-red{--edge:#b0452f}.tg.e-blue{--edge:#30608f}.tg.e-white{--edge:#f7f4ec}.tg.e-none{--edge:#b9ad8f}
@media (hover:hover) and (pointer:fine){.tg:hover b{filter:brightness(1.12)}}
#veil{position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse at 50% 50%,rgba(4,5,12,0) 58%,rgba(4,5,12,.5) 100%),linear-gradient(180deg,rgba(4,5,12,.42) 0,rgba(4,5,12,0) 14%,rgba(4,5,12,0) 80%,rgba(4,5,12,.5) 100%)}
#top{position:absolute;left:max(18px,env(safe-area-inset-left));top:max(14px,env(safe-area-inset-top));display:flex;align-items:baseline;gap:14px;pointer-events:none;text-shadow:0 1px 10px rgba(0,0,0,.85)}
#top b{font-weight:900;font-size:19px;letter-spacing:.3em}
#top span{font-size:12.5px;letter-spacing:.24em;color:var(--dim)}
#part{position:absolute;left:0;right:0;top:max(54px,7vh);text-align:center;pointer-events:none;opacity:0;transform:translateY(-6px);transition:opacity .5s,transform .5s;text-shadow:0 2px 18px rgba(0,0,0,.95),0 0 4px rgba(0,0,0,.6)}
#part.on{opacity:1;transform:none}
#part small{display:block;font-size:12px;letter-spacing:.32em;text-indent:.32em;color:rgb(var(--ember))}
#part b{display:block;margin-top:6px;font-weight:900;font-size:clamp(22px,3.6vh,36px);letter-spacing:.38em;text-indent:.38em}
#part span{display:block;margin-top:6px;font-size:12.5px;letter-spacing:.3em;text-indent:.3em;color:rgba(226,226,240,.8)}
/* 这一幅壁画的题签：点一下看大图 */
#cap{position:absolute;left:50%;bottom:calc(max(16px,env(safe-area-inset-bottom)) + 30px);transform:translateX(-50%);text-align:center;cursor:pointer;opacity:0;transition:opacity .35s;max-width:min(560px,86vw);text-shadow:0 2px 14px rgba(0,0,0,.95),0 0 3px rgba(0,0,0,.7)}
#cap.on{opacity:1}
#cap small{display:block;font-size:12px;letter-spacing:.24em;text-indent:.24em;color:rgb(var(--ember))}
#cap b{display:block;margin-top:5px;font-weight:900;font-size:clamp(20px,3.2vh,30px);letter-spacing:.3em;text-indent:.3em}
#cap span{display:block;margin-top:5px;font-size:12.5px;letter-spacing:.2em;text-indent:.2em;color:rgba(226,226,240,.78)}
#cap em{display:inline-block;margin-top:9px;font-style:normal;font-size:11.5px;letter-spacing:.3em;text-indent:.3em;padding:5px 12px;border:1px solid var(--line);background:rgba(5,6,12,.45);color:rgba(226,226,240,.82)}
#hint{position:absolute;left:0;right:0;bottom:calc(max(16px,env(safe-area-inset-bottom)) + 4px);margin:0;text-align:center;font-size:12px;letter-spacing:.22em;color:rgba(226,226,240,.62);pointer-events:none;transition:opacity 1.2s;text-shadow:0 1px 8px rgba(0,0,0,.95)}
#hint.off{opacity:0}
/* 公会的深度板：一圈一行，点一行下到那一圈，点“进”翻开那一段 */
#board{position:absolute;right:max(14px,env(safe-area-inset-right));top:50%;transform:translateY(-50%);width:208px;padding:14px 0 10px;background:linear-gradient(180deg,rgba(18,20,38,.86),rgba(10,11,22,.86));border:1px solid rgba(226,226,240,.16);box-shadow:0 18px 50px rgba(0,0,0,.5),inset 0 0 0 4px rgba(0,0,0,.25);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px)}
#board h2{margin:0 0 8px;text-align:center;font-size:12px;font-weight:600;letter-spacing:.5em;text-indent:.5em;color:var(--dim)}
#board ol{margin:0;padding:0;list-style:none;counter-reset:d}
#board li{position:relative;display:grid;grid-template-columns:1fr auto;align-items:center;gap:0 8px;padding:7px 12px 7px 16px;cursor:pointer;border-top:1px solid rgba(226,226,240,.07)}
#board li::before{content:'';position:absolute;left:6px;top:50%;width:4px;height:4px;margin-top:-2px;transform:rotate(45deg);background:rgba(226,226,240,.3)}
#board li.cur{background:rgba(var(--ember),.1)}
#board li.cur::before{background:rgb(var(--ember));box-shadow:0 0 8px rgb(var(--ember))}
#board li b{font-size:13.5px;font-weight:600;letter-spacing:.14em;white-space:nowrap}
#board li span{grid-column:1;font-size:10.5px;letter-spacing:.14em;color:var(--dim)}
#board li button{all:unset;grid-row:1/3;grid-column:2;cursor:pointer;font-size:11px;letter-spacing:.2em;text-indent:.2em;padding:5px 8px;border:1px solid var(--line);color:rgba(226,226,240,.8)}
#board li button:hover{background:var(--pale);color:var(--ink)}
#board li:focus-visible,#board li button:focus-visible{outline:1px solid rgb(var(--ember));outline-offset:-2px}
#board .tip{margin:8px 12px 0;font-size:10.5px;line-height:1.7;letter-spacing:.08em;color:rgba(226,226,240,.42)}
@media (max-aspect-ratio: 1/1),(max-width:760px){
  #board{top:auto;bottom:calc(max(16px,env(safe-area-inset-bottom)) + 4px);transform:none;right:max(10px,env(safe-area-inset-right));width:auto;padding:6px 0;background:rgba(10,11,22,.7)}
  #board h2,#board .tip,#board li span,#board li button{display:none}
  #board li{grid-template-columns:auto;padding:5px 10px 5px 14px;border:0}
  #board li b{font-size:11px;letter-spacing:.08em;color:rgba(226,226,240,.55)}
  #board li.cur b{color:var(--pale)}
  #cap{bottom:calc(max(16px,env(safe-area-inset-bottom)) + 36px);left:12px;right:110px;transform:none;max-width:none;text-align:left}
  #cap small,#cap b,#cap span,#cap em{text-indent:0}
  #hint{text-align:left;left:14px;right:110px}
}
/* 进来的那一下 */
#intro{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;background:var(--ink);transition:opacity 1.6s;cursor:pointer;z-index:4}
#intro.off{opacity:0;pointer-events:none}
#intro small{font-size:13px;letter-spacing:.5em;color:var(--dim);margin-right:-.5em}
#intro h1{margin:0;font-weight:900;font-size:clamp(46px,9vh,88px);letter-spacing:.42em;margin-right:-.42em}
#intro p{margin:0;font-size:15px;letter-spacing:.34em;color:var(--dim);margin-right:-.34em}
#intro *{opacity:0;animation:rise 1.4s forwards}
#intro h1{animation-delay:.25s}#intro p{animation-delay:.7s}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
/* 井底 */
#endtx{position:absolute;left:0;right:0;top:40%;text-align:center;pointer-events:none;opacity:0;transition:opacity 1.4s;text-shadow:0 2px 20px rgba(0,0,0,.9)}
#endtx.on{opacity:1}
#endtx small{display:block;font-size:12.5px;letter-spacing:.4em;text-indent:.4em;color:rgba(255,214,150,.8)}
#endtx b{display:block;margin-top:14px;font-weight:600;font-size:clamp(16px,min(2.8vh,5vw),26px);letter-spacing:.3em;text-indent:.3em;color:#fbe9cc}
/* 点开一张委托单 */
#cv{position:absolute;inset:0;z-index:7;display:flex;align-items:center;justify-content:center;background:rgba(3,4,10,.74);opacity:0;transition:opacity .3s;padding:max(18px,env(safe-area-inset-top)) 16px max(18px,env(safe-area-inset-bottom));box-sizing:border-box;overflow-y:auto}
#cv.on{opacity:1}
#cv[hidden]{display:none}
#cv .wrap{width:min(560px,100%);margin:auto}
#cv .btns{display:flex;gap:10px;margin-top:16px;justify-content:center;flex-wrap:wrap}
#cv .btns button,#mv .btns button{all:unset;cursor:pointer;padding:10px 18px;border:1px solid var(--line);font-size:13px;letter-spacing:.32em;text-indent:.32em;background:rgba(5,6,12,.55)}
#cv .btns button.go,#mv .btns button.go{background:var(--pale);color:var(--ink);font-weight:600;border-color:var(--pale)}
#cv .btns button:focus-visible,#mv .btns button:focus-visible{outline:1px solid rgb(var(--ember));outline-offset:2px}
/* 委托单的样子：一张纸，顶上一道边色 */
.comm{position:relative;box-sizing:border-box;background:linear-gradient(172deg,#ece5d1 0,#ddd2b6 70%,#cfc2a2 100%);color:#2b2519;padding:18px 18px 14px;border-top:7px solid var(--edge,#b9ad8f);box-shadow:0 12px 34px rgba(0,0,0,.5),inset 0 0 0 1px rgba(80,62,30,.12)}
.comm.e-red{--edge:#a8402e}.comm.e-blue{--edge:#2f5b8a}.comm.e-white{--edge:#f7f4ec;border-top-color:#f7f4ec;box-shadow:0 12px 34px rgba(0,0,0,.5),inset 0 7px 0 -6px rgba(0,0,0,.08)}
.comm .no{display:flex;justify-content:space-between;gap:12px;font-size:11.5px;letter-spacing:.14em;color:#6d5f43}
.comm .no em{font-style:normal;white-space:nowrap}
.comm h3{margin:8px 0 0;font-size:19px;font-weight:900;letter-spacing:.1em;line-height:1.5;color:#211b12}
.comm .gr{margin:4px 0 0;font-size:12px;letter-spacing:.12em;color:#7a3a24}
.comm .front{margin:12px 0 0;padding:10px 0 32px;border-top:1px dashed rgba(80,62,30,.3)}
.comm .front p{margin:0 0 6px;font-size:14.5px;line-height:1.9;letter-spacing:.03em}
.comm .seal{position:absolute;right:14px;bottom:12px;width:38px;height:38px;border-radius:50%;border:2px solid rgba(150,54,36,.5);opacity:.5;transform:rotate(-12deg)}
/* 点开一幅壁画 */
#mv{position:absolute;inset:0;z-index:6;background:#03040a;opacity:0;transition:opacity .3s;display:flex;flex-direction:column}
#mv.on{opacity:1}
#mv[hidden]{display:none}
#mv .pic{position:relative;flex:1 1 auto;min-height:0;display:flex;align-items:center;justify-content:center;padding:max(14px,env(safe-area-inset-top)) 14px 0}
#mv .pic img{display:block;max-width:100%;max-height:100%;box-shadow:0 30px 80px rgba(0,0,0,.7);clip-path:inset(0 round 48% 48% 0 0/16% 16% 0 0)}
#mv .txt{flex:none;padding:16px 20px max(18px,env(safe-area-inset-bottom));text-align:center}
#mv .txt small{display:block;font-size:12px;letter-spacing:.28em;text-indent:.28em;color:rgb(var(--ember))}
#mv .txt b{display:block;margin-top:6px;font-weight:900;font-size:clamp(22px,3.6vh,32px);letter-spacing:.3em;text-indent:.3em}
#mv .txt span{display:block;margin-top:6px;font-size:13px;letter-spacing:.14em;color:rgba(226,226,240,.8)}
#mv .txt p{margin:8px auto 0;max-width:640px;font-size:13.5px;line-height:1.95;letter-spacing:.04em;color:rgba(226,226,240,.74)}
#mv .btns{display:flex;gap:10px;margin-top:14px;justify-content:center;flex-wrap:wrap}
#mv .nav{all:unset;position:absolute;top:45%;transform:translateY(-50%);cursor:pointer;width:44px;height:64px;display:flex;align-items:center;justify-content:center;font-size:22px;color:rgba(226,226,240,.7);background:rgba(5,6,12,.38)}
#mv .nav.l{left:0}#mv .nav.r{right:0}
#mv .nav[disabled]{opacity:.18;cursor:default}
/* 没有 WebGL 的时候：一圈一段往下排 */
#list{position:absolute;inset:0;overflow-y:auto;padding:70px 20px 120px;box-sizing:border-box;display:none}
#list.on{display:block}
#list h2{margin:40px 0 6px;font-size:13px;letter-spacing:.4em;color:rgb(var(--ember))}
#list h3{margin:0 0 12px;font-size:22px;font-weight:900;letter-spacing:.2em}
#list .row{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px}
#list button{all:unset;cursor:pointer;display:block}
#list img{display:block;width:100%;aspect-ratio:3/2;object-fit:cover;background:#111428}
#list button span{display:block;margin-top:6px;font-size:13px;letter-spacing:.14em}
#list button.end{display:inline-block;margin:4px 0 0;padding:10px 20px;border:1px solid var(--line);font-size:13px;letter-spacing:.4em;text-indent:.4em}
#list button.end:hover,#list button.end:focus-visible{background:var(--pale);color:var(--ink)}

/* 时代页（照山铜纪那一本） */
#page{position:absolute;inset:0;z-index:5;background:radial-gradient(120% 90% at 30% 40%,#0e1020 0,#05060c 70%);opacity:0;transform:translateY(18px);transition:opacity .4s,transform .4s;overflow:hidden}
#page.on{opacity:1;transform:none}
#page[hidden]{display:none}
#pg-wrap{position:absolute;inset:0;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;touch-action:pan-y}
#pg-art{position:relative;height:56vh;overflow:hidden;background:var(--phbg,linear-gradient(170deg,#262a44,#0b0c16))}
#pg-art img{width:100%;height:100%;object-fit:cover;object-position:50% 40%;display:block}
#pg-art img:not([src]){display:none}
#pg-art::after{content:'';position:absolute;inset:0;background:linear-gradient(180deg,rgba(4,5,12,.25) 0,rgba(4,5,12,0) 30%,rgba(4,5,12,0) 55%,rgba(4,5,12,.96) 100%)}
#pg-body{position:relative;margin-top:-64px;padding-block:0 120px;padding-left:max(22px,env(safe-area-inset-left,0px));padding-right:max(22px,env(safe-area-inset-right,0px));max-width:760px;box-sizing:border-box}
#pg-close{all:unset;position:absolute;right:max(14px,env(safe-area-inset-right));top:max(12px,env(safe-area-inset-top));z-index:3;cursor:pointer;font-size:12.5px;letter-spacing:.22em;padding:9px 14px;border:1px solid var(--line);background:rgba(5,6,12,.6);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
#pg-close:focus-visible{outline:1px solid var(--pale)}
.eyebrow{margin:0;font-size:12.5px;letter-spacing:.26em;color:rgb(var(--ember))}
#pg-body h1,#pg-hd h1{margin:12px 0 0;font-weight:900;font-size:clamp(30px,5.2vh,46px);letter-spacing:.14em;line-height:1.3}
#pg-body .ti,#pg-hd .ti{margin:14px 0 0;font-size:18px;font-weight:600;letter-spacing:.12em;line-height:1.7}
#pg-body .desc,#pg-hd .desc{margin:12px 0 0;font-size:15.5px;line-height:2.05;letter-spacing:.05em;color:rgba(226,226,240,.86)}
#pg-body h2{margin:54px 0 0;padding-bottom:12px;border-bottom:1px solid var(--line);font-size:13px;font-weight:600;letter-spacing:.5em;color:var(--dim)}
.def{margin:12px 0 0;font-size:13px;line-height:1.95;letter-spacing:.06em;color:var(--dim)}
.crow{margin:22px 0 0;display:grid;grid-template-columns:1fr;gap:20px}
.crow .comm{cursor:default}
details.ln{margin:18px 0 0;border:1px solid var(--line);background:rgba(226,226,240,.035)}
details.ln>summary{list-style:none;cursor:pointer;padding:18px 20px;display:grid;grid-template-columns:auto 1fr;gap:4px 18px;align-items:baseline}
details.ln>summary::-webkit-details-marker{display:none}
details.ln>summary .yr{grid-row:1/3;font-size:13px;letter-spacing:.14em;color:rgb(var(--ember));white-space:nowrap;align-self:start;padding-top:5px}
details.ln>summary .tt{font-size:19px;font-weight:600;letter-spacing:.1em;line-height:1.55}
details.ln>summary .nm{font-size:12px;letter-spacing:.2em;color:var(--dim)}
details.ln[open]>summary{border-bottom:1px solid var(--line)}
.ln .in{padding:18px 20px 22px}
.ln .chp{margin:0 0 10px;font-size:12px;letter-spacing:.24em;color:rgb(var(--ember))}
.ln .hook{margin:0 0 6px;font-size:16px;font-weight:600;line-height:1.9;letter-spacing:.06em;color:#f2ecdc}
.ln .intro{margin:2px 0 10px;font-size:15.5px;line-height:2;letter-spacing:.05em;color:#f6e9d2}
.ln ol li .dt{display:inline-block;margin-left:.2em;font-size:11.5px;letter-spacing:.06em;color:var(--dim)}
.ln ol li .ds{display:block;margin-top:2px}
.ln ol.road li.cgi p .dt{display:block;margin:4px 0 0}
.ln h4{margin:22px 0 8px;font-size:12px;font-weight:600;letter-spacing:.34em;color:var(--dim)}
.ln p.open{margin:0;font-size:15px;line-height:2;letter-spacing:.04em;color:rgba(226,226,240,.88)}
.ln ol{margin:0;padding:0;list-style:none}
.ln ol li{position:relative;padding:0 0 12px 22px;font-size:14.5px;line-height:1.85;letter-spacing:.04em;color:rgba(226,226,240,.8)}
.ln ol li::before{content:'';position:absolute;left:3px;top:.72em;width:7px;height:7px;transform:rotate(45deg);background:rgba(var(--ember),.8)}
.ln ol li::after{content:'';position:absolute;left:6px;top:1.5em;bottom:-.3em;width:1px;background:var(--line)}
.ln ol li:last-child::after{display:none}
.ln ol li b{font-weight:600;color:var(--pale);margin-right:.8em;letter-spacing:.1em}
.ln .cgb{margin:0 0 14px}
/* 11-25 节点原画：这一段的路里一幕一幅（data/cg.json），样子照山铜纪那一本 */
.ln ol.road{display:grid;grid-template-columns:1fr;gap:16px}
.ln ol.road li{padding:0}
.ln ol.road li::before,.ln ol.road li::after{display:none}
.ln ol.road li.txt{padding:2px 0 2px 22px}
.ln ol.road li.txt::before{display:block}
.ln ol.road .cgb{margin:0}
.ln ol.road li.cgi p{margin:9px 0 0;font-size:13px;line-height:1.8;letter-spacing:.04em;color:rgba(226,226,240,.72)}
details.end{margin:20px 0 0;border-top:1px dashed var(--line);padding-top:14px}
details.end>summary{cursor:pointer;font-size:13px;letter-spacing:.24em;color:var(--dim);list-style:none}
details.end>summary::-webkit-details-marker{display:none}
details.end>summary::after{content:'　揭开';color:rgb(var(--ember))}
details.end[open]>summary::after{content:'　合上'}
details.end p{margin:12px 0 0;font-size:14.5px;line-height:2;letter-spacing:.04em;color:rgba(226,226,240,.78)}
.go{all:unset;box-sizing:border-box;display:block;margin:24px 0 0;padding:13px 0;width:100%;text-align:center;cursor:pointer;font-size:14px;font-weight:600;letter-spacing:.5em;text-indent:.5em;color:var(--ink);background:var(--pale)}
.go:hover{background:#fff}
.go:focus-visible{outline:2px solid rgb(var(--ember));outline-offset:2px}
.cast{margin:20px -22px 0;padding:0 22px 8px;display:flex;gap:14px;overflow-x:auto;scroll-snap-type:x proximity;scroll-padding:0 22px;-webkit-overflow-scrolling:touch;touch-action:pan-x pan-y}
.cast figure{margin:0;flex:none;width:156px;scroll-snap-align:start}
.cast i.por{display:block;width:156px;height:234px;background-color:#12141f;background-repeat:no-repeat}
.cast .noimg{width:156px;height:234px;background:linear-gradient(160deg,#171a28,#0b0c14);display:flex;align-items:center;justify-content:center;font-size:38px;font-weight:900;color:rgba(226,226,240,.16)}
.cast figcaption b{display:block;margin-top:10px;font-size:15.5px;font-weight:600;letter-spacing:.1em}
.cast figcaption span{display:block;margin-top:3px;font-size:11.5px;letter-spacing:.18em;color:rgb(var(--ember))}
.cast figcaption p{margin:6px 0 0;font-size:12.5px;line-height:1.75;color:rgba(226,226,240,.72)}
.cast.lg figure{width:112px}
.cast.lg i.por,.cast.lg .noimg{width:112px;height:168px}
.cast.lg .noimg{font-size:28px}
.cast.lg figcaption b{font-size:14.5px}
.cast.lg figcaption i{display:block;margin-top:3px;font-style:normal;font-size:11px;letter-spacing:.2em;color:var(--dim)}
.cast.lg figure.gone i.por,.cast.lg figure.gone .noimg{filter:saturate(.35) brightness(.78)}
.cast.lg figure.gone figcaption i{color:#e08c74}
ul.meet{margin:18px 0 0;padding:0;list-style:none;display:grid;grid-template-columns:1fr;gap:0 34px}

#sheet{position:absolute;inset:0;display:flex;align-items:flex-end;justify-content:center;background:rgba(0,0,0,.55);z-index:8}
#sheet[hidden]{display:none}
#sheet .box{width:min(560px,100%);box-sizing:border-box;padding:26px 26px calc(26px + env(safe-area-inset-bottom));background:#0d0e18;border-top:1px solid var(--line)}

#page.cg #pg-art::after{display:block;pointer-events:none;background:radial-gradient(70% 62% at 8% 92%,rgba(4,5,12,.78) 0,rgba(4,5,12,.42) 45%,rgba(4,5,12,0) 78%),linear-gradient(180deg,rgba(4,5,12,.34) 0,rgba(4,5,12,0) 24%,rgba(4,5,12,0) 44%,rgba(5,6,12,.97) 100%)}

.cgb{all:unset;box-sizing:border-box;display:block;position:relative;width:100%;aspect-ratio:3/2;overflow:hidden;cursor:zoom-in;background:#0b0c16}
.cgb img{display:block;width:100%;height:100%;object-fit:cover;transition:transform .9s}
.cgb:hover img{transform:scale(1.035)}
.cgb::after{content:'';position:absolute;inset:0;background:linear-gradient(180deg,rgba(4,5,12,0) 50%,rgba(4,5,12,.88) 100%);pointer-events:none}
.cgb .cap{position:absolute;left:16px;right:16px;bottom:13px;z-index:1;display:flex;align-items:baseline;gap:6px 14px;flex-wrap:wrap;text-shadow:0 1px 10px rgba(0,0,0,.9)}

.cgb .cap i{font-style:normal;font-size:19px;font-weight:600;letter-spacing:.22em;color:#f2ecdc}
#cgv{position:absolute;inset:0;z-index:6;background:#020307;opacity:0;transition:opacity .3s;cursor:zoom-out}

#cgv[hidden]{display:none}

#cgv .cell img{position:absolute;top:0;left:calc(var(--i,0) * -100%);width:calc(var(--n,1) * 100%);height:100%;max-width:none;max-height:none;margin:0}
#cgv .cap{position:absolute;left:max(18px,env(safe-area-inset-left,0px));right:18px;bottom:max(18px,env(safe-area-inset-bottom,0px));pointer-events:none;text-shadow:0 2px 14px #000,0 0 3px #000}

#cgv .cap span{display:block;margin-top:5px;font-size:12.5px;letter-spacing:.06em;color:rgba(226,226,240,.78)}
#cgv .x,#mv .x,#cv .x{all:unset;position:absolute;right:max(14px,env(safe-area-inset-right,0px));top:max(12px,env(safe-area-inset-top,0px));z-index:2;cursor:pointer;font-size:12.5px;letter-spacing:.22em;padding:9px 14px;border:1px solid var(--line);background:rgba(5,6,12,.6)}

#cgv .nav.l{left:0}#cgv .nav.r{right:0}

/* 档案页 */
.cast figure.has,ul.meet li.has{cursor:pointer}

#prof{position:absolute;inset:0;z-index:5;background:radial-gradient(120% 90% at 26% 36%,#121428 0,#05060c 72%);opacity:0;transition:opacity .3s}

#prof .pf-spr{flex:none;height:95%;aspect-ratio:2/3;background-repeat:no-repeat;background-size:400% 126.667%;background-position:0 0;filter:drop-shadow(0 16px 26px rgba(0,0,0,.6))}

.pf-tag{margin:6px 0 0;font-size:13.5px;letter-spacing:.2em;color:rgb(var(--ember))}
.pf-meta{margin:14px 0 0;display:flex;flex-wrap:wrap;gap:7px 8px}
.pf-meta span{font-size:12px;letter-spacing:.12em;padding:4px 10px;border:1px solid var(--line);color:rgba(226,226,240,.84)}
.pf-bond{margin:12px 0 0;font-size:12.5px;letter-spacing:.16em;color:var(--dim)}
.pf-dead{all:unset;box-sizing:border-box;display:block;width:100%;margin:18px 0 0;padding:11px 14px;cursor:pointer;border:1px solid rgba(255,96,64,.36);background:rgba(255,80,40,.07);font-size:13px;line-height:1.7;letter-spacing:.08em;color:#f0b9a6}
.pf-dead b{font-weight:600;color:#f2ecdc;margin-right:1em;letter-spacing:.2em}
.pf-trait{margin:22px 0 0;padding:4px 0 4px 18px;border-left:2px solid rgba(var(--ember),.55);font-size:15.5px;line-height:2.05;letter-spacing:.05em;color:#f2ecdc}
.pf-body h3{margin:40px 0 0;padding-bottom:10px;border-bottom:1px solid var(--line);font-size:12.5px;font-weight:600;letter-spacing:.46em;color:var(--dim)}
.pf-body h3+p,.pf-body p.t{margin:12px 0 0;font-size:15px;line-height:2;letter-spacing:.04em;color:rgba(226,226,240,.88)}
.pf-stars{margin:4px 0 0;padding:0;list-style:none}
.pf-stars li{padding:12px 0;border-bottom:1px solid var(--line)}
.pf-stars b{font-size:15.5px;font-weight:600;letter-spacing:.1em}
.pf-stars small{margin-left:10px;font-size:11px;letter-spacing:.2em;color:rgb(var(--ember))}
.pf-stars p{margin:4px 0 0;font-size:13.5px;line-height:1.85;color:rgba(226,226,240,.76)}
.pf-quotes p{margin:10px 0 0;font-size:15.5px;font-weight:600;line-height:1.9;letter-spacing:.06em;color:#f2ecdc}
.pf-faces{margin:16px 0 0;display:grid;grid-template-columns:repeat(3,1fr);gap:10px;max-width:400px}
.pf-faces figure{margin:0}
.pf-faces i{display:block;aspect-ratio:1/1;background-repeat:no-repeat;background-size:1000% 475%;background-color:rgba(226,226,240,.045);border:1px solid var(--line)}
.pf-faces figcaption{margin-top:5px;text-align:center;font-size:11.5px;letter-spacing:.2em;text-indent:.2em;color:var(--dim)}
.pf-fear{margin:12px 0 0;font-size:13.5px;line-height:1.9;color:rgba(226,226,240,.72)}
.pf-fear b{font-weight:600;letter-spacing:.2em;color:var(--dim);margin-right:1em}
.pf-fate{box-sizing:border-box;margin:16px 0 0;border:1px solid rgba(255,96,64,.3);background:rgba(255,80,40,.05);padding:16px 18px}

.pf-fate dt{color:#f08a6c;letter-spacing:.24em;font-size:12px;padding-top:3px;white-space:nowrap}
.pf-fate dd{margin:0;color:rgba(226,226,240,.92);letter-spacing:.04em}
#prof .x{all:unset;position:absolute;right:max(14px,env(safe-area-inset-right,0px));top:max(12px,env(safe-area-inset-top,0px));z-index:2;cursor:pointer;font-size:12.5px;letter-spacing:.22em;padding:9px 14px;border:1px solid var(--line);background:rgba(5,6,12,.6)}

  .ln ol.road{grid-template-columns:1fr 1fr;gap:20px 18px}

/* ---------- 剧透开关（11-15，介绍页收尾）：关着的时候主线怎么收场、旅伴和相遇往后怎样都看不到 ---------- */
#view:not(.spoil-on) .spoil{display:none!important}
#view.spoil-on .nospoil{display:none!important}
.pf-stars .pf-alias{display:block;margin:2px 0 0;font-size:11.5px;font-style:normal;letter-spacing:.15em;opacity:.62}
.pf-stars .pf-grow{font-size:12.5px;opacity:.75}
.spl{all:unset;box-sizing:border-box;cursor:pointer;display:inline-flex;align-items:center;gap:10px;margin:26px 0 0;padding:7px 12px 7px 10px;border:1px solid var(--line);font-size:12.5px;letter-spacing:.2em;color:var(--dim)}
.spl i{flex:none;width:30px;height:16px;border-radius:9px;background:rgba(226,226,240,.18);position:relative;transition:background .25s}
.spl i::after{content:'';position:absolute;left:2px;top:2px;width:12px;height:12px;border-radius:50%;background:var(--pale);transition:transform .25s}
.spl em{font-style:normal}
.spl .on{display:none}
#view.spoil-on .spl i{background:rgba(var(--ember),.75)}
#view.spoil-on .spl i::after{transform:translateX(14px)}
#view.spoil-on .spl .on{display:inline}
#view.spoil-on .spl .off{display:none}
.spl:focus-visible{outline:1px solid rgb(var(--ember));outline-offset:2px}

/* 档案收短以后的样子（照底卡介绍页的旅伴卡） */
.pf-traits{margin:10px 0 0;font-size:13px;letter-spacing:.2em;color:rgb(var(--ember))}

/* ---------- 世界之书（11-15）：右上角的入口，摊开一本书，通用一卷，各纪一卷（书本身在 common/codex.js） ---------- */
#wbBtn{all:unset;position:absolute;right:max(14px,env(safe-area-inset-right));top:max(8px,env(safe-area-inset-top));z-index:3;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:1px;text-shadow:0 1px 8px rgba(0,0,0,.95)}
#wbBtn img{width:60px;height:60px;object-fit:contain;filter:drop-shadow(0 6px 14px rgba(0,0,0,.65));transition:transform .35s}
#wbBtn:hover img{transform:translateY(-2px) rotate(-4deg)}
#wbBtn span{font-size:11.5px;letter-spacing:.32em;text-indent:.32em;color:var(--pale)}
#wbBtn:focus-visible{outline:1px solid rgb(var(--ember));outline-offset:4px}
/* 宽屏上窗口矮的时候（笔记本上不到七百高），右边那块深度板会顶到右上角，入口让到它左边 */
@media (min-aspect-ratio: 1/1) and (min-width:761px) and (max-height:700px){
  #wbBtn{right:calc(max(14px,env(safe-area-inset-right)) + 224px)}
}
/* 时代页、档案、点开的壁画和委托单开着的时候藏起来（那几层右上角各有自己的“合上”） */
#view:has(#page.on) #wbBtn,#view:has(#prof:not([hidden])) #wbBtn,#view:has(#mv:not([hidden])) #wbBtn,#view:has(#cv:not([hidden])) #wbBtn{opacity:0;pointer-events:none}
#atBtn{all:unset;position:absolute;right:calc(max(14px,env(safe-area-inset-right)) + 86px);top:max(8px,env(safe-area-inset-top));z-index:3;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:1px;text-shadow:0 1px 8px rgba(0,0,0,.95);transition:opacity .4s}
#atBtn i{width:60px;height:60px;background:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 60 60'><g fill='none' stroke='%23f1e9d6' stroke-width='2.2' stroke-linejoin='round'><rect x='12' y='10' width='27' height='37' rx='2' transform='rotate(-9 25 28)' opacity='.55'/><rect x='20' y='12' width='27' height='37' rx='2' fill='%23161820'/><circle cx='33.5' cy='25' r='5.4'/><path d='M24.5 44.5 C26 36.5 41 36.5 42.5 44.5'/><path d='M23 16.5 H44' opacity='.5'/></g></svg>") center/86% no-repeat;filter:drop-shadow(0 6px 14px rgba(0,0,0,.65));transition:transform .35s}
#atBtn:hover i{transform:translateY(-2px) rotate(4deg)}
#atBtn span{font-size:11.5px;letter-spacing:.32em;text-indent:.32em;color:var(--pale,#ece5d6)}
#atBtn:focus-visible{outline:1px solid rgb(var(--ember,255,176,104));outline-offset:4px}
#atBtn[hidden]{display:none}
@media (max-width:520px),(max-height:500px){#atBtn i{width:46px;height:46px}}
#prof.over{z-index:9}#prof.over .cgb{display:none}
#view:has(#page.on) #atBtn,#view:has(#prof:not([hidden])) #atBtn,#view:has(#mv:not([hidden])) #atBtn,#view:has(#cv:not([hidden])) #atBtn{opacity:0;pointer-events:none}
/* 装在牌桌外壳里的时候左上角那一个回牌桌的钮（11-15 拼装那一轮） */
#toTable{all:unset;position:absolute;left:max(14px,env(safe-area-inset-left));top:calc(max(8px,env(safe-area-inset-top)) + 40px);z-index:3;cursor:pointer;font-size:12px;letter-spacing:.3em;padding:6px 12px;border:1px solid var(--line);color:var(--pale);background:rgba(4,5,10,.45);text-shadow:0 1px 6px #000}
#toTable:hover,#toTable:focus-visible{border-color:rgb(var(--ember));outline:none}
#view:has(#page.on) #toTable,#view:has(#wb.on) #toTable,#view:has(#mv:not([hidden])) #toTable,#view:has(#cv:not([hidden])) #toTable{opacity:0;pointer-events:none}
/* 井底那一句底下：1001 年今天从这里进 */
#endgo{all:unset;display:inline-block;margin-top:26px;cursor:pointer;pointer-events:none;font-size:13px;font-weight:600;letter-spacing:.5em;text-indent:.5em;padding:11px 22px;border:1px solid rgba(255,214,150,.55);color:#fbe9cc;background:rgba(5,6,12,.42);text-shadow:none}
#endtx.on #endgo{pointer-events:auto}
#endgo:hover,#endgo:focus-visible{background:#fbe9cc;color:var(--ink);outline:none}
/* 井底往回走（11-23）：“从这里进”底下垂一根细绳，一点火星顺着绳往下落；点它顺着绳再往下，翻开此刻那一本（11-24 起，原来是回井口翻月银纪） */

<script>

/* ---------- 圈和壁画 ---------- */
// 一圈一个年代：最外一圈是地开那一夜，往里（往下）是前传六页，最里一小圈是1001年。壁画照年份排成一条往下转的螺旋，一圈九个龛。

ERAS.forEach((e, i) => e.lines.forEach((l, k) => STOPS.push({ key: l.mural, ring: i + 1, era: i, line: k, name: (MU[l.mural] || {}).name || l.name.split('·').pop(), title: l.name.split('·').pop(), year: l.year ? l.year + ' 年' : '', task: l.task })));

{

    const n = STOPS.filter((s) => s.ring === r).length;
    const dyMin = h * 1.32 / 9;

const RC = RR[NR - 1] - 1.12, CORE = BOT - 6.5;
STOPS.forEach((s, k) => {
  const j = STOPS.slice(0, k).filter((x) => x.ring === s.ring).length;

const COMMS = [];
ERAS.forEach((e, i) => e.comms.forEach((c) => {
  let at = STOPS.findIndex((s) => s.era === i);
  STOPS.forEach((s, k) => { if (s.era === i && parseInt(s.year) <= (c.year || 0)) at = k; });

  if (e.mazes && e.mazes.length) h += `<h2>这一段的迷宫</h2><p class="def">${DEF.mazes}</p><ul class="mz">` + e.mazes.map((m) => `<li><b>${esc(m.name)}</b><span>${esc(m.kind === '井里' ? '井里' : m.kind === '大型' ? '大型迷宫' : '各地的井')}${m.y0 ? '　' + m.y0 + ' 年起' : ''}</span>${lead(m)}</li>`).join('') + '</ul>';
  if (e.teams && e.teams.length) h += `<h2>冒险团</h2><p class="def">${DEF.teams}</p><ul class="mz">` + e.teams.map((m) => `<li><b>${esc(m.name)}</b><span>${m.y0} 年立队</span>${m.who && m.who.length ? `<p class="who">${m.who.map(esc).join('　')}</p>` : ''}${lead(m)}</li>`).join('') + '</ul>';
  // “这一带”原来那一串地名和在哪里的字挪进了世界之书的地图，这里放一小幅（地图的数据晚到就先空着，到了再填）
  if (e.places.length) h += `<div class="mini-slot">${miniHTML(e)}</div>`;
  pgBody.innerHTML = `<div class="col">${h}</div>`;
  page.classList.toggle('cg', !!head);
  pgArt.style.setProperty('--p', '0');
  pgImg.classList.remove('in'); pgImg.onload = () => pgImg.classList.add('in');
  if (head) pgImg.src = muralSrc(head.mural); else pgImg.removeAttribute('src');
  if (head && pgImg.complete && pgImg.naturalWidth) pgImg.classList.add('in');
  pageOpen = i; page.hidden = false;
  pgWrap.scrollTop = 0; pgBody.scrollTop = 0;
  requestAnimationFrame(() => {
    page.classList.add('on');
    if (li != null) { const d = pgBody.querySelector(`details.ln[data-l="${li}"]`); if (d) { d.open = true; d.scrollIntoView({ block: 'start' }); } }
  });
}
function closeEra() {
  if (pageOpen < 0) return;
  hideCG(); closeProf();
  page.classList.remove('on'); const i = pageOpen; pageOpen = -1;
  setTimeout(() => { if (pageOpen < 0) page.hidden = true; }, 420);
  if (ringOf(s) !== i + 1) go(STOPS.findIndex((x) => x.era === i));
}
$('#pg-close').addEventListener('click', closeEra);
for (const ev of ['pointerdown', 'pointerup', 'pointermove', 'wheel']) { page.addEventListener(ev, (e) => e.stopPropagation()); $('#sheet').addEventListener(ev, (e) => e.stopPropagation()); }
pgBody.addEventListener('keydown', (ev) => { const t = ev.target; if ((ev.key === 'Enter' || ev.key === ' ') && t.dataset && t.dataset.p) { ev.preventDefault(); openProf(t.dataset.p); } });
pgBody.addEventListener('click', (ev) => {
  if (pageOpen < 0) return;          // 正在合上的那一下不接
  if (ev.target.closest('.spl')) { setSpoil(!SPOIL); return; }
  if (Codex.miniClick(ev, ERAS[pageOpen].id)) return;
  const c = ev.target.closest('.cgb,.thumb[data-k]'); if (c) { showCG(+c.dataset.k); return; }
  const who = ev.target.closest('[data-p]'); if (who) { openProf(who.dataset.p); return; }
  const b = ev.target.closest('.go'); if (!b) return;
  const e = ERAS.find((x) => x.id === b.dataset.e), l = e.lines[+b.dataset.l];
  // 装在牌桌外壳里：交给外壳去走建档；单独打开的时候还是那张“还没接上”的小纸
  if (window.SHELL) { SHELL.post({ t: 'enter', book: 'maze', era: '迷宫纪', at: e.id, title: e.title, line: l.name, year: l.year || e.years, ti: l.ti || '' }); return; }
  sheet.querySelector('.box').innerHTML = `<p class="eyebrow">记下了</p><h3>迷宫纪 ${esc(lineYear(l, e))}　【${esc(l.task || l.name)}】</h3><p>${esc(l.ti || '')}</p><p class="note">往下是建档：在井口的报名桌前报上你是谁。这一段还没有接上，样张先到这里。</p><button>好</button>`;
  sheet.hidden = false;
});
sheet.addEventListener('click', (ev) => { if (ev.target === sheet || ev.target.closest('button')) sheet.hidden = true; });
/* 井底是迷宫纪 1001 年今天：那一句底下一枚“从这里进”。装在外壳里发 enter（at 写 1001，没有主线名），单独打开的时候也是那张小纸 */
function enter1001() {
  if (window.SHELL) { SHELL.post({ t: 'goto', book: 'now', at: 'sites' }); return; }          // 11-24：1001 年做成了第五本书此刻，从这里进翻到那一本的“落在哪里”
  sheet.querySelector('.box').innerHTML = `<p class="eyebrow">记下了</p><h3>${esc(D.end.title)}　今天</h3><p>${esc(D.end.line)}</p><p class="note">往下是建档：在井口的报名桌前报上你是谁。这一段还没有接上，样张先到这里。</p><button>好</button>`;
  sheet.hidden = false;
}
endgo.addEventListener('click', enter1001);
/* 井底往回走（11-23）：迷宫纪是最后一本，“从这里进”底下再垂一根绳，顺着它回到井口，从月银纪那一本再走一遍（题字是牌桌上那张牌底下的一句）。
   装在外壳里交给外壳翻书，单独打开的时候说一声 */
function nextBook() {
  if (window.SHELL) { SHELL.post({ t: 'goto', book: 'now', at: '', turn: 1 }); return; }          // 11-24：井底接此刻那一本（此刻的尽头再翻回月银纪）
  $('#sheet').querySelector('.box').innerHTML = '<p class="eyebrow">再往下</p><h3>此刻那一本在牌桌上</h3><p class="note">装进牌桌以后，从这里顺着绳落下去，就翻开此刻，迷宫纪一千零一年。</p><button type="button">知道了</button>';
  $('#sheet').hidden = false;
}
nextgo.addEventListener('click', nextBook);

/* ---------- 世界之书（11-15）：抽成了 common/codex.js，四本书和牌桌共用一份 ---------- */
let wbOpen = false;
const openWB = (vol, pg, opts) => Codex.open(vol, pg, opts);
const closeWB = () => Codex.close();
function otherBook(vol, id) {          // 世界之书里点了别一纪的时代：装在外壳里交给外壳换书，单独打开的时候说一声
  if (window.SHELL) { SHELL.post({ t: 'goto', book: vol, at: id }); return; }
  sheet.querySelector('.box').innerHTML = '<p class="eyebrow">在另一本书里</p><h3>这一处是别的纪元的时代页</h3><p class="note">从牌桌换到那一纪的书，就能翻到这一页。</p><button type="button">知道了</button>';
  sheet.hidden = false;
}
const eraAt = (id) => ERAS.findIndex((x) => x.id === id);
function jumpTo(at) {          // 外壳或世界之书叫打开哪一处：时代页打开那一页，1001 下到井底
  const i = eraAt(at);
  if (i < 0 && at !== '1001') return false;
  begin(); sheet.hidden = true; closeComm(); closeMural();
  if (i >= 0) openEra(i); else { closeEra(); s = sT = K; touched(); }
  return true;
}
Codex.init({
  vol: 'maze', host: view, A: window.A,
  spoil: () => SPOIL, setSpoil: (v) => setSpoil(v),
  onOpen: () => { hideCG(); wbOpen = true; dragging = false; }, onClose: () => { wbOpen = !!(window.Library && Library.isOpen()); touched(); },
  onEra: (vol, id) => { if (window.Library) Library.close(true); if (vol !== 'maze' || !jumpTo(id)) otherBook(vol, id); },
}).then(() => {          // 地图的数据到了：要是已经有一页开着（?open=、外壳一上来就叫开），把“这一带”那一小幅补上
  const slot = pgBody.querySelector('.mini-slot');
  if (slot && pageOpen >= 0 && !slot.firstChild) slot.innerHTML = miniHTML(ERAS[pageOpen]);
});
const wbBtn = $('#wbBtn');
/* ---------- 大图书馆（11-24）：右上角那一枚改开图书馆，落在这一纪的廊；图书馆里的地图室翻世界之书的地图（common/library.js） ---------- */
const Lib = window.Library || null;
if (Lib) Lib.init({ vol: 'maze', host: view, A: window.A, spoil: () => SPOIL, setSpoil: (v) => setSpoil(v),
  openMap: (v) => Codex.open(v, 'map'),
  onOpen: () => { hideCG(); wbOpen = true; dragging = false; }, onClose: () => { wbOpen = Codex.isOpen(); touched(); } });
if (window.Codex) wbBtn.querySelector('img').src = window.A('common/assets/ui/emblem_maze.webp'); else if (!Lib) wbBtn.style.display = 'none';
wbBtn.addEventListener('click', () => { begin(); touched(); if (Lib) Lib.open('maze'); else openWB('maze', ''); });
/* 装在牌桌外壳里：左上角一个回牌桌的钮，外壳叫打开哪个时代页就打开 */
if (window.SHELL) {
  const tb = document.createElement('button');
  tb.id = 'toTable'; tb.type = 'button'; tb.textContent = '回到牌桌';
  tb.addEventListener('click', () => SHELL.post({ t: 'table' }));
  view.appendChild(tb);
  window.addEventListener('message', (ev) => {
    const m = ev.data || {};
    if (m.aldran && m.t === 'open') { Codex.close(); jumpTo(m.at); }
  });
}

/* ---------- 没有 WebGL 的时候 ---------- */
function toList() {
  const L = $('#list'); L.classList.add('on'); cv.style.display = 'none'; fx.style.display = 'none'; $('#cap').style.display = 'none'; part.style.display = 'none';
  L.innerHTML = RINGS.map((r, ri) => `<h2 data-r="${ri}">${esc(r.era >= 0 ? '迷宫纪 ' + r.years + ' 年' : '山铜纪947年归寂月最后一夜')}</h2><h3>${esc(r.title)}</h3><div class="row">`
    + STOPS.map((st, k) => (st.ring === ri ? `<button data-k="${k}">${MU[st.key] ? `<img loading="lazy" src="${muralSrc(st.key)}" alt="">` : '<img alt="">'}<span>${esc(st.name)}</span></button>` : '')).join('') + '</div>').join('')
    + `<h2 data-r="end">${esc(D.end.title)}</h2><h3>${esc(D.end.line)}</h3><button class="end" type="button">从这里进</button><button class="end up" type="button">再往下 · 此刻</button><p class="upl">灯火照旧。远处，钟敲了第一声。</p>`;      // 井底那一处：1001 年今天
  L.addEventListener('click', (e) => { const b = e.target.closest('button[data-k]'); if (b) openMural(+b.dataset.k); else if (e.target.closest('button.end.up')) nextBook(); else if (e.target.closest('button.end')) enter1001(); });
}

/* ---------- 开 ---------- */
window.__mz = { go: (v) => { sT = s = v; began = true; $('#intro').classList.add('off'); }, tick: (ms) => { simT += ms; frame(simT); }, openEra, openMural, openComm: (i) => openComm(COMMS[i].c, COMMS[i].era),
  closeEra, closeMural, closeComm, texOK: (k) => !!(TEX[k] && TEX[k].ok), hasMural: (k) => !!MU[STOPS[k].key], gl: () => !!gl,
  openWB, closeWB, openProf, setSpoil, enter1001, jumpTo,
  get wb() { const q = Codex.state; return { open: q.open, vol: q.vol, page: q.page, vols: q.vols, maps: q.maps, spoil: SPOIL }; },
  state: () => ({ s, K, ring: ringOf(s), stops: STOPS.length, comms: COMMS.length, tex: Object.keys(TEX).length, curStop, page: pageOpen, prof: profOpen, frames, paused: paused() }), STOPS, RINGS,
  comms: () => COMMS.map((m) => ({ era: m.era, ring: m.ring, title: m.c.title || m.c.name, shown: m.el.style.display !== 'none' })) };
let simT = 0;
function boot() {
  if (!layout()) return false;
  if (!initGL()) toList();
  if (Q.has('s')) { s = sT = clamp(+Q.get('s'), -1, K); }
  if (SKIP) { $('#intro').style.display = 'none'; began = true; }
  else setTimeout(begin, 3200);
  CAM = camAt(s); VP = mul(persp(FOV, W / H, 0.08, 220), look(CAM.p, CAM.t));
  if (Q.has('open')) openEra(clamp(+Q.get('open'), 0, N - 1));
  if (!SIM) requestAnimationFrame(loop); else frame(0);
  return true;
}
addEventListener('resize', () => { if (layout() && (SIM || paused())) frame(SIM ? simT : performance.now()); });      // 停着的时候（世界之书、时代页开着）换了尺寸，补画一帧，底下不留一块空的
if (!boot()) { const iv = setInterval(() => { if (boot()) clearInterval(iv); }, 120); }
if (window.SHELL && SHELL.at) setTimeout(() => jumpTo(SHELL.at), 400);          // 外壳一上来就叫开哪一页
/* ---------- 图鉴（11-17）：common/atlas.js，一纪一本，人物点开借那一段的名单开档案 ---------- */
function openProfAt(id, name) {      // 图鉴里点人：不开时代页，档案盖在图鉴上面
  const i = ERAS.findIndex((x) => x.id === id); if (i < 0) return;
  profEra = i; if (!prof._home) prof._home = [prof.parentElement, prof.nextSibling];          // 11-25：档案原来长在时代页里头，时代页没开着时从图鉴点开量出来是 0×0，先挪到 view 底下盖在图鉴上，合上再挪回去
  if (prof.parentElement !== view) view.appendChild(prof);
  prof.classList.add('over'); openProf(name);
}
const atBtn = $('#atBtn');
function atPos() {            // 摆在世界之书那一枚的左手边
  const w = $('#wbBtn'), r = w ? w.getBoundingClientRect() : null, v = view.getBoundingClientRect();
  if (r && r.width) atBtn.style.right = Math.round(v.right - r.left + 16) + 'px';
}
if (window.Atlas) {
  Atlas.init({
    vol: 'maze', host: view, A: window.A,
    spoil: () => SPOIL, setSpoil: (v) => setSpoil(v),
    curEra: () => (pageOpen >= 0 ? ERAS[pageOpen].id : null),
    openPerson: (id, name) => openProfAt(id, name),
    onEsc: () => (profOpen && prof.classList.contains('over') ? (closeProf(), true) : false),
    goEra: (id) => { closeProf(); jumpTo(id); },
  }).then((a) => { if (a.missing) atBtn.hidden = true; });
  atBtn.addEventListener('click', () => { if (typeof touched === 'function') touched(); Atlas.open(); });
  window.addEventListener('resize', atPos); atPos(); setTimeout(atPos, 600);
} else atBtn.hidden = true;
}
</script>
