<title>死之神殿牌桌</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600;900&display=swap" media="print" onload="this.media='all'">
<style>
/* 第四版（11-10 夜）。流程照用户说的：开场就是那张牌桌；她的手扫过桌面留下四张牌，手离开，四张牌烧开成四个纪元把屏幕分成四块；
   玩家选一个，她的手从上面捏住那一块收回成牌，另外三块也变回牌飞走；镜头跟住她的手，她把牌拿起来、举到眼前立住，不翻牌，直接进这一纪（第九版，11-11）。
   她的手是黑丝手套加红指甲，没有袖子；手装了骨骼（网格加骨头）。拿牌是食指、中指搭在牌背上、拇指从后面抵着（第十版）：手拆成两层，拇指在牌后面，别的在牌前面。四纪各有一张自己的牌背。
   动作的讲究照崩铁《来自星空的寓言集·上篇》黑天鹅抽牌那一段：近景，指尖一点一圈光，手一直在走；夹住牌以后镜头跟上去，桌面几帧里暗掉（不切镜头），手带着牌画半个圆甩上来立住，背后一圈放射的光，大字一闪，出标题。
   版式：一块 1024×1536 的舞台照屏幕的高缩放、左右居中，窄屏裁掉两侧；字和钮在舞台外面一层。 */
:root{
  color-scheme:dark;
  --ink:#05060c;        /* 底色 */
  --stone:#c9ccd8;      /* 正文字 */
  --pale:#f1eef5;       /* 亮字 */
  --dim:#8c90a4;        /* 小字 */
  --crimson:#8c2233;    /* 她的红 */
  --teal:#7fe3d8;       /* 神殿的青火 */
  --ember:255,176,104;  /* 烧开的火 */
  --tint:241,232,236;   /* 这一纪的光，抽到哪张换哪种 */
  --vx0:158px;          /* 屏幕左沿落在舞台的哪里，脚本里算 */
  --serif:"Noto Serif SC","Songti SC","STSong","SimSun",serif;
}
html,body{height:100%;-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{margin:0;background:var(--ink);color:var(--stone);font-family:var(--serif);overflow:hidden;position:relative}
[hidden]{display:none!important}
/* 舞台比屏幕大、靠缩放塞进去的，所以这两层要裁死，不能让焦点或脚本把它滚走（clip 不认的浏览器由脚本把滚动拨回去） */
#view{position:absolute;inset:0;overflow:hidden;overflow:clip;touch-action:manipulation;background:var(--ink)}
#stage{position:absolute;left:0;top:0}
#world{position:absolute;left:0;top:0;width:1024px;height:1536px;transform-origin:0 0;overflow:hidden;overflow:clip;background:var(--ink)}
#world.narrow::after{display:none}       /* 窄屏上两边那道淡出本来就在屏幕外头，不用画 */
/* 宽屏上舞台只占当中一条，两边淡进底色 */
#world::after{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(90deg,var(--ink) 0,rgba(5,6,12,0) 6%,rgba(5,6,12,0) 94%,var(--ink) 100%)}
/* 不在场的那几场淡出以后用 visibility 藏掉，手机上才不替它们留着显存 */
.scene{position:absolute;inset:0;opacity:0;visibility:hidden;pointer-events:none;transition:opacity 1.2s ease,visibility 0s linear 1.2s}
.scene.on{opacity:1;visibility:visible;transition:opacity 1.2s ease,visibility 0s}

/* 一、牌桌：从开场起就是它。一张斜着看下去的圆石桌，桌心一只闭着的眼。
   桌面是画的（不转）；上头一层页面里画的细刻度很慢地转；底下垫一层往下错开的暗盘，露出来的那一弯就是桌沿的厚度 */
#sTable{transition:opacity 1.8s ease,visibility 0s linear 1.8s}
#sTable.on{transition:opacity 1.8s ease,visibility 0s}
#tbl{position:absolute;inset:0;perspective:2600px;perspective-origin:512px 520px;transform-origin:512px 760px}
#plane{position:absolute;left:512px;top:560px;width:0;height:0;transform:rotateX(58deg);transform-style:preserve-3d}
.pside,.ptab,.pring,.pglow{position:absolute;border-radius:50%}
.pside,.ptab,.pring{left:-740px;top:-740px;width:1480px;height:1480px}
.pside{transform:translateZ(-50px);background:radial-gradient(circle closest-side,#0b0f1c 0,#0b0f1c 88%,#070a14 94%,#020308 100%)}
.ptab{background:radial-gradient(circle closest-side,rgba(5,6,12,0) 0,rgba(5,6,12,.16) 50%,rgba(5,6,12,.5) 100%),url(assets/table.webp) center/100% 100% no-repeat,#141a2c;
  box-shadow:inset 0 0 0 2px rgba(200,216,236,.36)}
.pring{transform:translateZ(.5px)}
.pring svg{position:absolute;left:0;top:0}
.pglow{left:-440px;top:-440px;width:880px;height:880px;transform:translateZ(1px);
  background:radial-gradient(circle closest-side,rgba(170,248,238,.36) 0,rgba(127,227,216,.13) 34%,rgba(127,227,216,0) 72%);animation:breathe 4.6s ease-in-out infinite alternate}
@keyframes breathe{0%{opacity:.35}100%{opacity:1}}
@keyframes spinK{from{transform:scale(2.5) rotate(0deg)}to{transform:scale(2.5) rotate(360deg)}}
#fog{position:absolute;inset:0;background:
  linear-gradient(to bottom,#05060c 0,rgba(5,6,12,.86) 9%,rgba(5,6,12,.34) 22%,rgba(5,6,12,0) 38%),
  linear-gradient(to top,rgba(5,6,12,.92) 0,rgba(5,6,12,0) 22%),
  radial-gradient(120% 70% at 50% 50%,rgba(5,6,12,0) 50%,rgba(5,6,12,.7) 100%)}

/* 二、四个纪元：四条斜着切开的画带，从上到下。每一条是从一张牌烧开的 */
#bands{position:absolute;inset:0;pointer-events:none}
.band{appearance:none;-webkit-appearance:none;position:absolute;left:0;top:0;width:1024px;border:0;padding:0;margin:0;background:none;font:inherit;color:inherit;text-align:left;
  cursor:pointer;-webkit-tap-highlight-color:transparent;outline:none;pointer-events:none;display:block}
.band.live{pointer-events:auto}
.bimg,.bart,.bscrim,.bshade,.bring,.btxt{display:block;position:absolute}
.bimg{inset:0;clip-path:circle(0px at 512px 200px)}
.bart{inset:0;background-size:cover;background-repeat:no-repeat}
.bscrim{inset:0;background:linear-gradient(90deg,rgba(5,6,12,.82) 0,rgba(5,6,12,.62) calc(var(--vx0) + 250px),rgba(5,6,12,0) calc(var(--vx0) + 640px))}
.bshade{inset:0;background:#05060c;opacity:0;transition:opacity .45s ease}
.band.off .bshade{opacity:.5}
.btxt{left:calc(var(--vx0) + 46px);top:50%;width:560px;transform:translateY(-50%);opacity:0;transition:opacity .7s ease}
.band.txt .btxt{opacity:1}
.btxt span{display:block}
.btxt .n{font-size:25px;letter-spacing:.3em;color:rgba(var(--bt),.95)}
.btxt .t{font-size:68px;font-weight:600;letter-spacing:.3em;line-height:1.3;color:var(--pale);text-shadow:0 2px 18px rgba(4,5,12,.9),0 0 30px rgba(var(--bt),.35)}
.btxt .y{font-size:22px;letter-spacing:.3em;color:rgba(241,238,245,.7);margin-top:2px}
.btxt .b{font-size:27px;letter-spacing:.08em;line-height:1.62;color:var(--stone);margin-top:16px;max-width:500px;text-wrap:balance;text-shadow:0 1px 10px rgba(4,5,12,.95)}
.band.off .btxt .b{display:none}
.bring{left:0;top:0;width:200px;height:200px;margin:-100px 0 0 -100px;border-radius:50%;border:6px solid rgba(var(--ember),.95);
  box-shadow:0 0 30px rgba(var(--ember),.8),inset 0 0 26px rgba(var(--ember),.6);opacity:0}
.band:focus-visible .btxt .t{color:var(--teal)}
/* 画带之间的缝：一道烧着的线 */
#seams{position:absolute;inset:0;pointer-events:none;opacity:0;visibility:hidden;transition:opacity .6s ease,visibility 0s linear .6s}
#seams.on{opacity:1;visibility:visible;transition:opacity .6s ease,visibility 0s}
.seam{position:absolute;left:-10px;top:0;width:1050px;height:3px;transform-origin:0 50%;
  background:linear-gradient(90deg,rgba(var(--ember),0) 0,rgba(var(--ember),.85) 18%,rgba(255,236,206,.95) 50%,rgba(var(--ember),.85) 82%,rgba(var(--ember),0) 100%);
  box-shadow:0 0 14px rgba(var(--ember),.75),0 0 3px rgba(255,236,206,.9);animation:seam 1.7s ease-in-out infinite alternate}
@keyframes seam{0%{opacity:.55}40%{opacity:1}70%{opacity:.7}100%{opacity:.95}}

/* 三、黑底：两指夹着牌立起来 */
#sVoid{background:#04050a;transition:none}
#vglow{position:absolute;inset:0;background:radial-gradient(60% 42% at 50% 44%,rgba(var(--tint),.16),rgba(120,30,50,.14) 46%,rgba(4,5,10,0) 80%)}
#rays{position:absolute;left:0;top:0;width:0;height:0;opacity:0}
/* 两圈放射光画成 656 见方再放大两倍半：光本来就是虚的，手机上少画六倍的像素 */
#rays i{position:absolute;left:-328px;top:-328px;width:656px;height:656px;border-radius:50%;transform:scale(2.5);
  -webkit-mask-image:radial-gradient(circle closest-side,transparent 13%,#000 24%,rgba(0,0,0,.4) 52%,transparent 96%);mask-image:radial-gradient(circle closest-side,transparent 13%,#000 24%,rgba(0,0,0,.4) 52%,transparent 96%)}
#rays i:nth-child(1){background:repeating-conic-gradient(from 0deg,rgba(var(--tint),0) 0deg,rgba(var(--tint),.26) .9deg,rgba(var(--tint),0) 2.2deg,rgba(var(--tint),0) 9deg);animation:spinK 90s linear infinite}
#rays i:nth-child(2){background:repeating-conic-gradient(from 4deg,rgba(var(--tint),0) 0deg,rgba(var(--tint),.16) .6deg,rgba(var(--tint),0) 1.5deg,rgba(var(--tint),0) 15deg);animation:spinK 130s linear infinite reverse}
#halo{position:absolute;left:-330px;top:-330px;width:660px;height:660px;border-radius:50%;border:1.5px solid rgba(var(--tint),.5);box-shadow:0 0 40px rgba(var(--tint),.25),inset 0 0 60px rgba(var(--tint),.12)}
#sting{position:absolute;inset:0;overflow:hidden}
#sting b{position:absolute;font-weight:900;font-size:640px;line-height:1;color:transparent;-webkit-text-stroke:3px rgba(var(--tint),.6);opacity:0;white-space:nowrap}

/* 四张牌：自己会翻会转 */
#shadows,#ripples{position:absolute;inset:0;pointer-events:none}
.hsd{position:absolute;left:0;top:0;width:320px;height:70px;margin:-35px 0 0 -160px;border-radius:50%;background:radial-gradient(closest-side,rgba(2,3,8,.8),rgba(2,3,8,0));opacity:0}
#heroes{position:absolute;inset:0;perspective:2600px;perspective-origin:512px 560px;pointer-events:none}
.hero{position:absolute;left:0;top:0;width:360px;height:540px;margin:-270px 0 0 -180px;transform-style:preserve-3d;opacity:0;text-align:center}
.hf{position:absolute;inset:0;display:block;border-radius:16px;backface-visibility:hidden;-webkit-backface-visibility:hidden;overflow:hidden}
/* 牌背一纪一张（行内样式里给图）；图没到的时候露出底下那张画成矢量的旧牌背 */
.hf.back{transform:rotateY(180deg);background:var(--back) center/100% 100% no-repeat}
.hf.back i{position:absolute;inset:0;background:center/100% 100% no-repeat}
.hf.back::after{content:"";position:absolute;inset:0;border-radius:16px;box-shadow:inset 0 0 0 1.5px rgba(236,232,244,.42),inset 0 0 0 3px rgba(6,7,14,.5)}
.hf.front{background:#0b0d17}
/* 甩牌那几帧的拖影：两张只有牌背的薄片，跟在牌后面 */
.ghost{position:absolute;left:0;top:0;width:360px;height:540px;margin:-270px 0 0 -180px;border-radius:16px;background:center/100% 100% no-repeat;opacity:0;pointer-events:none}
.hf span{display:block;position:absolute}
.art{left:14px;top:14px;width:332px;height:410px;border-radius:5px;background-size:auto 100%;background-repeat:no-repeat}
.frame{inset:6px;border:1.5px solid rgba(241,238,245,.82);border-radius:11px}
.frame::after{content:"";position:absolute;inset:4px;border:1px solid rgba(241,238,245,.26);border-radius:7px}
.plate{left:0;right:0;top:439px;height:90px}
.plate .n{left:0;right:0;top:0;height:20px;line-height:20px;font-size:15px;letter-spacing:.3em;margin-right:-.3em;color:rgba(241,238,245,.7)}
.plate .t{left:0;right:0;top:22px;height:46px;line-height:46px;font-size:34px;font-weight:600;letter-spacing:.42em;margin-right:-.42em;color:var(--pale)}
.plate .y{left:0;right:0;top:70px;height:20px;line-height:20px;font-size:12.5px;letter-spacing:.3em;margin-right:-.3em;color:var(--dim)}
.sheen{inset:-10% -70%;background:linear-gradient(105deg,rgba(255,255,255,0) 42%,rgba(255,255,255,.6) 50%,rgba(255,255,255,0) 58%);opacity:0}
.hero.shine .sheen{animation:sheen .75s ease-out}
@keyframes sheen{0%{transform:translateX(-60%);opacity:0}25%{opacity:1}100%{transform:translateX(60%);opacity:0}}
.hero.lit .hf.back{box-shadow:0 0 34px rgba(200,255,246,.85)}
.hero.lit .hf.back::after{box-shadow:inset 0 0 0 2.5px #fff}

/* 手 */
#hsh{position:absolute;left:0;top:0;width:330px;height:170px;margin:-85px 0 0 -165px;border-radius:50%;background:radial-gradient(closest-side,rgba(2,3,8,.78),rgba(2,3,8,0));opacity:0;pointer-events:none}
#hglow{position:absolute;left:0;top:0;width:420px;height:240px;margin:-120px 0 0 -210px;border-radius:50%;background:radial-gradient(closest-side,rgba(190,255,246,.34),rgba(127,227,216,.12) 50%,rgba(127,227,216,0));opacity:0;pointer-events:none}
/* 静止的手（没装骨骼的时候用）：#hand、#hold 在牌的上面，#holdB 在牌的下面。拿牌的那只整只手放在下面，擦掉拇指的那一张放在上面 */
.hbox{position:absolute;left:0;top:0;width:0;height:0;pointer-events:none;opacity:0;will-change:transform}
.hbox img,.hbox canvas{position:absolute;max-width:none}
/* 装上骨骼以后手画在两张画布上：rigb 在牌的下面，rigc 在牌的上面。拿牌的那只手整只画在下面一张，擦掉拇指的画在上面一张：食指中指在牌前面，拇指在牌后面，牌就真的拿在中间。
   静止的图藏起来当后备 */
.rigcv{position:absolute;left:0;top:0;width:1024px;height:1536px;pointer-events:none}
#world.rig .hbox img,#world.rig .hbox canvas{visibility:hidden}
/* 黑底里小臂往暗处化掉。装了骨骼的在着色器里做；这一条管静止的图 */
#world.armfade #hold>*,#world.armfade #holdB>*{-webkit-mask-image:linear-gradient(180deg,#000 0,#000 67%,transparent 96%);mask-image:linear-gradient(180deg,#000 0,#000 67%,transparent 96%)}
/* 两张图摆在哪、多大，脚本里照 RIG_DEF 算 */
/* 轻的画法（上一回在这台机器上开崩了才用）：不用 WebGL，手是静止的图；桌子压成一层，不呼吸 */
#world.lite .rigcv,#world.lite .pside{display:none}
#world.lite #plane{transform-style:flat}
#world.lite .pglow,#world.lite #rays i{animation:none}
#note{position:absolute;left:10px;top:8px;max-width:32vw;pointer-events:auto;font:inherit;font-size:9.5px;line-height:1.45;letter-spacing:.02em;text-align:left;
  color:var(--dim);background:rgba(10,12,22,.55);border:1px solid rgba(201,204,216,.2);border-radius:2px;padding:.3em .6em;cursor:pointer}
.ripple{position:absolute;width:220px;height:220px;margin:-110px 0 0 -110px;border-radius:50%;border:2px solid rgba(var(--rc,200,255,246),.95);
  box-shadow:0 0 22px rgba(var(--rc,200,255,246),.55),inset 0 0 18px rgba(var(--rc,200,255,246),.3);animation:rip .75s cubic-bezier(.2,.7,.3,1) forwards}
@keyframes rip{0%{transform:scale(.1,calc(.1*var(--sy,1)));opacity:1}100%{transform:scale(1.5,calc(1.5*var(--sy,1)));opacity:0}}

/* 四、这一纪：牌面的画铺开，底下出标题 */
#sEra{background:#05060c;transition:opacity .32s ease,visibility 0s linear .32s}
#sEra.on{transition:opacity .32s ease,visibility 0s}
#win{position:absolute;left:0;top:60px;width:1024px;height:900px;overflow:hidden;
  -webkit-mask-image:linear-gradient(to bottom,#000 0,#000 80%,transparent 100%);mask-image:linear-gradient(to bottom,#000 0,#000 80%,transparent 100%)}
#pan{position:absolute;top:0;height:900px;width:1350px;max-width:none;will-change:transform}
#lock{position:absolute;left:0;right:0;top:0;height:0;text-align:center}
#lock div{position:absolute;left:0;right:0}
#lock .n{top:999px;height:33px;line-height:33px;font-size:33px;letter-spacing:.3em;text-indent:.3em;color:rgba(241,238,245,.72)}
#lock .t{top:1042px;height:100px;line-height:100px;font-size:74.6px;font-weight:600;letter-spacing:.42em;text-indent:.42em;color:var(--pale);text-shadow:0 0 34px rgba(var(--tint),.6),0 2px 16px rgba(4,5,12,.9)}
#lock .y{top:1147px;height:44px;line-height:44px;font-size:27.4px;letter-spacing:.3em;text-indent:.3em;color:var(--dim)}
#lock .rule{top:1212px;height:1px;width:0;margin:0 auto;background:linear-gradient(90deg,rgba(var(--tint),0),rgba(var(--tint),.85),rgba(var(--tint),0));transition:width 1.1s ease .35s}
#lock.on .rule{width:460px}
#lock .b{top:1234px;font-size:32px;line-height:52px;letter-spacing:.1em;color:var(--stone);opacity:0;transform:translateY(14px);transition:opacity .9s ease .7s,transform .9s ease .7s;
  width:600px;margin:0 auto;text-wrap:balance;text-shadow:0 1px 12px rgba(4,5,12,.9)}
#lock.on .b{opacity:1;transform:none}
#lock .glint{top:1042px;height:100px;width:0;margin:0 auto;background:linear-gradient(90deg,rgba(255,255,255,0),rgba(255,255,255,.75),rgba(255,255,255,0));opacity:0;filter:blur(6px)}
#lock.on .glint{animation:glint .9s ease-out .05s}
@keyframes glint{0%{width:0;opacity:.9;height:100px}60%{width:900px;opacity:.5;height:6px;top:1090px}100%{width:1000px;opacity:0;height:2px;top:1092px}}

/* 最上头：飘的光点，四角压暗，一闪 */
canvas#motes{position:absolute;left:0;top:0;width:1024px;height:1536px;pointer-events:none}
#vig{position:absolute;inset:0;pointer-events:none;background:radial-gradient(78% 62% at 50% 54%,rgba(4,5,10,0) 52%,rgba(4,5,10,.72) 100%);transition:opacity .8s ease}
#vig.soft{opacity:.45}
#leak{position:absolute;inset:0;pointer-events:none;opacity:0;visibility:hidden;transition:opacity 2.2s ease,visibility 0s linear 2.2s;overflow:hidden}
#leak.on{opacity:1;visibility:visible;transition:opacity 2.2s ease,visibility 0s}
#leak::before,#leak::after{content:"";position:absolute;width:980px;height:980px;border-radius:50%}
#leak::before{left:-520px;top:-260px;background:radial-gradient(closest-side,rgba(127,227,216,.2),rgba(127,227,216,0));animation:drift1 13s ease-in-out infinite alternate}
#leak::after{left:540px;top:620px;background:radial-gradient(closest-side,rgba(210,70,104,.17),rgba(210,70,104,0));animation:drift2 17s ease-in-out infinite alternate}
@keyframes drift1{to{transform:translate(160px,120px) scale(1.15)}}
@keyframes drift2{to{transform:translate(-190px,-150px) scale(1.2)}}
#flash{position:absolute;inset:0;background:rgb(var(--tint));opacity:0;pointer-events:none}

/* 字 */
#ui{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:space-between;pointer-events:none;
  padding-block:14px 16px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
#top{position:relative;font-size:12px;letter-spacing:.32em;color:var(--dim);text-align:center;opacity:0;transition:opacity 2s ease 1s}
#top.on{opacity:.9}
#top.on.quiet{opacity:0;transition:opacity .6s ease}
#skip{position:absolute;right:0;top:-6px;pointer-events:auto;font:inherit;font-size:12px;letter-spacing:.2em;text-indent:.2em;color:var(--stone);background:rgba(20,24,40,.45);border:1px solid rgba(201,204,216,.3);padding:.45em .9em;border-radius:2px;cursor:pointer}
#skip:focus-visible{outline:2px solid var(--teal);outline-offset:3px}
#cap{min-height:4.2em;text-align:center;text-shadow:0 1px 12px rgba(4,5,12,.95),0 0 3px rgba(4,5,12,.9)}
#line{font-size:clamp(15px,4.2vw,20px);color:var(--pale);letter-spacing:.08em;line-height:1.7;opacity:0;transition:opacity .7s ease;text-wrap:balance}
#line.on{opacity:1}
#sub{font-size:12.5px;color:var(--dim);letter-spacing:.14em;margin-top:.45em;opacity:0;transition:opacity .7s ease}
#sub.on{opacity:1}
#acts{display:flex;gap:12px;justify-content:center;margin-top:.7em}

<script>
(() => {
  const $ = s => document.querySelector(s);
  const view = $('#view'), stageEl = $('#stage'), world = $('#world');
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const RAD = Math.PI / 180;

  /* 这一页在有的手机上会不会把网页进程撑爆，本地验不出来，所以自己留一手：
     开到哪一步随手记在本机（tb_step）。下一回打开的时候要是发现上一回没走到“稳了”，就认定上一回是开崩了，
     往后在这台机器上改用轻的画法（不用 WebGL，桌子不分层），左上角写一行小字说上回停在哪；点那行小字换回完整的画法。
     正常关掉页面、切到后台，不算崩。地址带 ?lite 强制用轻的，带 ?full 把记下的东西清掉。 */
  const STEP_NAME = { boot: '刚打开', table: '桌面的图到了', assets: '图都到了', gl: '建好了画布', rig1: '装了第一只手', rig2: '装了两只手', rig3: '手都装了', run: '开始画了', pick: '捏起牌', void: '提起牌', era: '进这一纪' };
  const RANK = ['boot', 'table', 'assets', 'gl', 'rig1', 'rig2', 'rig3', 'run', 'ok'];
  const store = { get: k => { try { return localStorage.getItem(k) || ''; } catch (e) { return ''; } }, set: (k, v) => { try { localStorage.setItem(k, v); } catch (e) {} } };
  let LITE = false, crashAt = '', stepNow = '', bootDone = false, bootOk = false, okFrames = 0;
  {
    /* 等图的那几步（刚打开、桌面的图到了、图都到了）页面没了，多半是被重开了一遍，不算开崩；离上一笔不到两秒半就又打开的，也是重开，不算 */
    const EARLY = ['', 'boot', 'table', 'assets'];
    const q = new URLSearchParams(location.search);
    if (q.has('full')) { store.set('tb_lite', ''); store.set('tb_crash', ''); store.set('tb_step', 'ok'); }
    const last = store.get('tb_step'), ago = Date.now() - (+store.get('tb_time') || 0);
    if (store.get('tb_lite') === '1' && EARLY.indexOf(store.get('tb_crash')) >= 0) { store.set('tb_lite', ''); store.set('tb_crash', ''); }     /* 上一版记下的误判，清掉 */
    if (store.get('tb_lite') === '1') { LITE = true; crashAt = store.get('tb_crash'); }
    else if (last !== 'ok' && last !== 'left' && EARLY.indexOf(last) < 0 && ago > 2500) { LITE = true; crashAt = last; store.set('tb_lite', '1'); store.set('tb_crash', last); }
    if (q.has('lite')) LITE = true;
    if (LITE) world.classList.add('lite');
  }
  const put = s => { stepNow = s; store.set('tb_step', s); store.set('tb_time', String(Date.now())); };
  const mark = s => { if (LITE || RANK.indexOf(s) <= RANK.indexOf(stepNow)) return; put(s); };
  /* 开稳以后：走到捏牌、翻牌、进这一纪各记一笔，走完记回“稳了”。死在哪一段，下一回知道 */
  const phase = s => { if (LITE || !bootOk) return; put(s); };
  mark('boot');
  addEventListener('pagehide', () => { if (!LITE && stepNow !== 'ok') store.set('tb_step', 'left'); });
  document.addEventListener('visibilitychange', () => { if (!LITE && stepNow !== 'ok') store.set('tb_step', document.hidden ? 'left' : stepNow); });

  /* 舞台照屏幕的高缩放。VX0、VX1 是屏幕左右两沿落在舞台的哪里，牌和字都排在这一段里 */
  let S = 1, OFFX = 0, VX0 = 158, VX1 = 866, VW = 708, rigOn = false;
  const ZOOM = !new URLSearchParams(location.search).has('nozoom') && !!(window.CSS && CSS.supports && CSS.supports('zoom', '0.5'));
  function fit() {
    const W = view.clientWidth, H = view.clientHeight;
    S = H / 1536; OFFX = (W - 1024 * S) / 2;
    /* 舞台缩小用 zoom，不用 transform。transform 只是把画好的东西缩着贴出来：手机上每一层还是照 1024×1536 乘屏幕倍数去画，一层满屏的就是五十多兆显存，
       层一多系统就把网页进程收了。zoom 是真的按小尺寸排版、按小尺寸画，省四倍。不认 zoom 的浏览器退回 transform。地址带 ?nozoom 强制用旧办法（本地对比用） */
    stageEl.style.left = OFFX.toFixed(2) + 'px';
    if (ZOOM) world.style.zoom = S.toFixed(5); else world.style.transform = `scale(${S})`;
    VX0 = Math.max(0, -OFFX / S); VX1 = Math.min(1024, (W - OFFX) / S); VW = VX1 - VX0;
    world.style.setProperty('--vx0', VX0.toFixed(1) + 'px'); world.classList.toggle('narrow', VX0 > 70);
    if (rigOn) sizeRig();
  }
  addEventListener('resize', fit); fit();
  addEventListener('scroll', e => {
    const t = e.target === document ? document.scrollingElement : e.target;
    if (t && (t.scrollTop || t.scrollLeft)) { t.scrollTop = 0; t.scrollLeft = 0; }
  }, true);

  /* 四纪。牌下面那一句是占位的；fx、fy 是主画上那团火的位置，牌面、画带和收尾的画都照它取景 */
  const ERAS = [
    { name: '月银纪', num: 'Ⅰ', years: '一万零八十一年', line: '天亮以前，人只有火。', fx: .44, fy: .96, tint: '176,204,255' },
    { name: '纷争纪', num: 'Ⅱ', years: '一万一千零三十四年', line: '神和魔神倒在墙的两边，墙还站着。', fx: .49, fy: .62, tint: '255,150,128' },
    { name: '山铜纪', num: 'Ⅲ', years: '九百四十七年', line: '机器睡了，剑醒了。两个王背对背走远。', fx: .5, fy: .2, tint: '255,214,150' },
    { name: '迷宫纪', num: 'Ⅳ', years: '一千零一年', line: '地开了。人一层一层往下走。', fx: .5, fy: .9, tint: '150,176,255' },
  ];

  /* ---------- 时间 ---------- */
  const E = {
    lin: t => t, out: t => 1 - Math.pow(1 - t, 3), out5: t => 1 - Math.pow(1 - t, 5), in: t => t * t * t, quad: t => 1 - (1 - t) * (1 - t),
    io: t => t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2, sine: t => .5 - .5 * Math.cos(Math.PI * t),
    back: t => { const c = 1.5; return 1 + (c + 1) * Math.pow(t - 1, 3) + c * Math.pow(t - 1, 2); },
  };
  /* 甩牌那一下的快慢（照参考片一帧一帧量的）：起手一小段加速，中间匀着走，末了拖一条很长的尾巴慢慢停。先把速度画出来，再累加成路程 */
  E.swing = (() => {
    const N = 240, T = new Float32Array(N + 1); let acc = 0;
    for (let i = 1; i <= N; i++) { const u = (i - .5) / N, q = u / .09, v = u < .09 ? q * q * (3 - 2 * q) : u < .44 ? 1 : Math.exp(-(u - .44) / .15); acc += v; T[i] = acc; }
    return t => { const x = Math.min(1, Math.max(0, t)) * N, i = Math.min(N - 1, x | 0); return (T[i] + (T[i + 1] - T[i]) * (x - i)) / acc; };
  })();
  let run = 0, tid = 0;
  const dead = me => me !== run;
  /* 地址后面带 ?slow=4 就整体放慢四倍，本地一帧一帧看动作用 */
  const SLOW = Math.max(.1, +(new URLSearchParams(location.search).get('slow')) || 1);
  /* 本地验用的假钟：地址带 ?sim=1 的时候时间不自己走，脚本里调 __tb.tick(毫秒) 才往前走一截。
     应用的预览窗藏着的时候一秒只刷一两帧，手指甩不甩得起来靠这个一帧一帧地看。样式里的过渡和动画不归它管，照真的钟走。 */
  const SIM = new URLSearchParams(location.search).has('sim');
  let vt = 0; const vq = [], vtm = [];
  const nowMs = () => SIM ? vt : performance.now();
  const raf = fn => SIM ? vq.push(fn) : requestAnimationFrame(fn);
  const later = (fn, ms) => SIM ? vtm.push({ t: vt + ms, fn }) : setTimeout(fn, ms);
  async function tick(ms) {
    for (let t = 0; t < ms; t += 16.667) {
      vt += 16.667;
      for (const x of vtm.filter(x => x.t <= vt)) { vtm.splice(vtm.indexOf(x), 1); x.fn(); }
      await new Promise(r => setTimeout(r, 0));
      for (const fn of vq.splice(0)) fn(vt);
      await new Promise(r => setTimeout(r, 0));
    }
    return Math.round(vt);
  }
  const wait = ms => new Promise(r => later(r, reduce ? 0 : ms * SLOW));
  /* 把一个状态对象上的几个数在一段时间里送到目标值；同一个数后起的那一回说了算 */
  function to(o, props, dur, ease = E.out, me = run) {
    const id = ++tid, keys = Object.keys(props), from = {};
    o._t = o._t || {};
    for (const k of keys) { from[k] = o[k]; o._t[k] = id; }
    dur = reduce ? 1 : dur * SLOW;
    return new Promise(res => {
      const t0 = nowMs();
      (function step(now) {
        if (me !== run) return res(false);
        const t = Math.min(1, Math.max(0, (now - t0) / dur)), e = ease(t);
        for (const k of keys) if (o._t[k] === id) o[k] = from[k] + (props[k] - from[k]) * e;
        if (t < 1) raf(step); else res(true);
      })(t0);
    });
  }
  /* 这几个数不再归先前起的那几回管（另有别处接手了） */
  function drop(o, ...keys) { if (o._t) for (const k of keys) o._t[k] = 0; }
  function each(dur, fn, me = run) {
    dur = reduce ? 1 : dur * SLOW;
    return new Promise(res => {
      const t0 = nowMs();
      (function step(now) {
        if (me !== run) return res(false);
        const t = Math.min(1, Math.max(0, (now - t0) / dur));
        fn(t);
        if (t < 1) raf(step); else res(true);
      })(t0);
    });
  }

  /* ---------- 牌桌 ---------- */
  /* 备用的牌背（四纪的牌背图没到的时候露出来）：暗红的底，细银线，当中一只竖瞳的眼 */
  const BACK = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 180"><defs><linearGradient id="g" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7a1d33"/><stop offset=".55" stop-color="#561224"/><stop offset="1" stop-color="#380b19"/></linearGradient></defs>
<rect width="120" height="180" rx="7" fill="url(#g)"/>
<g fill="none" stroke="#f1e4ea" stroke-linecap="round">
<rect x="5" y="5" width="110" height="170" rx="4.5" stroke-opacity=".78"/><rect x="9" y="9" width="102" height="162" rx="3" stroke-opacity=".3" stroke-width=".6"/>
<circle cx="60" cy="90" r="36" stroke-opacity=".34" stroke-width=".7"/><circle cx="60" cy="90" r="41" stroke-opacity=".16" stroke-width=".5"/>
<path d="M30 90Q60 64 90 90Q60 116 30 90Z" stroke-width="1.3"/><circle cx="60" cy="90" r="9.5" stroke-width="1.1"/><path d="M60 82.5V97.5" stroke-width="2"/>
<path d="M60 54V22M60 126V158" stroke-opacity=".45" stroke-width=".7"/>
<path d="M60 14l2.2 6 6 2.2-6 2.2-2.2 6-2.2-6-6-2.2 6-2.2zM60 150l2.2 6 6 2.2-6 2.2-2.2 6-2.2-6-6-2.2 6-2.2z" stroke-opacity=".8" stroke-width=".8"/>
<path d="M36 70l-8-9M84 70l8-9M36 110l-8 9M84 110l8 9M24 90H14M96 90h10" stroke-opacity=".4" stroke-width=".7"/>
</g></svg>`;
  document.documentElement.style.setProperty('--back', `url("data:image/svg+xml,${encodeURIComponent(BACK)}")`);

  /* 桌面上那一层会转的细刻度：两圈，落在画上那几道宽带的当中（画上的圈是手画的、不很圆，细线不去描它）。TR 是桌子的半径，样式里写的也是它 */
  const TILT = 58, TR = 740, tbl = $('#tbl'), ringEl = $('#pring');
  (() => {
    const c = 'rgba(214,228,240,', R1 = TR * .623, R2 = TR * .869, R3 = TR * .943, f = v => v.toFixed(1);
    let s = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="${-TR} ${-TR} ${TR * 2} ${TR * 2}" width="${TR * 2}" height="${TR * 2}"><g fill="none">`;
    for (const [r, w, o] of [[R1, 1.3, .3], [R1 + 12, 1, .14], [R2, 1.4, .28], [R2 + 12, 1, .13]])
      s += `<circle r="${f(r)}" stroke="${c}${o})" stroke-width="${w}"/>`;
    for (let d = 0; d < 360; d += 5) {
      const L = d % 30 === 0 ? 30 : 11, a = d * RAD;
      s += `<line x1="${f(Math.sin(a) * R1)}" y1="${f(Math.cos(a) * R1)}" x2="${f(Math.sin(a) * (R1 - L))}" y2="${f(Math.cos(a) * (R1 - L))}" stroke="${c}.26)" stroke-width="1.1"/>`;
    }
    for (let d = 0; d < 360; d += 3) {
      const L = d % 15 === 0 ? 24 : 9, a = d * RAD;
      s += `<line x1="${f(Math.sin(a) * R2)}" y1="${f(Math.cos(a) * R2)}" x2="${f(Math.sin(a) * (R2 - L))}" y2="${f(Math.cos(a) * (R2 - L))}" stroke="${c}.22)" stroke-width="1.1"/>`;
    }
    for (let d = 0; d < 360; d += 30) {      /* 外圈上十二颗四角的小星 */
      const a = d * RAD, x = Math.sin(a) * R3, y = Math.cos(a) * R3, k = d % 90 === 0 ? 10 : 6.5, n = k * .22;
      s += `<path d="M${f(x)} ${f(y - k)}L${f(x + n)} ${f(y - n)}L${f(x + k)} ${f(y)}L${f(x + n)} ${f(y + n)}L${f(x)} ${f(y + k)}L${f(x - n)} ${f(y + n)}L${f(x - k)} ${f(y)}L${f(x - n)} ${f(y - n)}Z" fill="${c}.36)"/>`;
    }
    ringEl.innerHTML = s + '</g></svg>';
  })();
  const cam = { th: 0, k: 1 };

  /* ---------- 四张牌 ---------- */
  const CEN_Y = 600, PUSH_S = 2.195, PUSH_Y = 622;
  const heroBox = $('#heroes');
  const heroes = ERAS.map((era, i) => {
    const b = document.createElement('div');
    b.className = 'hero';
    const off = Math.max(0, Math.min(283, era.fx * 615 - 166));
    b.innerHTML = `<span class="hf back"><i style="background-image:url(assets/back_${i}.webp)"></i></span><span class="hf front"><span class="art" style="background-image:url(assets/era_${i}.webp);background-position:${-off.toFixed(1)}px 0"></span><span class="frame"></span>` +
      `<span class="plate"><span class="n">${era.num}</span><span class="t">${era.name}</span><span class="y">${era.years}</span></span><span class="sheen"></span></span>`;
    heroBox.appendChild(b);
    const sh = document.createElement('div'); sh.className = 'hsd'; $('#shadows').appendChild(sh);
    return { el: b, sh, x: 512, y: 1900, s: .34, rzs: 0, rx: 0, rzp: 0, ry: 180, a: 0, lift: 0, wob: 0, held: false, shOn: 1 };
  });
  /* 甩牌那几帧的拖影：两片只有牌背的薄片 */
  const ghosts = [0, 1].map(() => { const d = document.createElement('div'); d.className = 'ghost'; heroBox.appendChild(d); return d; });

  /* ---------- 四条画带 ---------- */
  /* 画带是斜着切的：左边比右边低 SL。四条从 BY0 排到 BY1，中间留 GAP 的缝；点中的那一条撑高，别的让开 */
  const SL = 90, GAP = 8, BY0 = -70, BY1 = 1340, H_EQ = (BY1 - BY0 - GAP * 3) / 4, H_SEL = 640, H_OFF = (BY1 - BY0 - GAP * 3 - H_SEL) / 3;
  const bandBox = $('#bands'), seamBox = $('#seams');
  const bands = ERAS.map((era, k) => {
    const b = document.createElement('button');
    b.type = 'button'; b.className = 'band'; b.setAttribute('aria-label', era.name); b.style.setProperty('--bt', era.tint);
    b.innerHTML = `<span class="bimg"><span class="bart" style="background-image:url(assets/era_${k}.webp);background-position:${(era.fx * 100).toFixed(0)}% ${(era.fy * 100).toFixed(0)}%"></span><span class="bscrim"></span>` +
      `<span class="btxt"><span class="n">${era.num}</span><span class="t">${era.name}</span><span class="y">${era.years}</span><span class="b">${era.line}</span></span><span class="bshade"></span></span><span class="bring"></span>`;
    bandBox.appendChild(b);
    b.addEventListener('click', () => tap(k));
    let seam = null;
    if (k > 0) { seam = document.createElement('i'); seam.className = 'seam'; seam.style.animationDelay = (-k * .5) + 's'; seamBox.appendChild(seam); }
    return { el: b, img: b.querySelector('.bimg'), ring: b.querySelector('.bring'), seam, y: BY0 + k * (H_EQ + GAP), h: H_EQ, cx: 512, cy: 200, open: false, anim: null };
  });
  const SEAM_ROT = -Math.atan(SL / 1024) / RAD;
  function bandTargets(sel) {
    let y = BY0;
    return bands.map((b, k) => { const h = sel < 0 ? H_EQ : k === sel ? H_SEL : H_OFF, t = { y, h }; y += h + GAP; return t; });
  }
  /* 画带上的那一圈火：开和合都是一个圆 */
  function clipTo(b, from, to, dur, ease) {
    if (b.anim) { b.anim.cancel(); b.anim = null; }
    b.img.style.clipPath = to;
    if (reduce || !from) return;
    b.anim = b.img.animate([{ clipPath: from }, { clipPath: to }], { duration: dur * SLOW, easing: ease });
  }
  const far = (b, cx, cy) => Math.hypot(Math.max(cx, 1024 - cx), Math.max(cy, b.h + SL - cy)) + 20;
  function openBand(k, cx, cy, dur = 950) {
    const b = bands[k]; b.cx = cx; b.cy = cy; b.open = true;
    clipTo(b, `circle(0px at ${cx}px ${cy}px)`, `circle(${far(b, cx, cy).toFixed(0)}px at ${cx}px ${cy}px)`, dur, 'cubic-bezier(.3,.55,.3,1)');
    ringAt(b, cx, cy, 9, dur * .8);
  }
  function closeBand(k, cx, cy, dur = 600) {
    const b = bands[k]; b.open = false; b.el.classList.remove('txt', 'live');
    clipTo(b, `circle(${far(b, b.cx, b.cy).toFixed(0)}px at ${b.cx}px ${b.cy}px)`, `circle(0px at ${cx}px ${cy}px)`, dur, 'cubic-bezier(.55,0,.7,.6)');
    b.cx = cx; b.cy = cy;
  }
  function ringAt(b, cx, cy, k, dur) {
    if (reduce) return;
    b.ring.style.left = cx + 'px'; b.ring.style.top = cy + 'px';
    b.ring.animate([{ opacity: 1, transform: 'scale(.1)' }, { opacity: .7, offset: .35 }, { opacity: 0, transform: `scale(${k})` }], { duration: dur * SLOW, easing: 'cubic-bezier(.2,.6,.3,1)' });
  }

    sTable.classList.add('on'); leak.classList.add('on'); topEl.classList.add('on');
    to(cam, { k: 1 }, 6000, E.out, me);
    await wait(1700); if (dead(me)) return;
    await say('「生者自有去处，亡魂也有归程。」');
    await wait(2500); if (dead(me)) return;
    say(''); await ready; if (dead(me)) return;
    await wait(520); if (dead(me)) return;
    await sweep(me); if (dead(me)) return;
    await split(me);
  }

  /* 她的手从左到右扫过桌面，手过去的地方留下一张牌，一共四张；扫完手抬起来，退出画面 */
  const slotX = k => VX0 + VW * (.15 + k * .2333), slotY = k => 918 + Math.sin((k + .5) / 4 * Math.PI) * 24;
  function leave(k, me) {
    const h = heroes[k], x = slotX(k), y = slotY(k);
    Object.assign(h, { x, y, s: .27, rx: TILT, rzp: (k - 1.5) * 7 + (k % 2 ? 4 : -3), rzs: 0, ry: 180, a: 1, lift: 0, shOn: 1 });
    h.el.style.zIndex = 5 + k;
    to(h, { s: .35 }, 300, E.back, me);
    to(ctl, { curl: .5 }, 90, E.out, me).then(() => to(ctl, { curl: 0 }, 320, E.io, me));     /* 指头往下点一下 */
    ripple(x, y + 6, true); burst(x, y, 9, '200,255,246', 2.6);
  }
  async function sweep(me) {
    /* 手臂的图只到上沿为止：手放大一点、少转一点，图的上沿才不会露进画面 */
    const x0 = VX0 - 230, x1 = VX1 + 260;
    Object.assign(hand, { x: x0, y: 912, r: 8, k: 1.12, a: 1, dip: 0, sh: 1, gl: 1 });
    let n = 0, spark = 0;
    await each(1900, t => {
      const e = E.sine(t), x = x0 + (x1 - x0) * e;
      hand.x = x; hand.y = 948 - Math.sin(e * Math.PI) * 46; hand.r = 8 - 16 * e; hand.dip = Math.sin(e * Math.PI) * 10;
      const now = nowMs();
      if (now - spark > 70 && x > VX0 && x < VX1) { spark = now; B.push({ x: x - 40 + (Math.random() - .5) * 70, y: hand.y + 16 + (Math.random() - .5) * 20, vx: -1.2 - Math.random(), vy: -.3 - Math.random() * .6, r: .8 + Math.random() * 1.6, life: 0, max: 30 + Math.random() * 30, c: '200,255,246' }); }
      while (n < 4 && x > slotX(n) + 70) leave(n++, me);
    }, me);
    if (dead(me)) return;
    Object.assign(hand, { a: 0, dip: 0, sh: 0, gl: 0 });
    await wait(260);
  }

  /* 四张牌从桌面上立起来，各自升到自己那一条的位置，烧开，把屏幕分成四块 */
  async function split(me) {
    const T = bandTargets(-1);
    heroes.forEach((h, k) => {
      later(() => {
        if (dead(me)) return;
        /* 画带是斜的，这一条在牌所在的那一竖上的正中 */
        to(h, { x: slotX(k), y: T[k].y + SL * (1 - slotX(k) / 1024) + T[k].h / 2, s: .4, rx: 0, rzp: 0, rzs: (k % 2 ? 4 : -4) }, 640, E.io, me);
        to(h, { lift: 1 }, 320, E.out, me).then(() => to(h, { lift: 0 }, 320, E.io, me));
      }, k * 90 * SLOW);
    });
    await wait(640 + 270 + 240); if (dead(me)) return;
    heroes.forEach(h => { h.shOn = 0; });
    for (let k = 0; k < 4; k++) { ignite(k, me); await wait(150); if (dead(me)) return; }
    await wait(820); if (dead(me)) return;
    enterChoose();
  }
  function ignite(k, me) {
    const h = heroes[k], b = bands[k];
    h.el.classList.add('lit');
    flash(.16, 360, EMBER); burst(h.x, h.y, 26, EMBER, 5.2);
    openBand(k, h.x, h.y - b.y, 980);
    later(() => { if (!dead(me)) { h.a = 0; h.el.classList.remove('lit'); } }, 120 * SLOW);
    later(() => { if (!dead(me)) b.el.classList.add('txt'); }, 520 * SLOW);
  }

  /* 四个纪元摆好，等人点。跳过开场、选完再选，也都落到这里 */
  function enterChoose(jump) {
    if (jump) {
      ++run; leaveEra(); resetTable();
      sTable.classList.add('on'); leak.classList.add('on');
      bands.forEach((b, k) => { b.cx = 512; b.cy = (b.h + SL) / 2; b.open = true; clipTo(b, `circle(0px at 512px ${b.cy}px)`, `circle(${far(b, 512, b.cy).toFixed(0)}px at 512px ${b.cy}px)`, 620 + k * 90, 'cubic-bezier(.3,.55,.3,1)'); b.el.classList.add('txt'); });
    }
    stage = 'choose'; sel = -1; mode = 'bands'; skipBtn.hidden = true; phase('ok');
    topEl.classList.add('quiet');     /* 四条画带铺满了，顶上那行小字先让开 */
    bands.forEach(b => b.el.classList.add('live')); seamBox.classList.add('on'); vig.classList.add('soft');
    say('四张牌，四个纪元。', '点一个纪元');
  }

  /* 点一下：这一条撑开，别的让开。再点一下选定 */
  function select(k) {
    if (stage !== 'choose') return;
    sel = k;
    const T = bandTargets(k);
    bands.forEach((b, j) => { to(b, T[j], 520, E.io); b.el.classList.toggle('off', j !== k); });
    say('', `${ERAS[k].name} · 再点一下，选定这一纪`);
  }
  function tap(k) {
    if (stage !== 'choose') return;
    if (sel !== k) return select(k);
    pick(k);
  }

  /* 选定：她的手从上面下来（拇指张着），食指、中指按在这一条上，这一条收回成牌、压在两指底下；拇指从牌底下扣上来，拿住；另外三条也变回牌飞走。
     牌在桌面上是倒着的（朝她那一头是正的）：手拿的始终是牌的同一头，举起来以后牌才是正的 */
  async function pick(k) {
    const me = ++run; stage = 'pick'; picked = k; phase('pick');
    const h = heroes[k], b = bands[k];
    say(''); seamBox.classList.remove('on'); mode = 'table'; topEl.classList.remove('quiet');
    bands.forEach(o => o.el.classList.remove('live'));
    ghosts.forEach(el => { el.style.backgroundImage = `url(assets/back_${k}.webp)`; });
    /* 指尖点在 (fx,fy)；指腹（牌粘着的那一点）比指尖靠里 TIP */
    const fx = 512, fy = clamp(b.y + 320, 430, 800), gy = fy - HOLD.tip * HOLD.kk * K_TABLE;       /* 按在这一条的当中；上面两条按得靠下一些，后面镜头少挪一点 */
    Object.assign(hold, { x: fx + 70, y: -320, th: TH_TABLE + 8, wb: WB_TABLE - 8, k: K_TABLE * 1.05, a: 1, gl: .9, idle: 0, fade: 0, ik: 0 });
    /* 下来的时候手是松的：两指微微张着、伸着，拇指张在一旁，无名指小指松松蜷着 */
    drop(ctl, 'hcurl', 'hpinch', 'hfold', 'hspread', 'hpress');
    Object.assign(ctl, { hcurl: -.1, hpinch: -.45, hfold: -.25, hspread: 4.5, hpress: 0 });
    to(hold, { wb: WB_TABLE }, 600, E.out, me);               /* 小臂先到，手腕跟着摆正 */
    later(() => { if (!dead(me)) to(ctl, { hcurl: -.32, hspread: 2.2 }, 170, E.io, me); }, 290 * SLOW);     /* 快到了：两指朝牌伸过去，伸得直直的 */
    await to(hold, { x: fx, y: gy, th: TH_TABLE, k: K_TABLE }, 480, E.quad, me); if (dead(me)) return;
    /* 指腹落到这一条上，钉住（hold.ik）：往后手指怎么动，指腹都不挪，动的是手掌和手腕。
       往下一压：指节一弓，两指并紧，手掌朝指尖沉下去一截，手腕跟着一塌，指尖底下那圈光亮一下。压完不松到底，留着劲 */
    hold.ik = 1; if (rigs) rigs.hold.kick = .006;
    to(ctl, { hcurl: .5, hpress: 1, hspread: -.2 }, 110, E.out, me).then(ok => { if (ok) to(ctl, { hcurl: .32, hpress: .6 }, 280, E.io, me); });
    to(hold, { k: K_TABLE * .97, gl: 1.5 }, 120, E.out, me).then(ok => { if (ok) to(hold, { gl: .9 }, 320, E.io, me); });
    to(hold, { th: TH_TABLE + 2, wb: WB_TABLE + 3 }, 380, E.io, me);
    ripple(fx, fy + 26, false); burst(fx, fy + 20, 16, '200,255,246');
    const c = cardAt(fx, gy, TH_TABLE + 2, K_TABLE * .97);      /* 牌收成以后牌心在哪：粘在两指的指腹底下 */
    closeBand(k, c[0], c[1] - b.y, 400);
    bands.forEach((o, j) => { if (j !== k) later(() => { if (!dead(me)) away(j, k, me); }, Math.abs(j - k) * 45 * SLOW); });
    await wait(340); if (dead(me)) return;
    Object.assign(h, { rx: 0, rzp: 0, ry: 180, a: 1, lift: 0, wob: 0, held: true, shOn: 0 }); h.el.style.zIndex = 20;
    h.el.classList.add('lit'); flash(.14, 300, EMBER); burst(c[0], c[1], 20, EMBER, 4.4);
    vig.classList.remove('soft');
    /* 捏住。照参考片，牌一立到指下只隔两帧手就走了，没有慢慢提、也没有蓄势。这两帧里拇指从牌底下扣上来，两指一磕、弓紧，无名指小指攥紧，整只手朝牌一紧，指尖底下亮一下 */
    if (rigs) rigs.hold.kick = .01;
    to(ctl, { hpinch: PINCH_GRAB, hpress: 1.1, hcurl: .44, hfold: .5 }, 80, E.out, me);
    to(hold, { k: K_TABLE * .955, gl: 1.4 }, 80, E.out, me);
    await wait(90); if (dead(me)) return;
    h.el.classList.remove('lit');
    bands.forEach(o => o.el.classList.remove('txt', 'off'));
    await raise(k, me);
  }
  /* 没选中的那几条：收成一张牌，翻着飞出去。要走得早、走得快：手带着牌甩起来的时候它们已经让开了 */
  function away(j, k, me) {
    const b = bands[j], h = heroes[j], x = 512 + (j - 1.5) * 60, y = b.y + (b.h + SL) / 2, sg = j < k ? -1 : 1;
    closeBand(j, x, y - b.y, 340);
    later(() => {
      if (dead(me)) return;
      Object.assign(h, { x, y, s: .42, rx: 0, rzp: 0, rzs: sg * 6, ry: 180, a: 1, lift: 0, held: false, shOn: 0 });
      burst(x, y, 10, EMBER, 3.4);
      to(h, { x: x + sg * (VW * .5 + 320), y: y - 260 - Math.abs(j - k) * 60, rzs: sg * 70, s: .3 }, 480, E.io, me).then(ok => { if (ok) h.a = 0; });
      to(h, { ry: 180 + sg * 360 }, 480, E.io, me);
    }, 290 * SLOW);
  }

  /* 提起来，不切镜头。镜头跟住手：黑底盖上来，桌面朝手这边推近、跟着挪开；手带着牌从下面经右边甩到上面，立住；背后的光亮起来；大字一闪，朝牌推进去，就是这一纪。牌不翻。
     第十四版起这一段是照参考片一帧一帧描的（参考_黑天鹅抽牌_逐帧.md）：
     没有蓄势，牌一离桌就起速，匀着转过大半，后三分之一慢下来，不过头；
     小臂领着，手落在后面（手腕朝后仰着），立住的时候小臂竖着从下面来，手在牌的正下方；
     手腕和牌在画面里对调：手腕先往上提，过了横着的那一下一头扎到左下，再顺到下面；牌从下面经右边到上面，最后停在手腕起头的地方；
     牌比手慢十来度（cw 那根弹簧），手停了它还要回荡一下 */
  async function raise(i, me) {
    const h = heroes[i], era = ERAS[i]; phase('void');
    setTint(era.tint); tintNow = era.tint;
    drop(hold, 'x', 'y', 'th', 'wb', 'k');
    const g0 = [hold.x, hold.y], w0 = wristAt(g0[0], g0[1], hold.th, hold.k);
    /* 镜头把提起来那一刻的手腕带到 ws：甩完手腕落在它下面五百八十五，牌心差不多就落在 ws 这里。选上面两条的取景高一些，不然镜头挪得太猛。桌面跟着一起挪，看起来是镜头在动 */
    const ws = [WS_X, clamp(w0[1] + 380, 500, 580)];
    /* 黑底盖上来用样式的过渡（在合成层上做，手机上才顺）；桌面跟着挪、推近是每一帧算的 */
    sVoid.style.transition = reduce ? '' : `opacity ${Math.round(340 * SLOW)}ms cubic-bezier(.65,0,.35,1)`; sVoid.classList.add('on'); leak.classList.remove('on');
    Object.assign(sc, { ox: g0[0], oy: g0[1] + 160, tx: 0, ty: 0, tk: 1 });
    to(sc, { tx: ws[0] - w0[0], ty: ws[1] - w0[1], tk: 1.2 }, 640, E.sine, me);
    to(hold, { gl: 0, fade: 1 }, 380, E.io, me);          /* 小臂往暗处化掉：黑底里亮着的只有手和牌 */
    later(() => { if (dead(me)) return; mode = 'void'; to(drift, { x: -3, y: 13 }, 200, E.io, me).then(ok => { if (ok) to(drift, { x: 0, y: 0 }, 700, E.out, me); }); }, 100 * SLOW);
    /* 甩 */
    drop(hold, 'x', 'y', 'th', 'wb');
    Object.assign(sw, { on: true, u: 0, p0: w0, th0: hold.th, th1: TH_END, wb0: hold.wb, wb1: WB_END });
    to(hold, { ik: 0 }, 90, E.io, me);          /* 指腹不钉了：手指和牌被甩在后面 */
    const swing = to(sw, { u: 1 }, 900, E.lin, me);
    /* 甩到横着的那一下手离镜头远一点（小一号，竖屏才装得下），立起来的时候迎上来 */
    to(hold, { k: .8 }, 300, E.io, me).then(ok => { if (ok) to(hold, { k: 1 }, 560, E.io, me); });
    /* 甩到最快的那一截手指被甩直，快立住了再扣回来 */
    to(ctl, { hcurl: -.12, hpress: .4 }, 260, E.io, me).then(ok => { if (ok) to(ctl, { hcurl: .1, hpress: .7 }, 420, E.io, me); });
    await wait(240); if (dead(me)) return;
    sTable.classList.remove('on'); sVoid.style.transition = '';
    await wait(260); if (dead(me)) return;
    /* 快立住了：背后的光亮起来，手开始慢慢飘，拇指松一点 */
    Object.assign(rays, { k: .45, a: 0 }); to(rays, { k: 1, a: .7 }, 800, E.out, me);
    to(hold, { idle: 1 }, 900, E.io, me); to(ctl, { hpinch: PINCH_HOLD, hspread: -.3, hfold: .2 }, 500, E.io, me);
    await wait(170); if (dead(me)) return;
    ripple(h.x, h.y, false, era.tint); burst(h.x, h.y, 14, era.tint, 4.2);
    if (!(await swing) || dead(me)) return;
    sw.on = false;
    to(hold, { k: 1.03 }, 900, E.out, me); to(ctl, { hpress: .5, hcurl: .06 }, 700, E.io, me);       /* 立住了，劲松下来一点 */
    await wait(300); if (dead(me)) return;

    /* 大字一闪，朝牌推进去 */
    stingPlay(era);
    await wait(230); if (dead(me)) return;
    Object.assign(zoomV, { cx: h.x, cy: h.y, k: 1 });
    to(zoomV, { k: 1.42 }, 430, E.in, me); to(rays, { k: 2.2, a: 0 }, 430, E.in, me);
    await wait(350); if (dead(me)) return;
    flash(.85, 420);
    await wait(70); if (dead(me)) return;

    /* 这一纪 */
    pan.src = `assets/era_${i}.webp`;
    const left = 512 - era.fx * 1350; pan.style.left = left.toFixed(1) + 'px';
    const lo = Math.min(0, 1024 - 1350 - left), hi = Math.max(0, -left);
    if (!reduce) panAnim = pan.animate([{ transform: 'translateX(0)' }, { transform: `translateX(${(lo * .9).toFixed(0)}px)`, offset: .58 }, { transform: `translateX(${(hi * .9).toFixed(0)}px)` }], { duration: 38000, iterations: Infinity, direction: 'alternate', easing: 'ease-in-out' });
    lock.querySelector('.n').textContent = era.num; lock.querySelector('.t').textContent = era.name;
    lock.querySelector('.y').textContent = era.years; lock.querySelector('.b').textContent = era.line;
    phase('era'); sEra.classList.add('on');
    await wait(120); if (dead(me)) return;
    lock.classList.add('on');
    await wait(500); if (dead(me)) return;
    h.a = 0; h.held = false; hold.a = 0; sVoid.classList.remove('on');
    await wait(900); if (dead(me)) return;
    say('', '往下是这一纪的书。小样到这里');
    acts.hidden = false; stage = 'done'; phase('ok');
  }
  function stingPlay(era) {
    sting.textContent = '';
    if (reduce) return;
    const put = [[-150, 60, 230], [330, 470, -260], [40, 880, 200]];
    [...era.name].forEach((ch, k) => {
      const b = document.createElement('b'); b.textContent = ch;
      b.style.left = put[k][0] + 'px'; b.style.top = put[k][1] + 'px';
      sting.appendChild(b);
      b.animate([{ opacity: 0, transform: 'translateX(0)' }, { opacity: .85, offset: .3 }, { opacity: .6, offset: .75 }, { opacity: 0, transform: `translateX(${put[k][2]}px)` }], { duration: 640, delay: k * 50, easing: 'cubic-bezier(.2,.6,.3,1)', fill: 'forwards' });
    });
  }

  $('#again').addEventListener('click', () => enterChoose(true));
  $('#restart').addEventListener('click', () => { say(''); intro(); });
  skipBtn.addEventListener('click', () => { if (stage === 'intro' && loaded) enterChoose(true); });

  /* 手指：带着各层挪一点 */
  view.addEventListener('pointermove', e => {
    const r = view.getBoundingClientRect();
    tx = ((e.clientX - r.left) / r.width - .5) * 2; ty = ((e.clientY - r.top) / r.height - .5) * 2; touched = nowMs();
  });
  window.__tb = {   /* 本地验的时候用 */
    tap, select, pick, intro, skip: () => enterChoose(true), get stage() { return stage; }, heroes, hand, cam, hold, bands, ctl, dbg, sw, cw, sc, zoomV, drift, tick, get rigs() { return rigs; },
    /* 把一只手摆在画面当中看骨骼：which 是 open、hold，后面是手腕、指节甩多少（弧度）、指头收多少、两指夹拢多少；card 给了就夹上那一纪的牌；th 是夹牌的那只手朝哪边 */
    pose: (which, wrist = 0, drag = 0, curl = 0, pinch = 0, card = -1, th = 0, wb = 0, fade = 0, fold = 0, spread = 0, press = 0) => {
      ++run; stage = 'test'; leaveEra(); resetTable(); sTable.classList.add('on'); mode = 'table';
      Object.assign(dbg, { on: true, wrist, drag, curl, pinch, fold, spread, press });
      if (which === 'hold') { sVoid.classList.add('on'); Object.assign(hold, { x: HX, y: HY, th, wb, fade, k: 1, a: 1 }); hand.a = 0; }
      else { sVoid.classList.remove('on'); hold.a = 0; Object.assign(hand, { x: 512, y: 900, r: 0, k: 1.1, a: 1, dip: 0, sh: 1, gl: 0 }); }
      if (card >= 0 && which === 'hold') { picked = card; Object.assign(heroes[card], { a: 1, rx: 0, rzp: 0, ry: 180, wob: 0, lift: 0, shOn: 0, held: true }); }
    },
    kick: v => { if (rigs) rigs.hold.kick = v; },
    sweepNow: () => { const me = ++run; stage = 'intro'; leaveEra(); resetTable(); sTable.classList.add('on'); leak.classList.add('on'); mode = 'table'; sweep(me).then(() => { if (!dead(me)) split(me); }); },
  };

  /* 图到了再往下走：桌面的图到了就亮场；手、牌背和四纪的画到齐了才发牌 */
  let loaded = false;
  const load = src => new Promise(res => { const im = new Image(); im.onload = im.onerror = res; im.src = src; });
  const tableReady = load('assets/table.webp'); tableReady.then(() => mark('table'));
  const need = ['assets/hand8_open.webp', 'assets/hand8_take.webp'];
  for (let i = 0; i < 4; i++) need.push(`assets/era_${i}.webp`, `assets/back_${i}.webp`);
  const ready = Promise.all(need.map(load)).then(() => { loaded = true; mark('assets'); return setupRigs(); }).then(() => { bootDone = true; });
  if (LITE) {
    const note = $('#note'); note.hidden = false;
    note.textContent = '轻量画法' + (crashAt ? ' · 上回停在「' + (STEP_NAME[crashAt] || crashAt) + '」' : '') + ' · 点这里换回完整画法';
    note.addEventListener('click', () => { store.set('tb_lite', ''); store.set('tb_crash', ''); store.set('tb_step', 'ok'); location.reload(); });
  }
  raf(frame);
  intro();
})();
</script>
