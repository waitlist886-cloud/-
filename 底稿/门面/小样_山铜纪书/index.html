<title>山铜纪的碑</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600;900&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#06070b; --pale:#ece5d6; --dim:rgba(236,229,214,.6); --line:rgba(236,229,214,.18);
  --ember:214,170,104; --gold:240,206,140; --dark:#2a2018;
  --serif:'Noto Serif SC','Songti SC','STSong','SimSun',serif;
  color-scheme:dark;
}
html,body{margin:0;height:100%;background:var(--ink);overflow:hidden}
body{color:var(--pale);font-family:var(--serif);-webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%}
#view{position:fixed;inset:0;overflow:hidden;background:#0b0c11;user-select:none;-webkit-user-select:none;touch-action:none;cursor:default}
#gl,#fx,#fxb{position:absolute;left:0;top:0;width:100%;height:100%;display:block;pointer-events:none}

/* 路边的碑和路当中走的两个人：一块碑一个立牌（gpt_cg3.py 抠的图），照远近缩放；离得远的叫雾吞掉一点 */
#actors{position:absolute;inset:0;z-index:0;overflow:hidden;pointer-events:none;--fog:#8a8a90;--stb:1}
.rs{position:absolute;left:0;top:0;width:240px;height:360px;transform-origin:0 0;pointer-events:auto;cursor:pointer;display:none;will-change:transform,opacity}
.rs img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;-webkit-user-drag:none;filter:brightness(var(--stb))}
.rs.o-w{width:360px;height:240px}
.rs .fog{position:absolute;inset:0;background:var(--fog);opacity:0;-webkit-mask-size:100% 100%;mask-size:100% 100%;-webkit-mask-repeat:no-repeat;mask-repeat:no-repeat;pointer-events:none}
.rs .sh,.wk .sh{position:absolute;left:14%;right:14%;height:6%;border-radius:50%;background:radial-gradient(closest-side,rgba(0,0,0,.55),rgba(0,0,0,0));pointer-events:none}
.rs .cssst{position:absolute;left:24%;right:24%;top:9%;bottom:6%;border-radius:48% 48% 3% 3%/24% 24% 3% 3%;background:var(--stc,linear-gradient(160deg,#6b5530,#3c2f19));box-shadow:inset 0 0 0 4px rgba(255,255,255,.08),inset 0 -30px 40px rgba(0,0,0,.25)}
@media (hover:hover) and (pointer:fine){.rs:hover img{filter:brightness(calc(var(--stb) * 1.16))}}
/* 有几张抠图底下和两边还连着一块画，立在路边边缘虚掉，不成一块方的 */
.rs.soft,.st.soft .f img{-webkit-mask-image:linear-gradient(90deg,transparent 0,#000 14%,#000 86%,transparent 100%),linear-gradient(180deg,#000 88%,transparent 100%);-webkit-mask-composite:source-in;mask-image:linear-gradient(90deg,transparent 0,#000 14%,#000 86%,transparent 100%),linear-gradient(180deg,#000 88%,transparent 100%);mask-composite:intersect}
.wk{position:absolute;left:0;top:0;width:200px;height:300px;transform-origin:0 0;pointer-events:none;display:none;will-change:transform,opacity}
/* 路边的景：一样一张透明底的图，跟碑一样照远近缩放，远了叫雾吞掉一点；fl 是左右翻过来的那一半 */
.pp{position:absolute;left:0;top:0;height:300px;transform-origin:0 0;pointer-events:none;display:none;will-change:transform,opacity}
.pp .im{position:absolute;inset:0;background-repeat:no-repeat;filter:brightness(var(--stb))}
.pp.fl .im,.pp.fl .fog{transform:scaleX(-1)}
.pp.nt .im{filter:none}
.pp .fog{position:absolute;inset:0;background:var(--fog);opacity:0;-webkit-mask-repeat:no-repeat;mask-repeat:no-repeat;pointer-events:none}
.wk img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;-webkit-user-drag:none;filter:brightness(var(--stb))}
.wk svg{position:absolute;inset:0;width:100%;height:100%}
/* 走到跟前，碑底下浮出年份和正名 */
#lbl{position:absolute;left:0;top:0;text-align:center;pointer-events:none;opacity:0;transition:opacity .45s;text-shadow:0 1px 10px rgba(0,0,0,.95),0 0 3px rgba(0,0,0,.8);white-space:nowrap;padding:12px 30px 13px;background:radial-gradient(closest-side,rgba(6,7,12,.74),rgba(6,7,12,.5) 58%,rgba(6,7,12,0))}
#lbl b::before,#lbl b::after{content:'';display:inline-block;vertical-align:middle;width:18px;height:1px;margin:0 10px .2em;background:linear-gradient(90deg,rgba(var(--gold),0),rgba(var(--gold),.7))}
#lbl b::after{background:linear-gradient(90deg,rgba(var(--gold),.7),rgba(var(--gold),0))}
#lbl.on{opacity:1}
#lbl small{display:block;font-size:11.5px;letter-spacing:.24em;color:rgb(var(--ember))}
#lbl b{display:block;margin-top:3px;font-weight:600;font-size:17px;letter-spacing:.18em;text-indent:.18em}
#lbl i{display:block;margin-top:3px;font-style:normal;font-size:11.5px;letter-spacing:.1em;color:var(--dim)}
#lbl em{display:block;margin-top:6px;font-style:normal;font-size:11px;letter-spacing:.3em;text-indent:.3em;color:rgba(236,229,214,.55)}
.wn{position:absolute;left:0;top:0;pointer-events:none;font-size:12.5px;letter-spacing:.32em;text-indent:.32em;color:rgba(236,229,214,.9);text-shadow:0 1px 8px rgba(0,0,0,.95),0 0 3px rgba(0,0,0,.8);opacity:0;transition:opacity .7s;white-space:nowrap}
.wn.on{opacity:1}
/* 一开头的几句，走起来就淡掉；走到头的那几句 */
#lead{position:absolute;left:max(22px,6vw);top:max(70px,12vh);width:min(26em,calc(100vw - 44px));pointer-events:none;text-shadow:0 1px 12px rgba(0,0,0,.9),0 0 3px rgba(0,0,0,.7);transition:opacity .6s}
#lead h2{margin:0;font-weight:900;font-size:clamp(30px,5.4vh,48px);letter-spacing:.34em}
#lead .line{margin:14px 0 0;font-size:clamp(16px,2.2vh,20px);font-weight:600;letter-spacing:.12em;line-height:1.75}
#lead .sub{margin:10px 0 0;font-size:12.5px;letter-spacing:.2em;opacity:.72}
#lead .how{margin:18px 0 0;padding-top:12px;border-top:1px solid rgba(236,229,214,.4);font-size:13px;letter-spacing:.08em;line-height:1.9;opacity:.82}
#endtx{position:absolute;left:0;right:0;top:max(70px,10vh);padding:0 22px;text-align:center;opacity:0;transition:opacity 1.6s .2s;pointer-events:none;text-shadow:0 2px 16px rgba(0,0,0,.95),0 0 4px rgba(0,0,0,.7)}
#endtx.show{opacity:1}
#endtx blockquote{margin:0;font-size:min(clamp(17px,2.6vh,24px),5vw);font-weight:600;letter-spacing:.16em;line-height:2.1;color:#f6e6c4}
#endtx p{margin:10px 0 0;font-size:13.5px;letter-spacing:.14em;line-height:1.9;opacity:.85}
#endtx .sub{margin-top:16px;font-size:12px;letter-spacing:.34em;text-indent:.34em;opacity:.72}
/* 路的尽头往下一本（11-23）：摆在地上那道金缝上头，左边一道竖着的小金缝，缝里的光一截一截往下沉，右边是下一纪的名字和牌桌上那一句；点它顺着缝下去，翻到迷宫纪那一本 */
#nextgo{all:unset;box-sizing:border-box;position:absolute;left:50%;bottom:calc(max(12px,env(safe-area-inset-bottom)) + 92px);z-index:2;transform:translate(-50%,8px);display:flex;align-items:center;gap:14px;padding:10px 22px 10px 16px;cursor:pointer;pointer-events:none;opacity:0;transition:opacity 1.4s .5s,transform 1.4s .5s;color:#f6e6c4;text-align:left;white-space:nowrap;background:radial-gradient(closest-side,rgba(14,10,8,.62),rgba(14,10,8,.38) 60%,rgba(14,10,8,0));text-shadow:0 2px 12px rgba(0,0,0,.95),0 0 3px rgba(0,0,0,.8);-webkit-tap-highlight-color:transparent}
#nextgo.show{opacity:1;transform:translate(-50%,0);pointer-events:auto}
#nextgo .dr{flex:none;width:24px;height:58px;filter:drop-shadow(0 0 5px rgba(255,200,90,.9)) drop-shadow(0 0 16px rgba(255,170,60,.55));transition:filter .5s,transform .5s}
#nextgo svg{display:block;width:100%;height:100%;overflow:visible}
#nextgo path{fill:none;stroke-linecap:round;stroke-linejoin:round}
#nextgo .g{stroke:rgba(255,214,120,.55);stroke-width:5}
#nextgo .c{stroke:#fff1c4;stroke-width:1.8;stroke-dasharray:14 10;animation:nx-sink 1.6s linear infinite}
#nextgo .tx{display:block}#nextgo small,#nextgo strong,#nextgo em{display:block}
#nextgo small{font-size:11px;letter-spacing:.4em;opacity:.75}
#nextgo strong{margin:3px 0 2px;font-weight:900;font-size:clamp(18px,2.6vh,22px);letter-spacing:.46em;line-height:1.2;color:#fbe9cc;text-shadow:0 0 20px rgba(255,190,90,.6),0 2px 12px rgba(0,0,0,.95)}
#nextgo em{font-style:normal;font-size:12px;letter-spacing:.12em;line-height:1.6;opacity:.9}
#nextgo:hover .dr,#nextgo:focus-visible .dr{filter:drop-shadow(0 0 8px rgba(255,220,120,1)) drop-shadow(0 0 28px rgba(255,180,70,.85));transform:scaleX(1.3)}
#nextgo:hover .c,#nextgo:focus-visible .c{animation-duration:.7s}
#nextgo:focus-visible{outline:1px solid rgba(255,214,150,.6);outline-offset:2px}
#view:has(#page.on) #nextgo,#view:has(#stv:not([hidden])) #nextgo{opacity:0;pointer-events:none}
@keyframes nx-sink{to{stroke-dashoffset:-48}}
@media (prefers-reduced-motion:reduce){#nextgo .c{animation:none}}
@media (max-height:500px){#nextgo{bottom:calc(max(12px,env(safe-area-inset-bottom)) + 40px)}#nextgo em{display:none}}

/* 钉在屏幕上的 */
#veil{position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse at 50% 46%,rgba(4,5,10,0) 56%,rgba(4,5,10,.42) 100%),linear-gradient(180deg,rgba(4,5,10,.38) 0,rgba(4,5,10,0) 13%,rgba(4,5,10,0) 82%,rgba(4,5,10,.42) 100%)}
#rift{position:absolute;inset:0;pointer-events:none;opacity:0;background:radial-gradient(70% 55% at 50% 92%,rgba(255,196,96,.34) 0,rgba(255,170,70,.12) 45%,rgba(255,170,70,0) 72%);mix-blend-mode:screen}
#top{position:absolute;left:max(18px,env(safe-area-inset-left));top:max(14px,env(safe-area-inset-top));display:flex;align-items:baseline;gap:14px;pointer-events:none;text-shadow:0 1px 10px rgba(0,0,0,.85)}
#top b{font-weight:900;font-size:19px;letter-spacing:.3em}
#top span{font-size:12.5px;letter-spacing:.24em;color:var(--dim)}
#part{position:absolute;left:0;right:0;top:max(52px,6vh);text-align:center;pointer-events:none;opacity:0;transform:translateY(-6px);transition:opacity .45s,transform .45s;text-shadow:0 2px 18px rgba(0,0,0,.95),0 0 4px rgba(0,0,0,.6)}
#part.on{opacity:1;transform:none}
#part b{display:block;font-weight:900;font-size:clamp(22px,3.4vh,34px);letter-spacing:.4em;text-indent:.4em}
#part span{display:block;margin-top:6px;font-size:12px;letter-spacing:.3em;text-indent:.3em;color:rgba(236,229,214,.8)}
#rail{position:absolute;left:0;right:0;bottom:max(12px,env(safe-area-inset-bottom));display:flex;justify-content:center;gap:12px;pointer-events:none}
#rail .grp{position:relative;display:flex;gap:3px;padding-bottom:18px;pointer-events:auto}
#rail .grp::after{content:attr(data-n);position:absolute;left:50%;bottom:0;transform:translateX(-50%);font-size:10.5px;letter-spacing:.24em;color:var(--dim);white-space:nowrap;opacity:0;transition:opacity .4s}
#rail .grp.cur::after{opacity:1}
#rail button{all:unset;box-sizing:border-box;width:8px;height:22px;cursor:pointer;position:relative}
#rail button::before{content:'';position:absolute;left:3px;right:3px;bottom:0;height:9px;background:rgba(236,229,214,.3);transition:height .25s,background .25s}
#rail button.seen::before{background:rgba(var(--ember),.8)}
#rail button.cur::before{height:20px;background:var(--pale)}
#rail button:focus-visible{outline:1px solid var(--pale);outline-offset:1px}
#hint{position:absolute;left:0;right:0;bottom:calc(max(12px,env(safe-area-inset-bottom)) + 58px);margin:0;text-align:center;font-size:12.5px;letter-spacing:.2em;color:rgba(236,229,214,.78);pointer-events:none;transition:opacity 1.2s;text-shadow:0 1px 8px rgba(0,0,0,.95)}
#hint.off{opacity:0}

/* 点开看灾祸的各阶：一个对手一张拼图，这里套一层框只露那一格（一格 2:3，跟原来的竖图一样：电脑上整格放下，手机上占满宽、上下拖着看） */
#cgv .pan>img[hidden],#cgv .cell[hidden]{display:none}
#cgv .cell{flex:none;margin:auto;position:relative;overflow:hidden;aspect-ratio:2/3;height:100%;max-width:100%}
#cgv .cell img{position:absolute;top:0;left:calc(var(--i,0) * -100%);width:calc(var(--n,1) * 100%);height:100%;max-width:none;max-height:none;margin:0}
@media (max-aspect-ratio: 1/1){#cgv .cell{height:auto;width:100%}}

/* 点开一块碑：碑面刻着正名和正面那几句，点一下翻到背面看名字 */
.st{position:absolute;perspective:1100px}
#stv{position:absolute;inset:0;z-index:7;display:flex;align-items:center;justify-content:center;background:rgba(3,4,8,.74);opacity:0;transition:opacity .3s;padding:max(18px,env(safe-area-inset-top)) 18px max(18px,env(safe-area-inset-bottom));box-sizing:border-box}
#stv.on{opacity:1}
#stv[hidden]{display:none}
#stv .box{display:flex;align-items:center;gap:clamp(20px,4vw,60px);max-width:100%}
#stv .stage{position:relative;flex:none}
#stv .stage .st{position:relative;width:100%;height:100%;cursor:pointer}
#stv .cap{max-width:24em}
#stv .cap small{display:block;font-size:12px;letter-spacing:.24em;color:rgb(var(--ember))}
#stv .cap h3{margin:8px 0 0;font-weight:900;font-size:clamp(26px,4.2vh,38px);letter-spacing:.2em;line-height:1.35}
#stv .cap .was{margin:8px 0 0;font-size:13px;letter-spacing:.08em;color:var(--dim)}
#stv .cap p{margin:12px 0 0;font-size:13.5px;line-height:1.95;letter-spacing:.04em;color:rgba(236,229,214,.78)}
#stv .cap .tip{font-size:12px;letter-spacing:.24em;color:var(--dim)}
#stv .btns{display:flex;gap:10px;margin-top:20px;flex-wrap:wrap}
#stv .btns button{all:unset;cursor:pointer;padding:10px 18px;border:1px solid var(--line);font-size:13px;letter-spacing:.32em;text-indent:.32em;background:rgba(4,5,10,.5)}
#stv .btns button.go{background:var(--pale);color:var(--ink);font-weight:600;border-color:var(--pale)}
#stv .btns button:focus-visible{outline:1px solid rgb(var(--ember));outline-offset:2px}
@media (max-aspect-ratio: 1/1){
  #stv{align-items:flex-start;overflow-y:auto}
  #stv .box{flex-direction:column;gap:12px;margin:auto}
  #stv .cap{text-align:center}
  #stv .cap p:not(.was){display:none}
  #stv .btns{justify-content:center;margin-top:14px}
}
.st .sh{position:absolute;left:14%;right:14%;bottom:4%;height:6%;border-radius:50%;background:radial-gradient(closest-side,rgba(0,0,0,.6),rgba(0,0,0,0))}
.st .flip{position:absolute;inset:0;transform-style:preserve-3d;transition:transform 1s cubic-bezier(.3,.75,.25,1)}
.st.turn .flip{transform:rotateY(180deg)}
.st .f{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden}
.st .f.bk{transform:rotateY(180deg)}
.st img{display:block;width:100%;height:100%;object-fit:contain;-webkit-user-drag:none}
.st .f.bk img.mir{transform:scaleX(-1)}
/* 没有图的时候：照材料拿 CSS 画一块碑 */
.st .cssst{position:absolute;left:24%;right:24%;top:9%;bottom:9.5%;border-radius:48% 48% 3% 3%/24% 24% 3% 3%;background:var(--stc,linear-gradient(160deg,#6b5530,#3c2f19));box-shadow:inset 0 0 0 4px rgba(255,255,255,.08),inset 0 -30px 40px rgba(0,0,0,.25)}
/* 11-14 碑形：上面是碑的图，下面一块碑牌，点一下碑牌翻面 */
.st.mon{display:flex;flex-direction:column}
.st.mon .mimg{position:relative;flex:1 1 auto;min-height:0}
.st.mon .mimg img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;object-position:50% 100%}
.st.mon .plq{position:relative;flex:none;height:33%;margin:3% 7% 0;perspective:900px}
.st.mon.o-w .plq{height:36%;margin-left:12%;margin-right:12%}
.st.mon .plq .f{border-radius:3px;background:var(--stc);box-shadow:inset 0 0 0 2px rgba(255,255,255,.1),inset 0 0 0 6px rgba(0,0,0,.16),0 8px 18px rgba(0,0,0,.45)}
.st.mon .face{inset:10% 7% 9%}
.st.mon.tiny .plq{height:22%}.st.mon.tiny .fr .face{justify-content:center}.st.mon.tiny .fr .face .tt{margin:0}      /* 时代页那一排小碑。原来叫 mini，跟共用那一份里小地图的类名（.mini）撞了，11-15 改叫 tiny */
.srow figure.o-w{width:300px}.srow .st.o-w{width:300px}
.st .cssst::after{content:'';position:absolute;left:-14%;right:-14%;bottom:-7%;height:7%;background:inherit;border-radius:2px;filter:brightness(.85)}
.k-bronze{--stc:linear-gradient(160deg,#7d6537 0,#5a4626 55%,#3c2f1a 100%);--eng:rgba(42,28,10,.8);--hi:rgba(255,226,170,.32);--sh:rgba(0,0,0,.35)}
.k-white,.k-boundary{--stc:linear-gradient(160deg,#ece8de 0,#cfcac0 60%,#b4afa5 100%);--eng:rgba(74,68,60,.74);--hi:rgba(255,255,255,.75);--sh:rgba(0,0,0,.18)}
.k-obsidian{--stc:linear-gradient(160deg,#2d2838 0,#16131d 60%,#0c0a10 100%);--eng:rgba(168,156,190,.6);--hi:rgba(255,255,255,.12);--sh:rgba(0,0,0,.8)}
.k-stone{--stc:linear-gradient(160deg,#a9a69e 0,#86837c 60%,#66635d 100%);--eng:rgba(46,44,40,.72);--hi:rgba(255,255,255,.4);--sh:rgba(0,0,0,.25)}
.f.bk.k-obsidian,.k-boundary .f.bk{--eng:rgba(168,156,190,.6);--hi:rgba(255,255,255,.12);--sh:rgba(0,0,0,.8)}
.face{position:absolute;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;text-align:center;overflow:hidden;font-size:var(--fs,11px);color:var(--eng);text-shadow:0 1px 0 var(--hi),0 -1px 0 var(--sh);pointer-events:none}
.face .tt{display:block;font-weight:900;font-size:1.8em;letter-spacing:.24em;text-indent:.24em;line-height:1.3;margin:.2em 0 .45em}
.face .tt b{display:block;white-space:nowrap;font-weight:inherit}
.face .bl{display:block;font-weight:600;font-size:1em;line-height:1.66;letter-spacing:.06em;margin:0 0 .3em}
.face .nt{display:block;font-size:.82em;opacity:.7;letter-spacing:.1em;margin:0 0 .5em}
.face.b .bl{line-height:1.5;letter-spacing:.02em;margin:0 0 .22em}
.face.raised{color:rgba(232,204,150,.62);text-shadow:0 1px 1px rgba(0,0,0,.7),0 -1px 0 rgba(255,240,200,.18)}
.face.blank{justify-content:center}
.face.blank .bl{opacity:.0}
.face::before{content:'';position:absolute;inset:0;background:linear-gradient(100deg,rgba(255,226,170,0) 38%,rgba(255,226,170,.28) 50%,rgba(255,226,170,0) 62%);background-size:260% 100%;background-position:120% 0;opacity:0;pointer-events:none}
.st.lit .face::before{opacity:1;animation:sweep 2.6s .15s ease-out 1 forwards}
@keyframes sweep{from{background-position:120% 0}to{background-position:-30% 0}}
/* 进来的那一下 */
#intro{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;background:var(--ink);transition:opacity 1.5s;cursor:pointer}
#intro.off{opacity:0;pointer-events:none}
#intro small{font-size:13px;letter-spacing:.5em;color:var(--dim);margin-right:-.5em}
#intro h1{margin:0;font-weight:900;font-size:clamp(46px,9vh,88px);letter-spacing:.42em;margin-right:-.42em}
#intro p{margin:0;font-size:15px;letter-spacing:.34em;color:var(--dim);margin-right:-.34em}
#intro *{opacity:0;animation:rise 1.4s forwards}
#intro h1{animation-delay:.25s}#intro p{animation-delay:.7s}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

/* 时代页 */
#page{position:absolute;inset:0;background:radial-gradient(120% 90% at 30% 40%,#0e0f16 0,#06070b 70%);opacity:0;transform:translateY(18px);transition:opacity .4s,transform .4s;overflow:hidden}
#page.on{opacity:1;transform:none}
#page[hidden]{display:none}
#pg-wrap{position:absolute;inset:0;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;touch-action:pan-y}
#pg-art{position:relative;height:56vh;overflow:hidden;background:var(--phbg,linear-gradient(170deg,#2b2a33,#0b0b10))}
#pg-art img{width:100%;height:100%;object-fit:cover;object-position:50% 30%;display:block}
#pg-art img:not([src]){display:none}
#pg-art::after{content:'';position:absolute;inset:0;background:linear-gradient(180deg,rgba(4,5,10,.25) 0,rgba(4,5,10,0) 30%,rgba(4,5,10,0) 55%,rgba(4,5,10,.96) 100%)}

.go{all:unset;box-sizing:border-box;display:block;margin:24px 0 0;padding:13px 0;width:100%;text-align:center;cursor:pointer;font-size:14px;font-weight:600;letter-spacing:.5em;text-indent:.5em;color:var(--ink);background:var(--pale)}

/* 世界之书抽成了 共用/ 里的一份，四本书和牌桌共用（11-15 拼装那一轮）。单独打开这一本的时候，common/ 是这一本目录里那一份（共用/sync.py 拷进来的）；

document.write('<link rel="stylesheet" href="' + A('common/codex.css') + '"><script src="' + A('common/codex.js') + '"><\/script>');
document.write('<link rel="stylesheet" href="' + A('common/library.css') + '"><script src="' + A('common/library.js') + '"><\/script>');      // 11-24 大图书馆（右上角那一枚开它）

<script>
'use strict';
/* 数据是几份跟页面放在一起的文件：六页的字（build_data.py 从六页源稿和碑第一版里抽的），哪一幅原画配在哪一幕，人像拼图，
   路上的碑位表和年份（make_road.py），路尽头的天（h1..h7），路当中走的两个人，碑面的框；
   11-15 介绍页收尾添一份短卡片（底稿/门面/卡片/山铜纪/，共用/prep_cards.py 出，没写到的时代照旧用原来那一套），世界之书和地图在 common/ */
const J = (u, dflt) => fetch(u).then((r) => (r.ok ? r.json() : dflt)).catch(() => dflt);
Promise.all([
  fetch('data/bronze.json').then((r) => r.json()),
  J('data/cg.json', {}), J('data/have.json', {}), J('data/pa.json', {}),
  fetch('data/road.json').then((r) => r.json()),
  J('data/sky.json', {}), J('data/walk.json', {}), J('data/stele.json', {}),
  J('data/tex.json', {}), J('data/props.json', {}),
  J('data/cards.json', {}),
]).then((a) => main(...a)).catch((e) => {
  console.error(e);
  const p = document.createElement('p');
  p.textContent = '这一页的数据没有载下来，刷新一下再试。';
  p.style.cssText = 'position:fixed;inset:0;z-index:9;display:flex;align-items:center;justify-content:center;margin:0;background:#06070b;color:#ece5d6;font-size:14px;letter-spacing:.2em';
  document.body.appendChild(p);
});

function main(D, CG, HV, PA, RD, SKY, WALK, SJ, TXJ, PRJ, CARDS) {
CARDS = CARDS || {};
const ERAS = D.eras, N = ERAS.length;
const VOL = 'bronze', JI = '山铜纪';        // 世界之书里这一卷的 id，跟外壳说话时报的纪名
/* 共用的那一份（common/codex.js）要是没载下来，书照样能走，只是没有世界之书和小地图 */
const Codex = window.Codex || { missing: true, init: () => Promise.resolve(), open() {}, close() {}, isOpen: () => false, mini: () => '', miniClick: () => false, syncSpoil() {}, state: { open: false, vol: '', page: '', vols: [], maps: [] } };
const HAVE = new Set((HV && HV.ps) || []), HGOD = new Set((HV && HV.god) || []);
const BOSS = (HV && HV.boss && !Array.isArray(HV.boss)) ? HV.boss : {};      // 灾祸：一个对手一张拼图，{一阶的键: {n 几格, p 各是第几阶, v}}
const BOX = (SJ && SJ.box) || {}, TPLOF = (SJ && SJ.tpl) || {};
const LIGHT = ['#8e8c8a', '#5c5a66', '#1c1e2c', '#141624', '#1a1626', '#2a1a1e', '#251e22', '#3c3342', '#8f8270', '#b9b39f', '#c3a26a', '#4a3b2c'];   // 时代页没有原画的时候垫的底色，一页两格
const Q = new URLSearchParams(location.search);
const SIM = Q.has('sim'), SKIP = Q.has('skip') || SIM, NOGL = Q.has('nogl') || Q.has('lite');
const $ = (s) => document.querySelector(s);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const smooth = (a, b, v) => { const t = clamp((v - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };
const mix = (a, b, t) => a + (b - a) * t;
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
// 种族只显示括号前面那一截；写着“藏”的、写着“族不点”的（雨城不问的那两位）不显示，免得名单上一眼露底（11-15）
const raceShow = (r) => /藏|不点/.test(r || '') ? '' : String(r || '').replace(/（.*/, '');
const HOVER = window.matchMedia && matchMedia('(hover:hover) and (pointer:fine)').matches;
const SIDE = { west: '墙西', wall: '墙下', east: '墙东' };       // 这件事出在墙哪一边（墙上、两边都有份的那几件写墙下：碑立在墙脚，11-14 起不再立在墙头上）
const yearsText = (e) => '山铜纪 ' + e.years + ' 年';
const lineYear = (l, e) => (l.year ? l.year + ' 年' : e.years + ' 年');
const imgOf = (s, back) => {      // 碑的图：有它自己那一张就用，没有拿它那一种空碑样板顶着
  if (back && s.kind === 'boundary') return BOX.t_obsidian ? 't_obsidian' : '';
  if (s.art && BOX[s.art]) return s.art;
  const t = TPLOF[s.name];
  return t && BOX[t] ? t : '';
};
const boxOf = (key) => BOX[key] || { x: 0.25, y: 0.1, w: 0.49, h: 0.73, top: 0.11, foot: 0.93 };
/* 碑面的正名不从一个词当中断开：四个字以内一行排下，五个字以上照词分两行（十四家/之乱） */
const SPLIT = { 十四家之乱: ['十四家', '之乱'], 灰雨城之乱: ['灰雨城', '之乱'] };
function ttParts(n) {
  if (n.length <= 4) return [n];
  if (SPLIT[n]) return SPLIT[n];
  const k = n.lastIndexOf('之');
  if (k > 0 && k < n.length - 1) return [n.slice(0, k), n.slice(k)];
  const h = Math.ceil(n.length / 2); return [n.slice(0, h), n.slice(h)];
}
const ttHTML = (n) => `<span class="tt">${ttParts(n).map((x) => `<b>${esc(x)}</b>`).join('')}</span>`;
/* 碑面：刻正名和正面那几句；背面刻名字那一段。字是页面刻上去的，压暗的字加一道亮边 */
function faceHTML(s, back, key, plaque, nameOnly) {
  const b = boxOf(key || imgOf(s, back));
  const inset = b.w * 0.07, top = b.y + b.w * (2 / 3) * 0.36;     // 碑头是拱的，字从拱脚往下刻
  const st = `left:${((b.x + inset) * 100).toFixed(2)}%;top:${(top * 100).toFixed(2)}%;width:${((b.w - inset * 2) * 100).toFixed(2)}%;height:${((b.y + b.h - top - 0.02) * 100).toFixed(2)}%`;
  let h = '';
  if (!back) {
    if (s.ft !== false && s.name) h += ttHTML(s.name);
    if (nameOnly) h = s.name ? ttHTML(s.name) : '';
    else if (s.frontNote) h += `<span class="nt">${esc(s.frontNote)}</span>`;
    if (!nameOnly) h += (s.fl || [s.front]).filter(Boolean).map((x) => `<span class="bl">${esc(x)}</span>`).join('');

/* 墙面：一层一层错开的白石，墙脚脏一些，雨水从垛口往下淌出印子；夜里每隔九步一盏灯 */

/* 墙头：当中是走道；两边一排垛口，垛口顶跟墙一个石色，比走道高一截，垛口之间的缺口压暗 */

/* 墙台的侧面：跟墙一样的石头，两头的棱压暗，台顶下沿一道，一扇小窗（夜里亮） */

pgBody.addEventListener('keydown', (ev) => {
  const t = ev.target;
  if (ev.key !== 'Enter' && ev.key !== ' ') return;
  if (t.dataset && t.dataset.p) { ev.preventDefault(); openProf(t.dataset.p); }
  else if (t.classList && t.classList.contains('st')) { ev.preventDefault(); t.classList.toggle('turn'); }
});
pgBody.addEventListener('click', (ev) => {
  if (ev.target.closest('.spl')) { setSpoil(!SPOIL); return; }
  if (pageOpen >= 0 && Codex.miniClick(ev, ERAS[pageOpen].id)) return;
  const c = ev.target.closest('.cgb,.thumb[data-k]'); if (c) { showCG(+c.dataset.k); return; }
  const st = ev.target.closest('.srow .st'); if (st) { st.classList.toggle('turn'); return; }
  const who = ev.target.closest('[data-p]'); if (who) { openProf(who.dataset.p); return; }
  const b = ev.target.closest('.go'); if (!b) return;
  const e = ERAS.find((x) => x.id === b.dataset.e), l = e.lines[+b.dataset.l];
  // 装在牌桌外壳里：从这里进交给外壳去建档（task 是这一条的任务名，山铜纪的主线题头写的是它）
  if (window.SHELL) { SHELL.post({ t: 'enter', book: VOL, era: JI, at: e.id, title: e.title, line: l.name, year: l.year || e.years, ti: l.ti || '', task: l.task || '' }); return; }
  sheet.querySelector('.box').innerHTML = `<p class="eyebrow">记下了</p><h3>山铜纪 ${esc(lineYear(l, e))}　【${esc(l.task || l.name)}】</h3><p>${esc(l.ti || '')}</p><p class="note">往下是建档：在这一纪的墙下报上你是谁。这一段还没有接上，样张先到这里。</p><button>好</button>`;
  sheet.hidden = false;
});
sheet.addEventListener('click', (ev) => {
  if (ev.target !== sheet && !ev.target.closest('button')) return;
  sheet.hidden = true;
  if (window.SHELL && ev.target.closest('[data-free]')) enterFree();
});

/* ---------- 世界之书（11-15）：抽成了 common/codex.js，四本书和牌桌共用一份 ---------- */
const wbBtn = $('#wbBtn');
const openWB = (vol, pg, opts) => Codex.open(vol, pg, opts);
const closeWB = () => Codex.close();
function gotoEra(i) {        // 从世界之书的地图、从外壳进一个时代页：先把碑面、档案、大图、小纸收起来
  closeStele(); closeProf(); hideCG(); sheet.hidden = true;
  if (Codex.isOpen()) Codex.close();
  if (!started) begin();
  openEra(i);
}
function otherBook(vol, id) {          // 世界之书里点了别一纪的时代：装在外壳里交给外壳换书，单独打开的时候说一声
  if (window.SHELL) { SHELL.post({ t: 'goto', book: vol, at: id }); return; }
  sheet.querySelector('.box').innerHTML = '<p class="eyebrow">在另一本书里</p><h3>这一处是别的纪元的时代页</h3><p class="note">从牌桌换到那一纪的书，就能翻到这一页。</p><button type="button">知道了</button>';
  sheet.hidden = false;
}
Codex.init({
  vol: VOL, host: view, A: window.A,
  spoil: () => SPOIL, setSpoil: (v) => setSpoil(v),
  onOpen: () => { hideCG(); drag.on = false; wbOpen = true; }, onClose: () => { wbOpen = !!(window.Library && Library.isOpen()); last = 0; },
  onEra: (vol, id) => { if (window.Library) Library.close(true); const i = ERAS.findIndex((x) => x.id === id); if (vol === VOL && i >= 0) gotoEra(i); else otherBook(vol, id); },
}).then(() => { if (pageOpen >= 0 && !pgBody.querySelector('.mini') && (Codex.state.maps || []).includes(VOL)) redrawEra(); });      // 地图比时代页后到：补上“这一带”
/* ---------- 大图书馆（11-24）：右上角那一枚改开图书馆，落在这一纪的廊；图书馆里的地图室翻世界之书的地图（common/library.js） ---------- */
const Lib = window.Library || null;
if (Lib) Lib.init({ vol: VOL, host: view, A: window.A, spoil: () => SPOIL, setSpoil: (v) => setSpoil(v),
  openMap: (v) => Codex.open(v, 'map'),
  onOpen: () => { hideCG(); drag.on = false; wbOpen = true; }, onClose: () => { wbOpen = Codex.isOpen(); last = 0; } });
if (Codex.missing && !Lib) wbBtn.hidden = true;
else { wbBtn.querySelector('img').src = window.A('common/assets/ui/emblem_bronze.webp'); wbBtn.addEventListener('click', () => { touched(); if (Lib) Lib.open(VOL); else openWB(VOL, ''); }); }
/* 装在牌桌外壳里：左上角一个回牌桌的钮，外壳叫打开哪个时代页就打开（at 写 free 是走到无字碑跟前） */
function shellOpen(at) {
  const i = ERAS.findIndex((x) => x.id === at);
  if (i >= 0) { gotoEra(i); return; }
  if (at === 'free') { const j = STL.findIndex((t) => t.end); closeEra(); closeStele(); if (Codex.isOpen()) Codex.close(); if (!started) begin(); if (j >= 0) { go(j, true); reveal(j); } openEnd(); }
}
if (window.SHELL) {
  view.classList.add('in-shell');
  const tb = document.createElement('button');
  tb.id = 'toTable'; tb.type = 'button'; tb.textContent = '回到牌桌';
  tb.addEventListener('click', () => SHELL.post({ t: 'table' }));
  view.appendChild(tb);
  window.addEventListener('message', (ev) => {
    const m = ev.data || {};
    if (m.aldran && m.t === 'open') shellOpen(m.at);
  });
}

/* ---------- 开 ---------- */
function boot() {
  if (!layout()) return false;
  if (TXJ) for (const k in TXJ) txImg(k);
  if (!gl && !ctx2 && !initGL() && !ctx2) toFallback();
  if (Q.has('at')) { const i = clamp(+Q.get('at'), 0, NS - 1); go(i, true); }
  if (Q.has('z')) camZ = camZT = clamp(+Q.get('z'), 0, ZMAX);
  if (SKIP) { $('#intro').style.display = 'none'; begin(); }
  else setTimeout(begin, 2600);
  frame(16);
  if (Q.has('open')) { begin(); openEra(clamp(+Q.get('open'), 0, N - 1)); }
  if (!SIM) requestAnimationFrame(loop);
  return true;
}
let booted = boot();
if (window.SHELL && SHELL.at) setTimeout(() => shellOpen(SHELL.at), 400);          // 外壳带着地方进来的：直接翻到那一页
if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { if (stOpen >= 0) fitFaces(stStage); if (!page.hidden) fitFaces(pgBody); });
const onSize = () => { if (!booted) booted = boot(); else if (layout()) frame(0); };
if (window.ResizeObserver) new ResizeObserver(onSize).observe(view); else window.addEventListener('resize', onSize);

window.__bk = {
  get s() {
    const zn = camZ + P.dc;
    return { W, H, wide, F, AX, mode: MODE, camZ, camZT, ZMAX, ZS, ZG, ZMEET, frames, started, pageOpen, stOpen, focus: FOCUS,
      lbl: lbl.classList.contains('on') ? (lbl.querySelector('b') || {}).textContent : '', year: Math.round(yearAt(zn)), page: pageAt(zn),
      NS, seen: Array.from(seen).reduce((a, b) => a + b, 0), parts: parts.length, cam: { x: +P.x.toFixed(2), h: +P.h.toFixed(2), hz: Math.round(P.hzp), dc: +P.dc.toFixed(2) },
      where: $('#where').textContent };
  },
  tick(ms) { let n = Math.max(1, Math.round(ms / 16)); while (n--) frame(16); },
  go(i, fast) { go(i, fast !== false); frame(16); },
  z(v) { camZ = camZT = clamp(v, 0, ZMAX); frame(16); },
  stele: openStele, flip: flipBig, stvClose: closeStele, end: openEnd, open: openEra, close: closeEra, begin, prof: openProf, cg: showCG,
  openWB, closeWB, openProf, setSpoil, shellOpen, get wb() { const q = Codex.state; return { open: q.open, vol: q.vol, page: q.page, vols: q.vols, maps: q.maps, spoil: SPOIL, wbOpen }; },
  STL, RD,
  shown() { return STL.map((t, i) => (t.vis ? i : -1)).filter((i) => i >= 0); },
  walkers() { return WALKERS.filter((w) => w.vis).map((w) => w.key + ':' + (+w.el.style.opacity).toFixed(2)); },
  ready() {
    for (const t of STL) if (t.vis && t.img && !(t.img.complete && t.img.naturalWidth)) return false;
    for (const w of WALKERS) { const im = w.vis && w.el.querySelector('img'); if (im && !(im.complete && im.naturalWidth)) return false; }
    for (const q of PRP) if (q.vis && !imOK(atImg(q.a))) return false;
    if (gl && TXJ) for (const k of ['tx_road', 'tx_wall', PAL[PZN.a].gtex, PAL[PZN.b].gtex]) if (TXJ[k] && !imOK(txImg(k))) return false;
    const pz = palAt(camZ + 8);
    for (const k of [PAL[pz.a].sky, PAL[pz.b].sky]) if (SKY[k] && !imOK(skyImg(k))) return false;
    if (stOpen >= 0) for (const im of stStage.querySelectorAll('img')) if (!(im.complete && im.naturalWidth)) return false;
    return true;
  },
};
/* ---------- 图鉴（11-17）：common/atlas.js，一纪一本，人物点开借那一段的名单开档案 ---------- */
function openProfAt(id, name) {      // 图鉴里点人：不开时代页，档案盖在图鉴上面
  const i = ERAS.findIndex((x) => x.id === id); if (i < 0) return;
  profEra = i; if (!prof._home) prof._home = [prof.parentElement, prof.nextSibling];          // 11-25：档案原来长在时代页里头，时代页没开着时从图鉴点开量出来是 0×0，先挪到 view 底下盖在图鉴上，合上再挪回去
  if (prof.parentElement !== view) view.appendChild(prof);
  prof.classList.add('over'); openProf(name);
}
const atBtn = $('#atBtn');
function atPos() {            // 摆在世界之书那一枚的左手边
  const w = $('#wbBtn'), r = w ? w.getBoundingClientRect() : null, v = view.getBoundingClientRect();
  if (r && r.width) atBtn.style.right = Math.round(v.right - r.left + 16) + 'px';
}
if (window.Atlas) {
  Atlas.init({
    vol: VOL, host: view, A: window.A,
    spoil: () => SPOIL, setSpoil: (v) => setSpoil(v),
    curEra: () => (pageOpen >= 0 ? ERAS[pageOpen].id : null),
    openPerson: (id, name) => openProfAt(id, name),
    onEsc: () => (profOpen && prof.classList.contains('over') ? (closeProf(), true) : false),
    goEra: (id) => { const i = ERAS.findIndex((x) => x.id === id); if (i >= 0) gotoEra(i); },
  }).then((a) => { if (a.missing) atBtn.hidden = true; });
  atBtn.addEventListener('click', () => { if (typeof touched === 'function') touched(); Atlas.open(); });
  window.addEventListener('resize', atPos); atPos(); setTimeout(atPos, 600);
} else atBtn.hidden = true;
}
</script>
