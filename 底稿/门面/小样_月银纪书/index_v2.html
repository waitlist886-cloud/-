<title>月银纪的墙</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600;900&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#04050a; --pale:#ece5d6; --dim:rgba(236,229,214,.58); --line:rgba(236,229,214,.18);
  --ember:255,176,104; --silver:206,234,242; --dark:#261a12;
  --serif:'Noto Serif SC','Songti SC','STSong','SimSun',serif;
  color-scheme:dark;
}
html,body{margin:0;height:100%;background:var(--ink);overflow:hidden}
body{color:var(--pale);font-family:var(--serif);-webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%}
#view{position:fixed;inset:0;overflow:hidden;background:var(--ink);user-select:none;-webkit-user-select:none;touch-action:none;cursor:default}
#view canvas{position:absolute;left:0;top:0;width:100%;height:100%;display:block}
#fx{pointer-events:none}

/* 跟着墙一起走的字：三部的题、每幅画底下的名字 */
#strip{position:absolute;left:0;top:0;height:100%;width:0;will-change:transform;pointer-events:none}
.lab{position:absolute;text-align:center;opacity:.5;transition:opacity .5s}
.lab.on{opacity:1}
.lab small{display:block;font-size:12px;letter-spacing:.2em;opacity:.82}
.lab b{display:block;margin-top:7px;font-weight:600;font-size:22px;letter-spacing:.1em;line-height:1.25}
.lab i{display:block;margin-top:7px;font-style:normal;font-size:13.5px;letter-spacing:.06em;opacity:.78;line-height:1.5}
.lab.ink{color:var(--dark);text-shadow:0 0 14px rgba(255,244,222,.5)}
.lab.pale{text-shadow:0 1px 10px rgba(0,0,0,.9)}
.sec{position:absolute;display:flex;align-items:center;justify-content:center;gap:clamp(18px,3.2vw,44px);box-sizing:border-box;padding:0 28px}
.sec h2{margin:0;writing-mode:vertical-rl;font-weight:900;font-size:clamp(40px,7.4vh,72px);letter-spacing:.34em;line-height:1;flex:none}
.sec .tx{max-width:23em}
.sec .line{margin:0;font-size:clamp(18px,2.5vh,24px);font-weight:600;letter-spacing:.12em;line-height:1.7}
.sec .sub{margin:14px 0 0;font-size:12.5px;letter-spacing:.2em;opacity:.7}
.sec .desc{margin:18px 0 0;font-size:14.5px;line-height:2;letter-spacing:.05em;opacity:.84}
.sec .how{margin:26px 0 0;padding-top:16px;border-top:1px solid currentColor;font-size:13px;letter-spacing:.1em;line-height:1.9;opacity:.6}
.sec.ink{color:var(--dark)}
.sec.pale{text-shadow:0 1px 12px rgba(0,0,0,.9)}
.sec.ruin{flex-direction:column;gap:20px;text-align:center;opacity:0;transition:opacity 1.6s .5s}
.sec.ruin.show{opacity:1}
.sec.ruin blockquote{margin:0;font-size:clamp(19px,2.9vh,28px);font-weight:600;letter-spacing:.14em;line-height:1.9;color:#f3d9c2;text-shadow:0 0 26px rgba(255,90,30,.45)}
.sec.ruin p{margin:0;font-size:12.5px;letter-spacing:.2em;opacity:.62}
.sec.end{flex-direction:column;gap:18px;text-align:center;opacity:0;transition:opacity 1.6s 1s}
.sec.end.show{opacity:1}
.sec.end .line{font-size:clamp(18px,2.6vh,25px)}

/* 钉在屏幕上的 */
#top{position:absolute;left:max(18px,env(safe-area-inset-left));top:max(14px,env(safe-area-inset-top));display:flex;align-items:baseline;gap:14px;pointer-events:none;text-shadow:0 1px 10px rgba(0,0,0,.85)}
#top b{font-weight:900;font-size:19px;letter-spacing:.3em}
#top span{font-size:12.5px;letter-spacing:.24em;color:var(--dim)}
#rail{position:absolute;left:0;right:0;bottom:max(12px,env(safe-area-inset-bottom));display:flex;justify-content:center;gap:16px;pointer-events:none}
#rail .grp{position:relative;display:flex;gap:3px;padding-bottom:18px;pointer-events:auto}
#rail .grp::after{content:attr(data-n);position:absolute;left:0;right:0;bottom:0;text-align:center;font-size:10.5px;letter-spacing:.24em;color:var(--dim);white-space:nowrap}
#rail button{all:unset;box-sizing:border-box;width:8px;height:22px;cursor:pointer;position:relative}
#rail button::before{content:'';position:absolute;left:3px;right:3px;bottom:0;height:9px;background:rgba(236,229,214,.3);transition:height .25s,background .25s}
#rail button.seen::before{background:rgba(var(--ember),.7)}
#rail button.cur::before{height:20px;background:var(--pale)}
#rail button:focus-visible{outline:1px solid var(--pale);outline-offset:1px}
#hint{position:absolute;left:0;right:0;bottom:calc(max(12px,env(safe-area-inset-bottom)) + 58px);margin:0;text-align:center;font-size:12.5px;letter-spacing:.2em;color:var(--dim);pointer-events:none;transition:opacity 1.2s;text-shadow:0 1px 8px rgba(0,0,0,.9)}
#hint.off{opacity:0}

/* 进来的那一下 */
#intro{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;background:var(--ink);transition:opacity 1.5s;cursor:pointer}
#intro.off{opacity:0;pointer-events:none}
#intro small{font-size:13px;letter-spacing:.5em;color:var(--dim);margin-right:-.5em}
#intro h1{margin:0;font-weight:900;font-size:clamp(46px,9vh,88px);letter-spacing:.42em;margin-right:-.42em}
#intro p{margin:0;font-size:15px;letter-spacing:.34em;color:var(--dim);margin-right:-.34em}
#intro *{opacity:0;animation:rise 1.4s forwards}
#intro h1{animation-delay:.25s}#intro p{animation-delay:.7s}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

/* 时代页 */
#page{position:absolute;inset:0;background:radial-gradient(120% 90% at 30% 40%,#0c0d15 0,#04050a 70%);opacity:0;transform:translateY(18px);transition:opacity .4s,transform .4s;overflow:hidden}
#page.on{opacity:1;transform:none}
#page[hidden]{display:none}
#pg-wrap{position:absolute;inset:0;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;touch-action:pan-y}
#pg-art{position:relative;height:56vh;overflow:hidden}
#pg-art img{width:100%;height:100%;object-fit:cover;object-position:50% 30%;display:block}
#pg-art::after{content:'';position:absolute;inset:0;background:linear-gradient(180deg,rgba(4,5,10,.25) 0,rgba(4,5,10,0) 30%,rgba(4,5,10,0) 55%,rgba(4,5,10,.96) 100%)}
#pg-art.soft img{-webkit-mask-image:linear-gradient(to right,transparent,#000 10%,#000 90%,transparent),linear-gradient(to bottom,transparent,#000 8%,#000 92%,transparent);-webkit-mask-composite:source-in;mask-image:linear-gradient(to right,transparent,#000 10%,#000 90%,transparent),linear-gradient(to bottom,transparent,#000 8%,#000 92%,transparent);mask-composite:intersect}
#pg-body{position:relative;margin-top:-64px;padding-block:0 120px;padding-left:max(22px,env(safe-area-inset-left,0px));padding-right:max(22px,env(safe-area-inset-right,0px));max-width:760px;box-sizing:border-box}
#pg-close{all:unset;position:absolute;right:max(14px,env(safe-area-inset-right));top:max(12px,env(safe-area-inset-top));z-index:3;cursor:pointer;font-size:12.5px;letter-spacing:.22em;padding:9px 14px;border:1px solid var(--line);background:rgba(4,5,10,.6);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
#pg-close:focus-visible{outline:1px solid var(--pale)}
.eyebrow{margin:0;font-size:12.5px;letter-spacing:.26em;color:rgb(var(--ember))}
#pg-body h1,#pg-hd h1{margin:12px 0 0;font-weight:900;font-size:clamp(30px,5.2vh,46px);letter-spacing:.14em;line-height:1.3}
#pg-body .ti,#pg-hd .ti{margin:14px 0 0;font-size:18px;font-weight:600;letter-spacing:.12em;line-height:1.7}
#pg-body .desc,#pg-hd .desc{margin:16px 0 0;font-size:15.5px;line-height:2.05;letter-spacing:.05em;color:rgba(236,229,214,.86)}
#pg-body h2{margin:54px 0 0;padding-bottom:12px;border-bottom:1px solid var(--line);font-size:13px;font-weight:600;letter-spacing:.5em;color:var(--dim)}
.epic{margin:34px 0 0;padding:4px 0 4px 20px;border-left:2px solid rgba(var(--ember),.55)}
.epic h3{margin:0 0 12px;font-size:13px;font-weight:600;letter-spacing:.24em;color:rgb(var(--ember))}
.epic p{margin:0 0 10px;font-size:15.5px;line-height:2.05;letter-spacing:.04em;color:rgba(236,229,214,.9)}
.epic p.q{font-weight:600;margin-bottom:4px}
.epic p .src{font-size:11.5px;letter-spacing:.1em;color:var(--dim);margin-left:.6em;white-space:nowrap}
.epic .more{margin:14px 0 0;font-size:12px;letter-spacing:.18em;color:var(--dim)}
details.ln{margin:18px 0 0;border:1px solid var(--line);background:rgba(236,229,214,.035)}
details.ln>summary{list-style:none;cursor:pointer;padding:18px 20px;display:grid;grid-template-columns:auto 1fr;gap:4px 18px;align-items:baseline}
details.ln>summary::-webkit-details-marker{display:none}
details.ln>summary .yr{grid-row:1/3;font-size:13px;letter-spacing:.14em;color:rgb(var(--ember));white-space:nowrap;align-self:start;padding-top:5px}
details.ln>summary .tt{font-size:19px;font-weight:600;letter-spacing:.1em;line-height:1.55}
details.ln>summary .nm{font-size:12px;letter-spacing:.2em;color:var(--dim)}
details.ln[open]>summary{border-bottom:1px solid var(--line)}
.ln .in{padding:18px 20px 22px}
.ln .hook{margin:0 0 6px;font-size:16px;font-weight:600;line-height:1.9;letter-spacing:.06em;color:#f6e9d2}
.ln h4{margin:22px 0 8px;font-size:12px;font-weight:600;letter-spacing:.34em;color:var(--dim)}
.ln p.open{margin:0;font-size:15px;line-height:2;letter-spacing:.04em;color:rgba(236,229,214,.88)}
.ln ol{margin:0;padding:0;list-style:none}
.ln ol li{position:relative;padding:0 0 12px 22px;font-size:14.5px;line-height:1.85;letter-spacing:.04em;color:rgba(236,229,214,.8)}
.ln ol li::before{content:'';position:absolute;left:3px;top:.72em;width:7px;height:7px;transform:rotate(45deg);background:rgba(var(--ember),.8)}
.ln ol li::after{content:'';position:absolute;left:6px;top:1.5em;bottom:-.3em;width:1px;background:var(--line)}
.ln ol li:last-child::after{display:none}
.ln ol li b{font-weight:600;color:var(--pale);margin-right:.8em;letter-spacing:.1em}
details.end{margin:20px 0 0;border-top:1px dashed var(--line);padding-top:14px}
details.end>summary{cursor:pointer;font-size:13px;letter-spacing:.24em;color:var(--dim);list-style:none}
details.end>summary::-webkit-details-marker{display:none}
details.end>summary::after{content:'　揭开';color:rgb(var(--ember))}
details.end[open]>summary::after{content:'　合上'}
details.end p{margin:12px 0 0;font-size:14.5px;line-height:2;letter-spacing:.04em;color:rgba(236,229,214,.78)}
.go{all:unset;box-sizing:border-box;display:block;margin:24px 0 0;padding:13px 0;width:100%;text-align:center;cursor:pointer;font-size:14px;font-weight:600;letter-spacing:.5em;text-indent:.5em;color:var(--ink);background:var(--pale)}
.go:hover{background:#fff}
.go:focus-visible{outline:2px solid rgb(var(--ember));outline-offset:2px}
.cast{margin:20px -22px 0;padding:0 22px 8px;display:flex;gap:14px;overflow-x:auto;scroll-snap-type:x proximity;-webkit-overflow-scrolling:touch;touch-action:pan-x pan-y}
.cast figure{margin:0;flex:none;width:156px;scroll-snap-align:start}
.cast img{display:block;width:156px;height:234px;object-fit:cover;background:#12131a}
.cast .noimg{width:156px;height:234px;background:linear-gradient(160deg,#171922,#0b0c12);display:flex;align-items:center;justify-content:center;font-size:38px;font-weight:900;color:rgba(236,229,214,.16)}
.cast figcaption b{display:block;margin-top:10px;font-size:15.5px;font-weight:600;letter-spacing:.1em}
.cast figcaption span{display:block;margin-top:3px;font-size:11.5px;letter-spacing:.18em;color:rgb(var(--ember))}
.cast figcaption p{margin:6px 0 0;font-size:12.5px;line-height:1.75;color:rgba(236,229,214,.72)}
.beast{margin:18px 0 0;padding:16px 20px;border:1px solid rgba(255,96,64,.28);background:rgba(255,80,40,.05)}
.beast small{font-size:12px;letter-spacing:.24em;color:#f08a6c}
.beast b{display:block;margin-top:6px;font-size:18px;font-weight:600;letter-spacing:.1em}
.beast p{margin:8px 0 0;font-size:14px;line-height:1.9;color:rgba(236,229,214,.8)}
ul.places{margin:18px 0 0;padding:0;list-style:none;display:grid;grid-template-columns:1fr;gap:0}
ul.places li{padding:13px 0;border-bottom:1px solid var(--line);display:grid;grid-template-columns:auto 1fr;gap:2px 14px;align-items:baseline}
ul.places b{font-size:15.5px;font-weight:600;letter-spacing:.08em}
ul.places span{font-size:11.5px;letter-spacing:.18em;color:var(--dim)}
ul.places p{grid-column:1/3;margin:2px 0 0;font-size:13px;line-height:1.8;color:rgba(236,229,214,.7)}
ul.places em{grid-column:1/3;font-style:normal;font-size:12px;letter-spacing:.1em;color:rgb(var(--ember))}
.songs{margin:18px 0 0;font-size:14.5px;line-height:2.1;letter-spacing:.1em;color:rgba(236,229,214,.82)}
#sheet{position:absolute;inset:0;display:flex;align-items:flex-end;justify-content:center;background:rgba(0,0,0,.55);z-index:5}
#sheet[hidden]{display:none}
#sheet .box{width:min(560px,100%);box-sizing:border-box;padding:26px 26px calc(26px + env(safe-area-inset-bottom));background:#0d0e15;border-top:1px solid var(--line)}
#sheet h3{margin:10px 0 0;font-size:20px;font-weight:600;letter-spacing:.1em;line-height:1.6}
#sheet p{margin:10px 0 0;font-size:14px;line-height:1.9;color:rgba(236,229,214,.78)}
#sheet .note{color:var(--dim);font-size:12.5px;letter-spacing:.06em}
#sheet button{all:unset;display:block;box-sizing:border-box;width:100%;margin-top:20px;padding:12px 0;text-align:center;cursor:pointer;border:1px solid var(--line);font-size:13.5px;letter-spacing:.4em;text-indent:.4em}
#sheet button:focus-visible{outline:1px solid var(--pale)}

/* 三类人：旅伴、相遇、传奇 */
.def{margin:12px 0 0;font-size:13px;line-height:1.95;letter-spacing:.06em;color:var(--dim)}
.cast.lg figure{width:112px}
.cast.lg img,.cast.lg .noimg{width:112px;height:168px}
.cast.lg .noimg{font-size:28px}
.cast.lg figcaption b{font-size:14.5px}
.cast.lg figcaption i{display:block;margin-top:3px;font-style:normal;font-size:11px;letter-spacing:.2em;color:var(--dim)}
ul.meet{margin:18px 0 0;padding:0;list-style:none;display:grid;grid-template-columns:1fr;gap:0 34px}
ul.meet li{display:grid;grid-template-columns:54px 1fr;gap:2px 14px;align-content:start;padding:13px 0;border-bottom:1px solid var(--line)}
ul.meet li.np{grid-template-columns:1fr}
ul.meet img{grid-row:1/4;width:54px;height:81px;object-fit:cover;object-position:50% 14%;background:#12131a}
ul.meet b{font-size:15.5px;font-weight:600;letter-spacing:.08em}
ul.meet span{font-size:11.5px;letter-spacing:.18em;color:rgb(var(--ember))}
ul.meet p{margin:2px 0 0;font-size:12.5px;line-height:1.75;color:rgba(236,229,214,.72);display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}

/* 有原画的时代：开头是一整幅这个时代的原画，正文从画底下升上来 */
#pg-hd{display:none}
#page.cg #pg-wrap{display:block;overflow-y:auto}
#page.cg #pg-art{position:sticky;top:0;height:min(66vh,128vw);display:block;background:#04050a;cursor:zoom-in}
#page.cg #pg-art img{width:100%;height:100%;max-width:none;object-fit:cover;object-position:50% 50%;box-shadow:none;opacity:0;transition:opacity .9s;transform:scale(calc(1.02 + .06*var(--p,0)));filter:brightness(calc(1 - .62*var(--p,0)))}
#page.cg #pg-art img.in{opacity:1}
#page.cg #pg-art::after{display:block;pointer-events:none;background:radial-gradient(70% 62% at 8% 92%,rgba(4,5,10,.78) 0,rgba(4,5,10,.42) 45%,rgba(4,5,10,0) 78%),linear-gradient(180deg,rgba(4,5,10,.34) 0,rgba(4,5,10,0) 24%,rgba(4,5,10,0) 44%,rgba(5,6,11,.97) 100%)}
#page.cg #pg-hd{display:block;position:absolute;z-index:1;left:max(22px,env(safe-area-inset-left,0px));right:22px;bottom:22px;text-shadow:0 2px 16px rgba(0,0,0,.9),0 0 3px rgba(0,0,0,.6);pointer-events:none}
#page.cg #pg-body{position:relative;z-index:2;margin:0;max-width:none;height:auto;overflow:visible;background:#05060b;padding-top:2px}
@keyframes cgpan{0%{object-position:50% 50%}32%{object-position:10% 50%}82%{object-position:90% 50%}100%{object-position:50% 50%}}
@keyframes cgin{from{transform:scale(1.1)}to{transform:scale(1.02)}}
#pg-art .cue{display:none}
.ln ol.road{display:grid;grid-template-columns:1fr;gap:16px}
.ln ol.road li{padding:0}
.ln ol.road li::before,.ln ol.road li::after{display:none}
.ln ol.road li.txt{padding:2px 0 2px 22px}
.ln ol.road li.txt::before{display:block}
.cgb{all:unset;box-sizing:border-box;display:block;position:relative;width:100%;aspect-ratio:3/2;overflow:hidden;cursor:zoom-in;background:#0b0c12}
.cgb img{display:block;width:100%;height:100%;object-fit:cover;transition:transform .9s}
.cgb:hover img{transform:scale(1.035)}
.cgb::after{content:'';position:absolute;inset:0;background:linear-gradient(180deg,rgba(4,5,10,0) 50%,rgba(4,5,10,.88) 100%);pointer-events:none}
.cgb .cap{position:absolute;left:16px;right:16px;bottom:13px;z-index:1;display:flex;align-items:baseline;gap:6px 14px;flex-wrap:wrap;text-shadow:0 1px 10px rgba(0,0,0,.9)}
.cgb .cap b{margin:0;font-size:12px;font-weight:600;letter-spacing:.3em;color:rgb(var(--ember))}
.cgb .cap i{font-style:normal;font-size:19px;font-weight:600;letter-spacing:.22em;color:#f6e9d2}
.cgb:focus-visible{outline:2px solid rgb(var(--ember));outline-offset:2px}
.ln ol.road li.cgi p{margin:9px 0 0;font-size:13px;line-height:1.8;letter-spacing:.04em;color:rgba(236,229,214,.72)}
/* 点开一幅原画：竖屏上整幅顶满屏高，横着拖着看 */
#cgv{position:absolute;inset:0;z-index:6;background:rgba(2,3,6,.97);opacity:0;transition:opacity .3s;cursor:zoom-out}
#cgv.on{opacity:1}
#cgv[hidden]{display:none}
#cgv .pan{position:absolute;inset:0;overflow:auto;display:flex;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;touch-action:pan-x pan-y;scrollbar-width:none}
#cgv .pan::-webkit-scrollbar{display:none}
#cgv img{display:block;flex:none;margin:auto;max-width:100%;max-height:100%}
#cgv .cap{position:absolute;left:max(18px,env(safe-area-inset-left,0px));right:18px;bottom:max(18px,env(safe-area-inset-bottom,0px));pointer-events:none;text-shadow:0 2px 14px #000,0 0 3px #000}
#cgv .cap b{display:block;font-size:12px;font-weight:600;letter-spacing:.3em;color:rgb(var(--ember))}
#cgv .cap i{display:block;margin-top:5px;font-style:normal;font-size:22px;font-weight:600;letter-spacing:.22em;color:#f6e9d2}
#cgv .cap span{display:block;margin-top:5px;font-size:12.5px;letter-spacing:.06em;color:rgba(236,229,214,.78)}
#cgv .x{all:unset;position:absolute;right:max(14px,env(safe-area-inset-right,0px));top:max(12px,env(safe-area-inset-top,0px));cursor:pointer;font-size:12.5px;letter-spacing:.22em;padding:9px 14px;border:1px solid var(--line);background:rgba(4,5,10,.6)}
#cgv .nav{all:unset;position:absolute;top:50%;transform:translateY(-50%);cursor:pointer;width:44px;height:64px;display:flex;align-items:center;justify-content:center;font-size:22px;color:rgba(236,229,214,.7);background:rgba(4,5,10,.38)}
#cgv .nav.l{left:0}#cgv .nav.r{right:0}
#cgv .nav[disabled]{opacity:.18;cursor:default}
#cgv .tip{display:none}
@keyframes cgtip{0%,100%{opacity:0}18%,70%{opacity:1}}
@media (max-aspect-ratio: 1/1){
  #cgv img{height:100%;width:auto;max-width:none;max-height:none}
  #cgv .tip{display:block;position:absolute;left:50%;top:max(16px,env(safe-area-inset-top,0px));transform:translateX(-50%);padding:7px 14px;font-size:12px;letter-spacing:.3em;text-indent:.3em;color:rgba(236,229,214,.86);background:rgba(4,5,10,.55);pointer-events:none;opacity:0;white-space:nowrap}
  #cgv.on .tip{animation:cgtip 3.2s ease-in-out .3s 1}
}
@media (max-aspect-ratio: 23/20){
  #page.cg.on #pg-art img.in{animation:cgpan 52s ease-in-out 1.4s infinite}
}

@media (min-aspect-ratio: 23/20){
  #pg-wrap{display:grid;grid-template-columns:minmax(0,42fr) minmax(0,58fr);overflow:hidden}
  #pg-art{height:100%;display:flex;align-items:center;justify-content:center;background:radial-gradient(ellipse at 50% 50%,rgba(var(--ember),.1),rgba(4,5,10,0) 70%)}

<script>
'use strict';
/* 数据是三份跟页面放在一起的文件：二十七个时代的字（build_data.py 从各页源稿里抽的），每幅画四边空墙的颜色，哪个时代有原画、配在哪一幕（后两份 prep_assets.py 出） */
Promise.all([
  fetch('data/moon.json').then((r) => r.json()),
  fetch('data/tiles.json').then((r) => r.json()).catch(() => ({})),
  fetch('data/cg.json').then((r) => r.json()).catch(() => ({})),
]).then(([D, TG, CG]) => main(D, TG, CG)).catch((e) => {
  console.error(e);
  const p = document.createElement('p');
  p.textContent = '这一页的数据没有载下来，刷新一下再试。';
  p.style.cssText = 'position:fixed;inset:0;z-index:9;display:flex;align-items:center;justify-content:center;margin:0;background:#04050a;color:#ece5d6;font-size:14px;letter-spacing:.2em';
  document.body.appendChild(p);
});
function main(D, TG, CG) {
const ERAS = D.eras, N = ERAS.length;
const Q = new URLSearchParams(location.search);
const SIM = Q.has('sim'), NOGL = Q.has('nogl'), SKIP = Q.has('skip') || SIM;
const $ = (s) => document.querySelector(s);
const view = $('#view'), glc = $('#gl'), fxc = $('#fx'), strip = $('#strip');
const ctx = fxc.getContext('2d');
const KIND = (i) => (i < 15 ? 0 : i < 21 ? 1 : 2);        // 岩画、湿壁画、月银漆
const DEF_G = [[112, 88, 66], [213, 183, 153], [1, 14, 31]];
const ground = (i) => ((TG[ERAS[i].id] || {}).g || DEF_G[KIND(i)]).map((v) => v / 255);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, t) => a + (b - a) * t;
const smooth = (a, b, v) => { const t = clamp((v - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const HOVER = window.matchMedia && matchMedia('(hover:hover) and (pointer:fine)').matches;

/* ---------- 版式 ---------- */
let W = 0, H = 0, DPR = 1, wide = true, TW = 0, TH = 0, TY = 0, GAP = 0, PRO = 0, INTER = 0, RUIN = 0, END = 0, TOTAL = 1, MAXCAM = 0, FLOOR = 0, XB1 = 0, XB2 = 0, XBRK = 0;
const tx = new Float64Array(N);
let secs = [];
let cam = 0, camT = 0, clock = 0, last = 0, started = false, pageOpen = -1;
const torch = { x: 0, y: 0, gx: 0, gy: 0, k: 0, held: false };
const lit = new Float32Array(N), seen = new Uint8Array(N);
let brk = 0, brkOn = false, brkT0 = -1, surge = 0;
let ambRamp = null;          // Float32Array(1024*3)，页面这边也要查墙上某一处有多亮
const RW = 1024;
const center = (i) => tx[i] + TW / 2;
const camFor = (i) => clamp(center(i) - W / 2, 0, MAXCAM);

function layout() {
  const w = view.clientWidth, h = view.clientHeight;
  if (!w || !h) return false;
  const keepI = TOTAL > 1 ? focusIndex() : -1, keepOff = keepI >= 0 ? (cam + W / 2 - center(keepI)) / (TW + GAP) : 0;
  W = w; H = h; wide = W / H >= 1.15;
  DPR = Math.min(window.devicePixelRatio || 1, 1.5);
  const short = H < 500;
  TH = Math.round(wide ? Math.min(H * (short ? 0.57 : 0.64), 680) : Math.min(H * 0.58, (W - 36) * 1.5));
  TW = Math.round(TH * 2 / 3);
  TY = Math.round(wide ? H * (short ? 0.1 : 0.115) : H * 0.125);
  GAP = wide ? Math.round(TW * 0.36) : Math.max(W - TW, Math.round(TW * 0.18));
  PRO = wide ? Math.round(Math.max(W * 0.44, 600)) : W;
  INTER = wide ? Math.round(Math.max(W * 0.42, 580)) : W;
  RUIN = wide ? Math.round(W * 0.8) : Math.round(W * 1.2);
  END = wide ? Math.round(W * 0.55) : W;
  let x = PRO; secs = [{ k: 'p0', x: 0, w: PRO }];
  for (let i = 0; i < N; i++) {
    if (i === 15) { secs.push({ k: 'p1', x, w: INTER }); x += INTER; }
    if (i === 21) { secs.push({ k: 'p2', x, w: INTER }); x += INTER; }
    tx[i] = x + GAP / 2; x += TW + GAP;
  }
  XBRK = x + (wide ? W * 0.12 : W * 0.25);
  secs.push({ k: 'ruin', x, w: RUIN }); x += RUIN;
  secs.push({ k: 'end', x, w: END }); x += END;
  TOTAL = x; MAXCAM = Math.max(0, TOTAL - W);
  FLOOR = TY + TH + (short ? 96 : wide ? 150 : 128);
  XB1 = secs[1].x + INTER * 0.4; XB2 = secs[2].x + INTER * 0.5;
  for (const c of [glc, fxc]) { c.width = Math.round(W * DPR); c.height = Math.round(H * DPR); }
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  buildRamps(); buildStrip();
  if (keepI >= 0) { cam = camT = clamp(center(keepI) + keepOff * (TW + GAP) - W / 2, 0, MAXCAM); }
  torch.gx = torch.x = W / 2; torch.gy = torch.y = TY + TH * 0.45;
  if (gl) gl.viewport(0, 0, glc.width, glc.height);
  return true;
}

/* 墙上的环境光和墙的底色，沿着墙各排成一条：环境光照年代走（长夜、破晓、诸国的一天、辉塔的永昼），底色跟着每幅画四边的空墙 */
function ramp(keys, n) {
  keys.sort((a, b) => a[0] - b[0]);
  const out = new Float32Array(RW * n);
  let j = 0;
  for (let i = 0; i < RW; i++) {
    const x = i / (RW - 1) * TOTAL;
    while (j < keys.length - 2 && keys[j + 1][0] <= x) j++;
    const a = keys[j], b = keys[Math.min(j + 1, keys.length - 1)];
    const t = b[0] > a[0] ? clamp((x - a[0]) / (b[0] - a[0]), 0, 1) : 0;
    for (let c = 0; c < n; c++) out[i * n + c] = lerp(a[1 + c], b[1 + c], t);
  }
  return out;
}
let rampA8 = null, rampW8 = null;
function buildRamps() {
  const WARM = [1, .82, .62], ROSE = [1, .86, .7], MORN = [1, .95, .86], NOON = [1, 1, 1], AFT = [1, .97, .9], EVE = [1, .86, .68], DUSK = [1, .74, .62], NIGHT = [.55, .66, 1], COLD = [.86, .97, 1], DAY = [.9, .98, 1];
  const A = [], amb = (x, l, c) => A.push([x, c[0] * l, c[1] * l, c[2] * l]);
  amb(0, .035, WARM);
  for (let i = 0; i < 14; i++) amb(center(i), .062, WARM);
  amb(tx[14], .085, WARM); amb(center(14), .2, ROSE); amb(tx[14] + TW, .36, ROSE);
  amb(XB1, .7, MORN);
  [[.9, MORN], [1, NOON], [.98, AFT], [.8, EVE], [.56, DUSK], [.14, NIGHT]].forEach((v, k) => amb(center(15 + k), v[0], v[1]));
  amb(XB2, .07, NIGHT);
  amb(center(21), .16, NIGHT); amb(tx[22] - GAP * .7, .3, COLD); amb(center(22), .95, COLD);
  for (let i = 23; i < N; i++) amb(center(i), 1, DAY);
  amb(TOTAL, 1, DAY);
  ambRamp = ramp(A, 3);
  const Wk = [], wall = (x, g, t) => Wk.push([x, g[0], g[1], g[2], t]);
  wall(0, ground(0), 0);
  for (let i = 0; i < N; i++) wall(center(i), ground(i), KIND(i) / 2);
  wall(XB1 - 26, ground(14), 0); wall(XB1 + 26, ground(15), .5);
  wall(XB2 - 26, ground(20), .5); wall(XB2 + 26, ground(21), 1);
  wall(TOTAL, ground(N - 1), 1);
  const wr = ramp(Wk, 4);
  rampA8 = new Uint8Array(RW * 4); rampW8 = new Uint8Array(RW * 4);
  for (let i = 0; i < RW; i++) {
    for (let c = 0; c < 3; c++) { rampA8[i * 4 + c] = clamp(Math.round(ambRamp[i * 3 + c] * 255), 0, 255); rampW8[i * 4 + c] = clamp(Math.round(wr[i * 4 + c] * 255), 0, 255); }
    rampA8[i * 4 + 3] = 255; rampW8[i * 4 + 3] = clamp(Math.round(wr[i * 4 + 3] * 255), 0, 255);
  }
  if (gl) { upRamp(texA, rampA8); upRamp(texW, rampW8); }
}
function ambAt(x) {            // 墙上这一处的环境光有多亮（0 到 1），算上最后一年的暗
  const i = clamp(Math.round(x / TOTAL * (RW - 1)), 0, RW - 1);
  return (ambRamp[i * 3] * .3 + ambRamp[i * 3 + 1] * .59 + ambRamp[i * 3 + 2] * .11) * (1 - .965 * brk);
}

/* ---------- 跟着墙走的字 ---------- */
const PIAN = (a, b) => ERAS.slice(a, b).map((e) => e.title).join('，') + '。';
function buildStrip() {
  strip.style.width = TOTAL + 'px';
  let h = '';
  const P = D.parts;
  const tone = (x, g) => (ambAtRaw(x) * (g[0] * .3 + g[1] * .59 + g[2] * .11) > .34 ? 'ink' : 'pale');
  for (const s of secs) {
    const st = `left:${s.x}px;width:${s.w}px;top:${TY}px;height:${TH}px`;
    if (s.k === 'p0') h += `<div class="sec pale" style="${st}"><h2>${P[0].name}</h2><div class="tx"><p class="line">${P[0].line}</p><p class="sub">${P[0].sub}</p><p class="desc">${esc(ERAS[0].pianDesc || '')}</p><p class="how">持火向右而行。墙上每一幅画都是一个年代，点一下，走进去。</p></div></div>`;
    else if (s.k === 'p1') h += `<div class="sec ${tone(s.x + s.w * .6, ground(15))}" style="${st};padding-left:${Math.round(s.w * .36)}px"><h2>${P[1].name}</h2><div class="tx"><p class="line">${P[1].line}</p><p class="sub">${P[1].sub}</p><p class="desc">${PIAN(15, 21)}</p></div></div>`;
    else if (s.k === 'p2') h += `<div class="sec pale" style="${st}"><h2>${P[2].name}</h2><div class="tx"><p class="line">${P[2].line}</p><p class="sub">${P[2].sub}</p><p class="desc">${PIAN(21, 27)}</p></div></div>`;
    else if (s.k === 'ruin') h += `<div class="sec ruin pale" id="ruin" style="${st}"><blockquote>“看啊，我的功业已成！<br>欢呼吧，世界将因我而不再燃烧！”</blockquote><p>月银纪 10081 年，归寂月。两块大陆上的灯里，响起同一句话。</p></div>`;
    else if (s.k === 'end') h += `<div class="sec end pale" id="endsec" style="${st}"><p class="line">天黑以后，火畔仍有一只摇篮。</p><p class="sub">下一面墙 · 纷争纪</p></div>`;
  }
  for (let i = 0; i < N; i++) {
    const e = ERAS[i], song = e.part === 0;
    const third = song ? esc(e.lines[0] ? e.lines[0].ti : '') : `${'一二三四五六'[e.lines.length - 1] || e.lines.length}个入口`;
    h += `<div class="lab ${tone(center(i), ground(i))}" data-i="${i}" style="left:${tx[i] - GAP * .3}px;width:${TW + GAP * .6}px;top:${TY + TH + (H < 500 ? 9 : wide ? 20 : 15)}px"><small>${e.label}　${e.years} 年</small><b>${esc(e.title)}</b><i>${third}</i></div>`;
  }
  strip.innerHTML = h;
  labs = Array.from(strip.querySelectorAll('.lab'));
}
function ambAtRaw(x) { const i = clamp(Math.round(x / TOTAL * (RW - 1)), 0, RW - 1); return ambRamp[i * 3] * .3 + ambRamp[i * 3 + 1] * .59 + ambRamp[i * 3 + 2] * .11; }
let labs = [];

/* 底下那一排刻度 */
const rail = $('#rail');
(function buildRail() {
  let h = '';
  [[0, 15], [15, 21], [21, 27]].forEach(([a, b], k) => {
    h += `<div class="grp" data-n="${D.parts[k].name}">`;
    for (let i = a; i < b; i++) h += `<button data-i="${i}" title="${esc(ERAS[i].label + ' ' + ERAS[i].title)}" aria-label="${esc(ERAS[i].label + ' ' + ERAS[i].title)}"></button>`;
    h += '</div>';
  });
  rail.innerHTML = h;
})();
const ticks = Array.from(rail.querySelectorAll('button'));
rail.addEventListener('click', (e) => { const b = e.target.closest('button'); if (b) { go(+b.dataset.i); touched(); } });
for (const ev of ['pointerdown', 'pointerup', 'pointermove']) rail.addEventListener(ev, (e) => e.stopPropagation());

/* ---------- WebGL ---------- */
let gl = null, prog = null, U = {}, texNoise = null, texA = null, texW = null, quad = null;
const VS = 'attribute vec2 aP;uniform vec4 uQuad;void main(){gl_Position=vec4(uQuad.xy+aP*uQuad.zw,0.,1.);}';
const FS = `
#ifdef GL_FRAGMENT_PRECISION_HIGH
precision highp float;
#else
precision mediump float;
#endif
uniform vec2 uRes; uniform float uDpr, uTime, uHas, uLit, uFade, uBreak, uSurge, uFloor, uCamR, uInvT, uPhase;
uniform vec3 uOff; uniform vec2 uOffC;
uniform sampler2D uNoise, uRampA, uRampW, uTile;
uniform vec4 uRect; uniform vec4 uTorch; uniform vec3 uGround;
uniform vec4 uFire[8]; uniform vec3 uFireC[8];
float lum(vec3 c){ return dot(c, vec3(.299,.587,.114)); }
void main(){
  vec2 p = vec2(gl_FragCoord.x, uRes.y*uDpr - gl_FragCoord.y)/uDpr;
  float n1 = texture2D(uNoise, vec2(p.x/1900. + uOff.x, p.y/1900.)).r;
  vec2 q2 = vec2(p.x/600. + uOff.y, p.y/600. + .37);
  float n2 = texture2D(uNoise, q2).g;
  float n3 = texture2D(uNoise, vec2(p.x/256. + uOff.z, p.y/256. + .11)).b;
  float rx = p.x*uInvT + uCamR + (n1 - .5)*70.*uInvT;
  vec3 amb = texture2D(uRampA, vec2(rx, .5)).rgb;
  vec4 rw = texture2D(uRampW, vec2(rx, .5));
  float lac = smoothstep(.7, .95, rw.a), cave = 1. - smoothstep(.05, .3, rw.a);
  float rough = mix(mix(.3, 1., cave), .14, lac);
  float v = n1*.5 + n2*.32 + n3*.18 - .5;
  vec3 wall = rw.rgb * (1. + v*.64*rough);
  float hx = texture2D(uNoise, q2 + vec2(2./600., 0.)).g - n2;
  float hy = texture2D(uNoise, q2 + vec2(0., 2./600.)).g - n2;
  vec3 N = normalize(vec3(-hx*10.*rough, -hy*10.*rough, 1.));
  vec3 alb = wall; float emis = 0., own = 0.;
  if (uHas > .5) {
    vec2 uv = (p - uRect.xy)/uRect.zw;
    vec3 t = texture2D(uTile, uv).rgb;
    float f = mix(mix(.03, .12, cave), .01, lac);
    float ir = ((n2 - .5)*1.7 + (n3 - .5)*.5)*f*cave;
    float m = smoothstep(0., f, min(uv.x, 1. - uv.x) + ir)*smoothstep(0., f*.6, min(uv.y, 1. - uv.y) + ir*.6);
    float kd = length(t - uGround);
    float paint = mix(smoothstep(mix(.05, .07, cave), mix(.15, .2, cave), kd), 1., lac);
    m *= paint*uFade;
    alb = mix(wall, t*(1. + v*.22*rough*cave), m);
    float l = lum(t);
    float dx = lum(texture2D(uTile, uv + vec2(1.5/uRect.z, 0.)).rgb) - l;
    float dy = lum(texture2D(uTile, uv + vec2(0., 1.5/uRect.w)).rgb) - l;
    N = normalize(N + vec3(-dx, -dy, 0.)*2.4*m*(1. - lac));
    float sat = max(t.r, max(t.g, t.b)) - min(t.r, min(t.g, t.b));
    emis = smoothstep(.5, .86, l)*(1. - smoothstep(.22, .5, sat))*lac*m;
    own = uLit*m*cave;
  }
  vec2 wq = vec2(n2 - .5, n3 - .5)*42.;
  float c1 = texture2D(uNoise, vec2((p.x + wq.x)/900. + uOffC.x, (p.y + wq.y)/900. + .63)).a;
  float c2 = texture2D(uNoise, vec2((p.x - wq.y)/380. + uOffC.y, (p.y + wq.x)/380. + .29)).a;
  float k1 = abs(c1 - .5), k2 = abs(c2 - .53);
  float crack = max(1. - smoothstep(0., .011, k1), (1. - smoothstep(0., .008, k2))*.75);
  float halo = max(1. - smoothstep(0., .06, k1), (1. - smoothstep(0., .035, k2))*.5);
  float chip = smoothstep(.68, .71, c2*.5 + n2*.5);
  float B = uBreak*lac;
  alb = mix(alb, vec3(.13, .125, .14)*(1. + v*1.5), B*.42);
  alb = mix(alb, vec3(.16, .15, .15)*(1. + v*1.5), chip*B*.8);
  alb *= 1. - crack*B*.95;
  vec3 L = amb*(1. - .965*uBreak)*(1. + uSurge*1.4);
  float day = smoothstep(.22, .8, lum(L));
  L += vec3(1., .74, .48)*own*.2;
  vec2 d = uTorch.xy - p; float r = length(d)/uTorch.w;
  float att = exp(-r*r*1.5)*uTorch.z*(1. - day);
  vec3 ld = normalize(vec3(d, uTorch.w*.5));
  L += vec3(1., .70, .40)*att*(.3 + 1.05*max(dot(N, ld), 0.));
  for (int i = 0; i < 8; i++) {
    vec4 fr = uFire[i];

function sync() {

    labs[f] && labs[f].classList.add('on'); ticks[f].classList.add('cur'); sync.f = f;
  }

  const show = brk > .5;

}
sync.f = -1; sync.p = -1; sync.r = null;
function frame(dt) {

let frames = 0;
function loop(t) {

/* ---------- 手上的动作 ---------- */
const drag = { on: false, moved: false, x0: 0, y0: 0, cam0: 0, lx: 0, lt: 0, v: 0, id: -1 };

window.addEventListener('keydown', (e) => {

$('#intro').addEventListener('pointerdown', (e) => { e.stopPropagation(); begin(); });

/* ---------- 时代页 ---------- */
const page = $('#page'), pgBody = $('#pg-body'), sheet = $('#sheet');
function epicHTML(e) {

}
/* 一个时代的原画：头一幅是时代原画，后面是主线各幕的节点原画，点开来一幅一幅看 */
const cgv = $('#cgv'), cgImg = cgv.querySelector('img'), cgCap = cgv.querySelector('.cap'), cgPan = cgv.querySelector('.pan');
let cgList = [], cgAt = -1;

  cgImg.onload = mid; cgImg.src = c.src; cgImg.alt = c.name || c.tag;
  cgCap.innerHTML = `<b>${esc(c.tag)}</b>${c.name ? `<i>${esc(c.name)}</i>` : ''}${c.note ? `<span>${esc(c.note)}</span>` : ''}`;
  cgv.querySelector('.nav.l').disabled = k === 0; cgv.querySelector('.nav.r').disabled = k === cgList.length - 1;

cgv.addEventListener('click', (ev) => {

const DEF = {
  cast: '这个时代最有天分的年轻人，时代的弄潮儿，这段故事原本的主人公。',
  meet: '大人与老人。各有一段走完了的来路，往后还会再长，没有踏入传奇，是这段故事的配角。',
  legends: '已然立于凡世之巅的至强者，此刻在世的传奇。他们讲完了自己的故事，是从前的主人公。',
};
const porHTML = (c) => (c.key ? `<img loading="lazy" src="assets/por/${c.key}.webp" alt="${esc(c.name)}">` : `<div class="noimg">${esc(c.name[0])}</div>`);
function lineHTML(e, l, k, cg) {

  const acts = l.acts.map((a) => {

  }).join('');

const pgWrap = $('#pg-wrap'), pgArt = $('#pg-art'), pgImg = $('#pg-img'), pgHd = $('#pg-hd');
let pRaf = 0;
pgWrap.addEventListener('scroll', () => {
  if (pRaf || !page.classList.contains('cg')) return;
  pRaf = requestAnimationFrame(() => { pRaf = 0; pgArt.style.setProperty('--p', clamp(pgWrap.scrollTop / Math.max(1, pgArt.offsetHeight), 0, 1).toFixed(3)); });
}, { passive: true });
pgArt.addEventListener('click', () => { if (page.classList.contains('cg') && cgList.length) showCG(0); });
function openEra(i) {

  if (e.places.length) h += `<h2>这一带</h2><ul class="places">` + e.places.map((p) => `<li><b>${esc(p.name)}</b><span>${esc(p.kind.replace(/（.*/, ''))}</span>${p.where ? `<p>${esc(p.where)}</p>` : ''}${p.later ? `<em>到迷宫纪 1001 年，这里叫${esc(p.later)}</em>` : ''}</li>`).join('') + '</ul>';
  pgBody.innerHTML = `<div class="col">${h}</div>`;
  page.classList.toggle('cg', !!cg);
  pgArt.style.setProperty('--p', '0');
  pgImg.classList.remove('in'); pgImg.onload = () => pgImg.classList.add('in');

  pageOpen = i; seen[i] = 1; ticks[i].classList.add('seen');

}
function closeEra() {

  hideCG();
  page.classList.remove('on'); const i = pageOpen; pageOpen = -1; last = 0;
  setTimeout(() => { if (pageOpen < 0) page.hidden = true; }, 420);
  go(i);
}
$('#pg-close').addEventListener('click', closeEra);
for (const ev of ['pointerdown', 'pointerup', 'pointermove', 'wheel']) page.addEventListener(ev, (e) => e.stopPropagation());
pgBody.addEventListener('click', (ev) => {
  const c = ev.target.closest('.cgb'); if (c) { showCG(+c.dataset.k); return; }
  const b = ev.target.closest('.go'); if (!b) return;
  const e = ERAS.find((x) => x.id === b.dataset.e), l = e.lines[+b.dataset.l];
  sheet.querySelector('.box').innerHTML = `<p class="eyebrow">记下了</p><h3>月银纪 ${esc(l.year || e.years)} 年　${esc(l.name)}</h3><p>${esc(l.ti)}</p><p class="note">往下是建档：在这一纪的火边报上你是谁。这一段还没有接上，样张先到这里。</p><button>好</button>`;
  sheet.hidden = false;
});
sheet.addEventListener('click', (ev) => { if (ev.target === sheet || ev.target.closest('button')) sheet.hidden = true; });

/* ---------- 开 ---------- */
initGL();
function boot() {
  if (!layout()) return false;
  if (Q.has('at')) { go(clamp(+Q.get('at'), 0, N - 1), true); }
  if (SKIP) { $('#intro').style.display = 'none'; begin(); }
  else setTimeout(begin, 2600);
  if (!SIM) requestAnimationFrame(loop);

}
let booted = boot();
const onSize = () => { if (!booted) booted = boot(); else layout(); };
if (window.ResizeObserver) new ResizeObserver(onSize).observe(view); else window.addEventListener('resize', onSize);

window.__bk = {
  get s() { return { W, H, wide, TW, TH, TY, GAP, cam, camT, TOTAL, MAXCAM, brk, surge, gl: !!gl, frames, started, pageOpen, f: focusIndex(), seen: Array.from(seen).reduce((a, b) => a + b, 0), loaded: Array.from(tiles.values()).filter((t) => t.ok).length, bad: Array.from(tiles.entries()).filter(([i, t]) => t.bad).map(([i]) => ERAS[i].id) }; },
  tick(ms) { let n = Math.max(1, Math.round(ms / 16)); while (n--) frame(16); },
  go(i, fast) { go(i, fast !== false); }, cam(x) { cam = camT = clamp(x, 0, MAXCAM); }, camFor, tx, center,

  see(a, b) { for (let i = a; i <= b; i++) { seen[i] = 1; lit[i] = 1; ticks[i].classList.add('seen'); } },
  open: openEra, close: closeEra, begin,
